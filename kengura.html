// 2006 is a Mažylis (grade 3-4) paper and was never audited: out of scope
// for a Bičiulis trainer, so it is not served anywhere (data kept in the file)
const OUT_OF_SCOPE_YEARS = new Set(["2006"]);
const ARCHIVE = ((window.KENGURA_ARCHIVE && window.KENGURA_ARCHIVE.archive) || []).filter(t => !OUT_OF_SCOPE_YEARS.has(String(t.year)));
const ARCHIVE_LOAD_FAILED = !window.KENGURA_ARCHIVE || !Array.isArray(window.KENGURA_ARCHIVE.archive) || window.KENGURA_ARCHIVE.archive.length === 0;

// Pattern label → user-facing Lithuanian label
const PATTERN_LABEL = {
  aritmetika:"Aritmetika", geometrija:"Geometrija", logika:"Logika",
  skaiciavimas:"Skaičiavimas", erdve:"Erdvinis", uzdaviniai:"Žodinis uždavinys",
  seka:"Seka", paveikslelis:"Su paveikslėliu",
};

/* Choose a generator that matches BOTH the question's mechanic and its
   difficulty band. Returns null when nothing matches – the caller is
   expected to fall back to archive cross-links so we never serve a
   3-point arithmetic generator as practice for a 5-point logic puzzle. */
function pickGenForMechBand(mechanic, band){
  const idx = MECH_BAND_INDEX[mechanic];
  if(!idx) return null;
  const sameBand = idx[band];
  if(sameBand && sameBand.length){
    return sameBand[Math.floor(Math.random()*sameBand.length)];
  }
  return null;
}

/* Find archive questions of the same mechanic and SAME points band as `q`,
   excluding q itself. Returns up to `limit` items, newest first.
   Used as the fallback "Praktikuotis šio tipo" path when no generator
   covers the mechanic at the right band. */
/* ---------- Held-out contest papers ----------
   The newest RESERVED_YEAR_COUNT eligible years that have not been played
   as a contest are kept out of every practice picker (playlists, mixed
   sets, recognition drill, race gate, "practice similar") so the contest
   sim measures transfer, not memory. A reserved year is released the
   moment it is played. Tiny mechanics (< 3 questions without the reserved
   years) keep their reserved questions – see archiveQsForMech. */
const RESERVED_YEAR_COUNT = 3;
function reservedYears(){
  const played = new Set((store.contests || []).map(c => String(c.year)));
  return contestEligibleYears()
    .filter(y => !played.has(String(y)))
    .sort((a,b) => String(b).localeCompare(String(a)))
    .slice(0, RESERVED_YEAR_COUNT);
}
function isReservedYear(year){
  return reservedYears().includes(String(year)) || reservedYears().includes(year);
}

/* Nearest trick family for mechanics that have almost no 5-point
   examples of their own (used only when the same-mechanic pool is empty). */
const RELATED_MECHANIC = {
  "multistep-money": "arith-compute", "calendar": "sequence-pattern", "clock": "sequence-pattern",
  "symmetry": "projection", "arrangement": "counting-ways", "place-value": "digit-puzzle",
  "state-game": "invariant", "age-relations": "arith-compute",
};
function findSimilarArchive(q, sourceYear, limit){
  if(!q.mechanic) return [];
  limit = limit || 4;
  const out = [];
  const wantBand = q.points || 3;
  const reserved = new Set(reservedYears().map(String));
  // walk archive newest-first
  for(let i = ARCHIVE.length - 1; i >= 0; i--){
    const t = ARCHIVE[i];
    if(reserved.has(String(t.year)) && t.year !== sourceYear) continue;
    for(const cand of t.questions){
      if(t.year === sourceYear && cand.num === q.num) continue;
      if(cand.mechanic !== q.mechanic) continue;
      if((cand.points || 3) !== wantBand) continue;
      out.push({year: t.year, q: cand});
      if(out.length >= limit) return out;
    }
  }
  return out;
}

/* Public entry point: given an archive question, return a routing decision:
     {kind:"generator", gen:"keyName"}            – open a generator
     {kind:"archive",   items:[{year,q},...]}     – open one of these archive Qs
     {kind:"fallback",  gen:"keyName"}            – last-resort random gen
     {kind:"none"}                                – explicitly suppress
                                                    (5-pt source with no
                                                    band-matched practice)
*/
function pickPracticeFor(q, sourceYear){
  const band = q && (q.points || 3);
  if(q && q.mechanic){
    const gen = pickGenForMechBand(q.mechanic, band);
    if(gen) return {kind:"generator", gen};
    // Try one band UP before giving up on generators: 3-pt sources may get a
    // 4-pt generator, 4-pt sources a 5-pt one. Never step DOWN – for a 5-pt
    // source an easier generator would defeat the whole point.
    if(band !== 5){
      const adj = pickGenForMechBand(q.mechanic, band === 3 ? 4 : 5);
      if(adj) return {kind:"generator", gen:adj};
    }
    let items = findSimilarArchive(q, sourceYear, 4), related = null;
    // a trick with a single 5-pointer in 26 papers: practise the nearest
    // related trick at the same band rather than nothing
    if(!items.length && RELATED_MECHANIC[q.mechanic]){
      related = RELATED_MECHANIC[q.mechanic];
      items = findSimilarArchive(Object.assign({}, q, {mechanic: related}), sourceYear, 4);
    }
    if(items.length) return related ? {kind:"archive", items, related} : {kind:"archive", items};
    // For 5-pt sources, refuse to offer a random fallback – better to
    // show nothing than wrong-band content. Per CLAUDE.md: practicing
    // a 3-pt arithmetic problem after a 5-pt parity puzzle erodes
    // contest stamina.
    if(band === 5) return {kind:"none"};
  }
  // last resort: random generator (only for ≤4 pt questions or for
  // generator-produced questions without a mechanic). Keep the band honest
  // even here – a 4-pt source must not get a 3-pt warm-up as "practice".
  if(band === 5) return {kind:"none"};
  const pool = GENERATOR_KEYS.filter(k => getGenDiff(k) >= band);
  const keys = pool.length ? pool : GENERATOR_KEYS;
  const key = keys[Math.floor(Math.random()*keys.length)];
  return {kind:"fallback", gen:key};
}

  return GENERATOR_KEYS[Math.floor(Math.random()*GENERATOR_KEYS.length)];
}

/* ----------------------------------------------------------------
   AI help (optional) – calls the Netlify function `/help`.
   - localStorage cache by (qid, kind, tier|chosenLetter): once the
     family pays for one hint, the same hint is free forever.
   - Per-session "endpoint dead" flag – if the first call fails
     (404, network error), we don't keep retrying on every click.
   - Fallback: if AI is unavailable, the existing hardcoded
     MECHANIC_HINTS / q.solutionKid / q.misconceptions render as before.
   ---------------------------------------------------------------- */
const AI_ENDPOINT = "/.netlify/functions/help";
const AI_CACHE_PREFIX = "kgr.ai.";
state.aiBusy = state.aiBusy || {};   // key → bool (request in flight)
state.aiText = state.aiText || {};   // key → string (loaded text)
state.aiError = state.aiError || {}; // key → string (last error)
let _aiEndpointDead = false;

function aiCacheKey(opts){
  const tail = opts.kind === "hint" ? `t${opts.tier}` :
               opts.kind === "misconception" ? `c${opts.chosenIdx}` : "_";
  return `${AI_CACHE_PREFIX}${opts.qid}.${opts.kind}.${tail}`;
}

function aiStateKey(opts){
  // separate from cache key – the in-memory bucket per (year, num, kind, tier)
  return aiCacheKey(opts).slice(AI_CACHE_PREFIX.length);
}

function aiReadCache(opts){
  try { return localStorage.getItem(aiCacheKey(opts)); } catch { return null; }
}
function aiWriteCache(opts, text){
  try { localStorage.setItem(aiCacheKey(opts), text); } catch {}
}

async function aiFetch(opts){
  if(_aiEndpointDead) return null;
  const cached = aiReadCache(opts);
  if(cached){ state.aiText[aiStateKey(opts)] = cached; return cached; }

  const sk = aiStateKey(opts);
  if(state.aiBusy[sk]) return null;
  state.aiBusy[sk] = true;
  delete state.aiError[sk];
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify(opts),
    });
    if(r.status === 404){
      _aiEndpointDead = true;
      return null;
    }
    const data = await r.json().catch(() => ({error: "Bad JSON from /help."}));
    if(!r.ok || !data.text){
      state.aiError[sk] = data.error || `HTTP ${r.status}`;
      return null;
    }
    aiWriteCache(opts, data.text);
    state.aiText[sk] = data.text;
    return data.text;
  } catch(e) {
    // network unreachable → endpoint dead for this session
    _aiEndpointDead = true;
    state.aiError[sk] = "AI nepasiekiamas (be tinklo arba ne per Netlify).";
    return null;
  } finally {
    state.aiBusy[sk] = false;
  }
}

function aiTextFor(opts){
  // synchronous lookup for render: cache → in-memory state → null
  return aiReadCache(opts) || state.aiText[aiStateKey(opts)] || null;
}

function aiBuildOpts(year, q, kind, extra){
  const correctIdx = q.correct ? "ABCDE".indexOf(q.correct) : -1;
  return {
    kind,
    qid: `${year}-${q.num}`,
    question: q.prompt || "",
    // archive options are an object keyed by letter, not an array
    options: ["A","B","C","D","E"].map(l => (q.options && q.options[l]) || ""),
    correctIdx: correctIdx >= 0 ? correctIdx : 0,
    mechanic: q.mechanic || null,
    band: q.points || null,
    ...(extra || {}),
  };
}

/* "Gudrybė: <one sentence>." – the opening line of a kid solution is a
   hint aimed at this very question, without giving the numbers away. */
function kidIdeaOf(q){
  const m = q && q.solutionKid && q.solutionKid.match(/^Gudrybė:\s*(.+?[.!?])(\s|$)/);
  if(!m) return null;
  // never hand over the answer: an idea that names the correct value is skipped
  const val = String((q.options || {})[q.correct] || "").trim();
  if(val && val.length <= 8){
    const esc = val.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if(new RegExp("(^|[^\\d,])" + esc + "($|[^\\d,])").test(m[1])) return null;
  }
  return m[1];
}
function approachFromSolution(sol){
  if(!sol) return "";
  // Solutions begin with the answer value (e.g. "8" or "Pomidorus") followed
  // by either "!" (approach) or "?" (alternative).  We start AT the first
  // such marker so the answer never bleeds into the hint.
  const parsed = parseOfficialSolution(sol);
  let s = (parsed.parts[0] ? parsed.parts[0].text : sol).trim();
  // also strip a stray leading punctuation
  s = s.replace(/^[\s,;:.-]+/, "");
  // Take only the first sentence to keep the hint a *strategy*, not a
  // walk-through that hands the answer over.  Fall back to a 140-char
  // hard cap if no sentence break exists yet.
  const firstEnd = s.search(/[.?!]\s/);
  if(firstEnd > 30){
    s = s.slice(0, firstEnd + 1);
  } else if(s.length > 140){
    s = s.slice(0, 140) + "…";
  }
  return s;
}

/* Keyboard + swipe for the focus mode: ← → between questions, A–E / 1–5
   picks an option, Enter checks. Installed once; acts only on that view. */
(function wireArchiveFocusKeys(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  const active = () => state.view === "archiveYear" && !store.settings.archiveList && !document.querySelector(".fig-zoom");
  const card = () => document.querySelector(".archive-card:not([hidden])");
  document.addEventListener("keydown", e => {

    const k = e.key;
    if(k === "ArrowLeft" || k === "ArrowRight"){
      const b = document.getElementById(k === "ArrowLeft" ? "archPrev" : "archNext");
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
      return;
    }
    const L = /^[a-eA-E]$/.test(k) ? k.toUpperCase() : /^[1-5]$/.test(k) ? "ABCDE"[Number(k) - 1] : null;
    if(L){ const o = c.querySelector(`.opt[data-letter="${L}"]`); if(o){ e.preventDefault(); o.click(); } return; }
    if(k === "Enter" && !(e.target && e.target.closest && e.target.closest("button,summary,a,[role=button]"))){
      const s = c.querySelector("[data-action=submit]") || c.querySelector("[data-next-q]");
      if(s){ e.preventDefault(); s.click(); }
    }
  });
  let sx = null, sy = 0;
  document.addEventListener("touchstart", e => {
    sx = null;
    if(!active() || e.touches.length !== 1 || (e.target.closest && e.target.closest(".ptable-wrap,.contest-strip,canvas"))) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive: true});
  document.addEventListener("touchend", e => {
    if(sx == null || !active()) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if(Math.abs(dx) < 80 || Math.abs(dy) > 50) return;
    const b = document.getElementById(dx < 0 ? "archNext" : "archPrev");
    if(b && !b.disabled) b.click();
  }, {passive: true});
})();

function renderArchiveYear(){
  const test = ARCHIVE.find(t => t.year === state.archiveYear);
  if(!test){ state.view="home"; renderHome(); return; }
  // count answered + correct in this year so far
  const total = test.questions.length;
  let answered = 0, correct = 0;
  test.questions.forEach(q => {
    const key = `${test.year}-${q.num}`;
    const a = state.archiveAnswers[key];
    if(a && a.chosen != null){
      answered++;
      // don't require option text – image-only questions have empty option strings
      if(q.correct && a.chosenLetter === q.correct) correct++;
    }
  });
  const pdfHref = test.solutions_pdf ? encodeURI(test.solutions_pdf) : (test.test_pdf ? encodeURI(test.test_pdf) : null);
  const isNew = q => !(state.archiveAnswers[`${test.year}-${q.num}`] || {}).submitted && !(store.seenQ || {})[`${test.year}-${q.num}`];
  const firstNew = test.questions.find(isNew);
  const newN = test.questions.filter(isNew).length;
  const visible = test.questions.filter(q => !state._archiveOnlyNew || isNew(q) || (state.archiveAnswers[`${test.year}-${q.num}`] || {}).chosen != null);
  // One question at a time (2026-10-17): a whole paper as one page was
  // ~18 000 px of scrolling on a phone. Every card is still rendered (wiring
  // and smoke checks see all of them); only the current one is not [hidden].
  const focus = !store.settings.archiveList && visible.length > 0;
  const cur = focus ? archiveFocusNum(test, visible, firstNew) : null;
  const pos = focus ? visible.findIndex(q => q.num === cur) : -1;
  if(focus){
    // time on the question starts when the kid first sees it (shown after "Patikrinti")
    const k = `${test.year}-${cur}`, a = state.archiveAnswers[k] || {};
    if(!a.submitted && !a.shownAt) state.archiveAnswers[k] = {...a, shownAt: Date.now()};
  }
  const pipCls = q => {
    const a = state.archiveAnswers[`${test.year}-${q.num}`] || {};
    return a.submitted ? (a.chosenLetter === q.correct ? ' good' : ' bad') : (a.chosen != null ? ' filled' : '');
  };
  $app.innerHTML = `
    <section class="card">
      <button class="nav-back" id="back">← Į pradžią</button>
      <h2>${escapeHTML(test.title)}</h2>
      <div class="top-stats">
        <span class="pill">${total} ${pluralForm(total,'uždavinys','uždaviniai','uždavinių')}</span>
        ${answered ? `<span class="pill good">${correct}/${answered} teisingai</span>` : ``}
        ${test.test_pdf ? `<a class="pill" style="text-decoration:none" href="${encodeURI(test.test_pdf)}" target="_blank">Testo PDF ↗</a>` : ``}
        ${test.solutions_pdf ? `<a class="pill" style="text-decoration:none" href="${encodeURI(test.solutions_pdf)}" target="_blank">Sprendimai ↗</a>` : ``}
      </div>
      ${focus ? '' : `<p>Pasirink atsakymą ir spausk „Patikrinti“. Užstrigai? „Užuomina“ parodys, nuo ko pradėti, bet atsakymo nepasakys.</p>`}
      <div class="row" style="gap:8px;flex-wrap:wrap">${!focus && firstNew && firstNew.num > 1 ? `<button class="btn small" id="archContinue" data-q="${firstNew.num}">Tęsti nuo ${firstNew.num} uždavinio →</button>` : ''}${newN && newN < total ? `<button class="btn small ${state._archiveOnlyNew ? 'primary' : 'ghost'}" id="archOnlyNew" aria-pressed="${!!state._archiveOnlyNew}">${state._archiveOnlyNew ? `Rodomi tik neišspręsti (${newN}) – rodyti visus` : `Tik neišspręsti (${newN})`}</button>` : ''}<button class="btn small ghost" id="archLayout" title="${focus ? 'Visi uždaviniai vienas po kito' : 'Po vieną uždavinį ekrane'}">${focus ? '☰ Visi sąraše' : '▣ Po vieną'}</button></div>
      ${focus ? `<div class="contest-strip arch-strip" role="group" aria-label="Uždaviniai">${visible.map(q => `<button class="contest-pip${pipCls(q)}${q.num === cur ? ' current' : ''}" data-goq="${q.num}"${q.num === cur ? ' aria-current="step"' : ''} aria-label="${q.num} uždavinys">${q.num}</button>`).join('')}</div>` : ''}
    </section>
    ${visible.map(q => renderArchiveCard(test.year, q, focus ? {hidden: q.num !== cur, next: visible[pos + 1] || null} : null)).join("")}
    ${(() => {
      // closure: the whole paper is answered → a short summary by block
      const keyed = test.questions.filter(q => q.correct);
      if(!keyed.length || !keyed.every(q => (state.archiveAnswers[`${test.year}-${q.num}`] || {}).submitted)) return '';
      const by = {3: [0, 0], 4: [0, 0], 5: [0, 0]};
      for(const q of keyed){ const b = by[q.points] || by[3]; b[1]++; if(state.archiveAnswers[`${test.year}-${q.num}`].chosenLetter === q.correct) b[0]++; }
      const open = Object.values(store.mistakes || {}).filter(m => !m.fixedAt && String(m.year) === String(test.year)).length;
      return `<section class="card paper-done" style="border:1px solid var(--good);background:var(--good-soft)">
        <h3 style="margin-top:0">🏁 ${escapeHTML(String(test.year))} m. uždaviniai išspręsti</h3>
        <div class="grid two" style="grid-template-columns:repeat(3,1fr)">${[3, 4, 5].filter(b => by[b][1]).map(b => `<div class="stat"><b>${by[b][0]}/${by[b][1]}</b><span>${b} t. blokas</span></div>`).join('')}</div>
        <p style="margin:10px 0 0">${open ? `Suklysti uždaviniai (${open}) sugrįš pakartojimui – juos rasi ir 📒 Klaidų sąsiuvinyje.` : 'Visi atsakymai teisingi – šiuose metuose klaidų nėra.'}</p>
      </section>`;
    })()}
    ${focus ? `<nav class="arch-nav" aria-label="Uždavinių naršymas">
      <button class="btn" id="archPrev" ${pos > 0 ? '' : 'disabled'} aria-label="Ankstesnis uždavinys">←</button>
      <span class="arch-pos">${pos + 1} / ${visible.length}<span class="wide-only kbd-hint"> · <kbd>A</kbd>–<kbd>E</kbd> atsakymas, <kbd>Enter</kbd> tikrinti, <kbd>←</kbd> <kbd>→</kbd></span></span>
      <button class="btn${(state.archiveAnswers[`${test.year}-${cur}`] || {}).submitted ? ' primary' : ''}" id="archNext" ${pos < visible.length - 1 ? '' : 'disabled'} aria-label="Kitas uždavinys">Kitas →</button>
    </nav>` : ''}
    <section class="card"><div class="footer-actions">
      <button class="btn ghost" id="back2">← Į pradžią</button>
    </div></section>
  `;
  document.getElementById("back").addEventListener("click", ()=>{state.view="home"; renderHome();});
  document.getElementById("back2").addEventListener("click", ()=>{state.view="home"; renderHome();});
  const archOnlyNew = document.getElementById("archOnlyNew");
  if(archOnlyNew) archOnlyNew.addEventListener("click", ()=>{ state._archiveOnlyNew = !state._archiveOnlyNew; renderArchiveYear(); });
  centerStripPip();
  document.getElementById("archLayout").addEventListener("click", ()=>{
    store.settings.archiveList = !store.settings.archiveList; saveStore(store); renderArchiveYear();
  });
  const archContinue = document.getElementById("archContinue");
  if(archContinue) archContinue.addEventListener("click", ()=>{
    const el = document.querySelector(`.archive-card[data-qnum="${archContinue.dataset.q}"]`);
    if(el) el.scrollIntoView({behavior:smoothScroll(), block:"start"});
  });
  if(focus){
    $app.querySelectorAll("[data-goq]").forEach(b => b.addEventListener("click", () => goArchiveQ(Number(b.dataset.goq))));
    const prev = document.getElementById("archPrev"), next = document.getElementById("archNext");
    if(prev) prev.addEventListener("click", () => pos > 0 && goArchiveQ(visible[pos - 1].num));
    if(next) next.addEventListener("click", () => pos < visible.length - 1 && goArchiveQ(visible[pos + 1].num));
    $app.querySelectorAll("[data-next-q]").forEach(b => b.addEventListener("click", () => goArchiveQ(Number(b.dataset.nextQ))));
  }

  // wire up per-card listeners
  $app.querySelectorAll(".archive-card").forEach(card=>{
    const qnum = parseInt(card.dataset.qnum, 10);
    const year = card.dataset.year;
    const key = `${year}-${qnum}`;
    const test = ARCHIVE.find(t=>t.year===year);
    const q = test.questions.find(x=>x.num===qnum);
    const ans = state.archiveAnswers[key] || {};

    card.querySelectorAll(".opt[data-letter]").forEach(opt=>{
      opt.addEventListener("click", ()=>{
        if(ans.submitted) return;
        const letter = opt.dataset.letter;
        if(letter === ans.firstWrong) return;   // already ruled out on the first try
        state.archiveAnswers[key] = {...ans, chosen: letter, chosenLetter: letter};
        renderArchiveYear();
      });
    });

    card.querySelectorAll("[data-why]").forEach(b => b.addEventListener("click", ()=>{
      const m = (store.mistakes || {})[key];
      if(m){ m.reason = b.dataset.why; m.reasons = m.reasons || {}; m.reasons[b.dataset.why] = (m.reasons[b.dataset.why] || 0) + 1; saveStore(store); }
      renderArchiveYear();
    }));

    const hintBtn = card.querySelector("[data-action=hint]");
    if(hintBtn) hintBtn.addEventListener("click", ()=>{
      const curA = state.archiveAnswers[key] || {};
      if(tryFirstPending(q, curA)){
        // productive struggle: an early first tap gets questions to ask
        // yourself; the next tap opens the hint (never a lock)
        state.archiveAnswers[key] = {...curA, tryFirstNote: true};
        renderArchiveYear();
        return;
      }
      const tier = Math.min(3, (state.archiveAnswers[key]?.hintTier || 0) + 1);
      state.archiveAnswers[key] = {...(state.archiveAnswers[key]||{}), hintTier: tier};
      renderArchiveYear();
      // Fire AI fetch in parallel – render shows hardcoded blurb first,
      // then re-renders with the AI-specific text once it arrives.
      if(!_aiEndpointDead && q.correct && !q.solutionKid){
        const opts = aiBuildOpts(year, q, "hint", {tier});
        if(!aiTextFor(opts)){
          aiFetch(opts).then(() => renderArchiveYear());
        }
      }
    });

    card.querySelectorAll("[data-conf]").forEach(btn => {
      btn.addEventListener("click", ()=>{
        const cur = state.archiveAnswers[key] || {};
        state.archiveAnswers[key] = {...cur, confidence: btn.dataset.conf};
        renderArchiveYear();
      });
    });

    card.querySelectorAll("[data-se]").forEach(b => b.addEventListener("click", ()=>{
      const pick = b.dataset.se;
      state.archiveAnswers[key] = {...(state.archiveAnswers[key] || {}), seAnswer: pick};
      if(pick !== "skip"){
        const s = store.selfExplain = store.selfExplain || {a: 0, ok: 0};
        s.a++; if(pick === "own") s.ok++;
        saveStore(store);
      }
      renderArchiveYear();
    }));

    const revealBtn = card.querySelector("[data-action=reveal]");
    if(revealBtn) revealBtn.addEventListener("click", ()=>{
      const cur = state.archiveAnswers[key] || {};
      state.archiveAnswers[key] = {...cur, submitted: true, chosen: cur.firstWrong, chosenLetter: cur.firstWrong};
      noteSecondTry(false);
      renderArchiveYear();
    });

    const submitBtn = card.querySelector("[data-action=submit]");
    if(submitBtn) submitBtn.addEventListener("click", ()=>{
      const cur = state.archiveAnswers[key] || {};
      if(cur.chosenLetter == null) return;
      const took = cur.shownAt ? Math.round((Date.now() - cur.shownAt) / 1000) : 0;
      const right = cur.chosenLetter === q.correct;
      // Second try (Beast Academy style): the first miss is recorded as a miss,
      // but the solution waits – the wrong option is crossed out and the kid
      // gets the note on that slip and one more go.
      const firstTry = !cur.firstWrong;
      if(q.correct && !right && firstTry){
        state.archiveAnswers[key] = {...cur, firstWrong: cur.chosenLetter, chosen: null, chosenLetter: null};
      } else {
        state.archiveAnswers[key] = {...cur, submitted: true, tookSec: took > 0 && took < 1800 ? took : null};
      }
      // legacy: record into pattern-level catStats (kept for backwards compat)
      if(firstTry && q.correct && q.patterns && q.patterns.length){
        const cat = q.patterns[0];
        const c = store.catStats[cat] = store.catStats[cat] || {attempts:0, wrong:0};
        c.attempts++;
        if(cur.chosenLetter !== q.correct) c.wrong++;
        saveStore(store);
      }
      // mechanic-level stats + spaced-repetition queue + confidence
      if(q.correct && !firstTry) noteSecondTry(right);
      if(q.correct){
        if(firstTry) recordArchiveAnswer(year, q, right, cur.confidence);
        Sfx.play(right ? "correct" : "wrong");
      }
      renderArchiveYear();
      try {
        const v = document.querySelector(`.archive-card[data-year="${year}"][data-qnum="${qnum}"] .verdict`);
        if(v && v.scrollIntoView) v.scrollIntoView({behavior: smoothScroll(), block: "center"});
        if(v && v.focus) v.focus({preventScroll: true});
      } catch(_){}
    });

    const practiceBtn = card.querySelector("[data-practice]");
    if(practiceBtn) practiceBtn.addEventListener("click", ()=>{
      state._returnTo = "archiveYear";
      openSimilar(practiceBtn.dataset.practice);
    });
    const practiceArchiveBtn = card.querySelector("[data-practice-archive]");
    if(practiceArchiveBtn) practiceArchiveBtn.addEventListener("click", ()=>{
      // Re-compute on click so the year/q is fresh.
      const items = findSimilarArchive(q, year, 4);
      if(!items.length){ return; }
      // Pick a random one to jump to its year, then scroll to that question.
      const target = items[Math.floor(Math.random()*items.length)];
      state.archiveYear = target.year;
      state.archiveFocus = state.archiveFocus || {};
      state.archiveFocus[target.year] = target.q.num;
      state.view = "archiveYear";
      renderArchiveYear();
      if(!store.settings.archiveList){ goArchiveQ(target.q.num); return; }
      // Scroll into view on next tick.
      setTimeout(()=>{
        const el = document.querySelector(`.archive-card[data-year="${target.year}"][data-qnum="${target.q.num}"]`);
        if(el){
          el.scrollIntoView({behavior:smoothScroll(), block:"start"});
          el.style.outline = "3px solid var(--accent)";
          setTimeout(()=>{ el.style.outline = ""; }, 2500);
        }
      }, 60);
    });
  });
}

/* Self-explanation after a right answer (2026-10-17): on about half of the
   right first-try 4/5-pointers the kid picks which idea solved it – this
   question's own "Gudrybė:" line or one from a question with another trick.
   Explaining a correct solution is the cheap half of self-explanation that
   the "why did you slip?" chips never reach. */
function keyHash(s){ return [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7); }
let _seIdeas = null;
function selfExplainFor(year, q){
  const own = (q.points || 3) >= 4 ? kidIdeaOf(q) : null;
  if(!own || !q.mechanic) return null;
  const h = keyHash(`${year}-${q.num}`);
  if(h % 2) return null;
  if(!_seIdeas){
    _seIdeas = [];
    for(const t of ARCHIVE) for(const x of t.questions){
      const idea = (x.points || 3) >= 4 && x.mechanic ? kidIdeaOf(x) : null;
      if(idea) _seIdeas.push({mech: x.mechanic, idea});
    }
  }
  const pool = _seIdeas.filter(o => o.mech !== q.mechanic && o.idea !== own);
  if(!pool.length) return null;
  const other = pool[(h >>> 3) % pool.length];
  return {own, other: other.idea, otherMech: other.mech, ownFirst: !((h >>> 1) % 2)};
}

function noteSecondTry(right){
  const s = store.secondTry = store.secondTry || {a: 0, ok: 0};
  s.a++; if(right) s.ok++;
  saveStore(store);
}

/* Try first (2026-10-17): on a 4/5-pointer seen less than this long ago the
   first hint tap shows self-questions instead of the hint. Productive-failure
   research: a short struggle before help makes the help stick. */
const TRY_FIRST_SEC = {4: 45, 5: 90};
const TRY_FIRST_NOTE_HTML = `<div class="hint try-first"><b>Prieš užuominą – trys klausimai sau:</b>
      <ol style="margin:6px 0 0 18px;padding:0"><li>Ko tiksliai klausia? Pasakyk savais žodžiais.</li><li>Ką žinau? Užsirašyk skaičius arba nusipiešk.</li><li>Ar galiu patikrinti atsakymų variantus arba išbandyti mažesnį atvejį?</li></ol>
      <div style="margin-top:6px">Jei vis tiek nežinai, nuo ko pradėti, spausk „Užuomina“ dar kartą.</div></div>`;
function tryFirstPending(q, a){
  const need = TRY_FIRST_SEC[q.points];
  return !!(need && a && a.shownAt && !a.tryFirstNote && !a.firstWrong && !(a.hintTier > 0)
    && Date.now() - a.shownAt < need * 1000);
}

function renderArchiveCard(year, q, focusOpts){
  const key = `${year}-${q.num}`;
  const ans = state.archiveAnswers[key] || {};
  const submitted = !!ans.submitted;

  // Image-option rendering: when option text is empty (placeholder/bogus
  // extraction), the choice is a picture in the figure. Render JUST the
  // letter circle so the kid taps it after looking at the figure.
  const isImageOnly = !!q.imageOnlyOptions;
  const hasMixed = !!q.hasMissingOptionText;
  const imageHint = isImageOnly
    ? `<p class="help-bar" style="margin:0 0 6px"><b>Atsakymai – paveikslėlyje.</b> Pažymėk raidę pagal pasirinktą pavyzdį.</p>`
    : (hasMixed ? `<p class="help-bar" style="margin:0 0 6px">Kai kurie atsakymai – paveikslėlyje (be teksto). Pažymėk raidę.</p>` : '');
  const optionsHtml = ["A","B","C","D","E"].map(letter=>{
    const vRaw = q.options[letter];
    if(vRaw == null) return "";
    const v = String(vRaw);
    const isEmptyOpt = v.trim() === "";
    let extra = "";
    if(submitted){
      if(q.correct === letter) extra = " correct";
      else if(ans.chosenLetter === letter || ans.firstWrong === letter) extra = " wrong";
    } else if(ans.firstWrong === letter){
      extra = " struck";
    } else if(ans.chosenLetter === letter){
      extra = " selected";
    }
    const off = (!submitted && ans.firstWrong === letter ? ' disabled aria-disabled="true"' : '') + (extra === ' selected' ? ' aria-pressed="true"' : '');
    if(isImageOnly){
      // Just letter pill, large enough to tap
      return `<button type="button" class="opt opt-letter-only${extra}" data-letter="${letter}"${off}>
        <span class="letter">${letter}</span>
      </button>`;
    }
    return `<button type="button" class="opt${isEmptyOpt ? ' opt-empty' : ''}${extra}" data-letter="${letter}"${off}>
      <span class="letter">${letter}</span>
      <span>${isEmptyOpt ? '<i style="color:var(--muted)">– atsakymas paveikslėlyje –</i>' : escapeHTML(v)}</span>
    </button>`;
  }).join("");

  // The old keyword tags ("Logika", "Skaičiavimas") are coarse, sometimes
  // contradict the reviewed trick tag and hint at it before solving: only the
  // trick pill is shown (after an answer or a hint for 4/5-pointers).
  const tags = "";
  // Mechanic pill (a finer-grained classification than the legacy patterns).
  // Seeing the trick IS the 4/5-point skill: name it only after an answer
  // or once the kid asks for a hint (the hints talk about it anyway).
  const mechShown = submitted || (ans.hintTier || 0) > 0 || (q.points || 3) === 3;
  const mechPill = q.mechanic
    ? (mechShown
        ? `<span class="pill" title="Užduoties tipas">${escapeHTML(MECHANIC_LABEL[q.mechanic]||q.mechanic)}</span>`
        : `<span class="pill muted" title="Gudrybės pavadinimą pamatysi atsakęs arba paprašęs užuominos">Gudrybė: ?</span>`)
    : "";
  const practice = pickPracticeFor(q, year);

  // Hint ladder: 4 tiers per mechanic – notice → ask → suggest → tell.
  // The 4th tier is the per-question full solution.
  const hints = (q.mechanic && MECHANIC_HINTS[q.mechanic]) || null;
  const hintTier = ans.hintTier || 0;   // 0..3
  const tierLabels = ["Pastebėk", "Klausimas sau", "Pasiūlymas", "Pilnas sprendimas"];

  // Misconception line: when wrong answer is submitted, look up
  // q.misconceptions[chosenLetter] and surface it.
  const wrongLetter = submitted && ans.chosenLetter !== q.correct ? ans.chosenLetter : null;
  // a miss on the first try keeps its note after a right second try
  const missLetter = wrongLetter || (submitted ? ans.firstWrong : null) || null;
  const miscText = missLetter && q.misconceptions && q.misconceptions[missLetter]
    ? q.misconceptions[missLetter] : null;

  // AI text resolution – prefer per-question AI text over generic blurb.
  const aiHint = (tier) => q.correct && q.mechanic
    ? aiTextFor(aiBuildOpts(year, q, "hint", {tier})) : null;
  const aiHintBusy = (tier) => {
    const opts = aiBuildOpts(year, q, "hint", {tier});
    return state.aiBusy[aiStateKey(opts)];
  };
  const fallbackHint = {1: hints?.notice, 2: hints?.ask, 3: hints?.suggest};
  const renderHintTier = (tier) => {
    // the last tier names THIS question's trick when a kid solution has one
    const own = tier === 3 ? kidIdeaOf(q) : null;
    // AI hints are a fallback for questions without a reviewed kid solution
    const ai = own || q.solutionKid ? null : aiHint(tier);
    const fb = fallbackHint[tier];
    const text = own || ai || fb;
    if(!text){
      return aiHintBusy(tier)
        ? `<div class="hint tier-${tier}"><b>${tierLabels[tier-1]}:</b> <i>kraunasi…</i></div>`
        : "";
    }
    const aiTag = ai ? ` <span class="pill" title="AI sugeneruota užuomina šiam uždaviniui" aria-label="sugeneruota dirbtinio intelekto" style="font-size:12px">AI</span>` : "";
    const busyTag = !ai && aiHintBusy(tier) ? ` <i style="color:var(--muted);font-size:12px">(kraunasi geresnė…)</i>` : "";
    return `<div class="hint tier-${tier}"><b>${tierLabels[tier-1]}:</b>${aiTag} ${escapeHTML(text)}${busyTag}</div>`;
  };

  // Solution + misconception – prefer curated, fall back to AI when missing.
  const wrongIdx = wrongLetter ? "ABCDE".indexOf(wrongLetter) : -1;
  let aiSolutionText = null;
  let aiMiscText = null;
  if(submitted && q.correct){
    // AI writes without the figure – only when there is no human solution at all
    if(!q.solutionKid && !q.solution){
      const sOpts = aiBuildOpts(year, q, "solution");
      aiSolutionText = aiTextFor(sOpts);
      if(!aiSolutionText && !state.aiBusy[aiStateKey(sOpts)] && !_aiEndpointDead){
        aiFetch(sOpts).then(() => renderArchiveYear());
      }
    }
    // A blind guess at "your mistake" is worse than none: skip picture options.
    // Every question has a reviewed kid solution now; an AI "your mistake"
    // note (written without the figure) is only asked for when there is none.
    if(!q.solutionKid && wrongLetter && wrongIdx >= 0 && !miscText && !q.imageOnlyOptions && (q.options || {})[wrongLetter]){
      const mOpts = aiBuildOpts(year, q, "misconception", {chosenIdx: wrongIdx});
      aiMiscText = aiTextFor(mOpts);
      if(!aiMiscText && !state.aiBusy[aiStateKey(mOpts)] && !_aiEndpointDead){
        aiFetch(mOpts).then(() => renderArchiveYear());
      }
    }
  }

  let bottom = "";
  if(submitted){
    const right = ans.chosenLetter === q.correct;
    const finalMiscText = miscText || aiMiscText;
    const miscIsAi = !miscText && !!aiMiscText;
    const finalSolutionText = q.solutionKid || q.solution || aiSolutionText;
    const solutionIsAi = !q.solutionKid && !q.solution && !!aiSolutionText;
    const opener = right ? '' : growthOpenerFor(q);
    const confidentWrong = !right && ans.confidence === 'a';
    const se = right && !ans.firstWrong ? selfExplainFor(year, q) : null;
    const seHold = !!(se && !ans.seAnswer);   // the solution's 💡 line would give it away
    const seBlock = !se ? '' : !ans.seAnswer
      ? `<div class="explain self-explain"><b>Kuri mintis tave atvedė prie atsakymo?</b>
          <div class="se-opts">${(se.ownFirst ? ['own', 'other'] : ['other', 'own']).map(w => `<button class="btn small ghost se-opt" data-se="${w}">${escapeHTML(se[w])}</button>`).join('')}</div>
          <button class="btn small ghost" data-se="skip" style="margin-top:6px">Praleisti</button></div>`
      : ans.seAnswer === 'own'
        ? `<div class="help-bar">✓ Taip – būtent ši mintis veda į atsakymą: ${escapeHTML(se.own)}</div>`
        : ans.seAnswer === 'other'
          ? `<div class="help-bar">Ne visai – ta mintis iš kito uždavinio (${escapeHTML(MECHANIC_LABEL[se.otherMech] || se.otherMech)}). Šiam tiko: <b>${escapeHTML(se.own)}</b></div>`
          : '';
    bottom = `<div class="explain verdict" role="status" tabindex="-1" style="background:${right?'var(--good-soft)':'var(--bad-soft)'};border:1px solid ${right?'var(--good)':'var(--bad)'};">
        <b>${right ? (ans.firstWrong ? "✓ Teisingai – iš antro karto." : "✓ Teisingai.") : "Ne šis atsakymas."}</b>${right && (q.points || 3) >= 4 && q.mechanic && MECHANIC_LABEL[q.mechanic] ? ` Pastebėjai gudrybę – <b>${escapeHTML(MECHANIC_LABEL[q.mechanic])}</b>.` : ''}
        ${q.correct ? ` Teisingas atsakymas – <b>${q.correct}</b>${q.options[q.correct]?` (${escapeHTML(q.options[q.correct])})`:''}.` : ''}
        ${opener ? `<div class="opener" style="margin-top:6px;font-size:13px;font-style:italic">${escapeHTML(opener)}</div>` : ''}
        ${confidentWrong ? `<div style="margin-top:6px;font-size:13px"><b>Buvai tikras, bet suklydai</b> – čia dažniausiai slepiasi klaidingas supratimas, ne atsitiktinė klaida. Perskaityk sprendimą ypač atidžiai: šis uždavinys sugrįš jau rytoj.</div>` : ''}
        ${finalMiscText ? `<div class="misconception" style="margin-top:6px;font-size:13px"><b>${right ? 'Pirmą kartą' : 'Tavo klaida'}:</b>${miscIsAi?' <span class="pill" aria-label="sugeneruota dirbtinio intelekto" style="font-size:12px">AI</span>':''} ${escapeHTML(finalMiscText)}</div>` : ''}
      </div>
      ${!right || ans.firstWrong ? (() => {
        // self-explanation: the kid names why it went wrong (stored in the notebook)
        const m = (store.mistakes || {})[key];
        const picked = m && m.reason;
        return `<div class="why-wrong" style="margin:8px 0">${picked
          ? `<span class="help-bar" style="margin:0">Užrašyta: ${escapeHTML(MISTAKE_REASONS[picked] || picked)}. Ačiū – žinant priežastį lengviau jos išvengti.</span>`
          : `<b style="font-size:14px">Kodėl, manai, suklydai?</b><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px">${Object.entries(MISTAKE_REASONS).map(([id, t]) => `<button class="btn small ghost" data-why="${id}">${escapeHTML(t)}</button>`).join('')}</div>`}</div>`;
      })() : ''}
      ${seBlock}
      ${finalSolutionText && !seHold ? `<div class="explain">${solutionBlockHTML(q, aiSolutionText, solutionIsAi)}</div>` : ''}
    `;
  } else {
    // Show all unlocked hint tiers, accumulated.
    const blocks = [];
    if(ans.tryFirstNote && !hintTier) blocks.push(TRY_FIRST_NOTE_HTML);
    if(ans.firstWrong){
      const note = q.misconceptions && q.misconceptions[ans.firstWrong];
      blocks.push(`<div class="explain verdict retry" role="status" tabindex="-1" style="background:var(--bad-soft);border:1px solid var(--bad)">
        <b>Ne ${ans.firstWrong}.</b> Pabandyk dar kartą – vieną variantą jau atmetei.
        ${ans.confidence === 'a' ? `<div style="margin-top:6px">🎯 <b>Buvai tikras</b> – tokia klaida vertingiausia: perskaityk sąlygą iš naujo ir rask vietą, kur samprotavimas nuėjo ne ten.</div>` : ''}
        ${note ? `<div class="misconception" style="margin-top:6px"><b>Kur galėjo slėptis klaida:</b> ${escapeHTML(note)}</div>` : ''}
        <div class="row" style="margin-top:8px"><button class="btn small ghost" data-action="reveal">Rodyti sprendimą</button></div>
      </div>`);
    }
    if(hintTier >= 1) blocks.push(renderHintTier(1));
    if(hintTier >= 2) blocks.push(renderHintTier(2));
    if(hintTier >= 3) blocks.push(renderHintTier(3));
    bottom = blocks.filter(Boolean).join("");
  }

  const canSubmit = q.correct && ans.chosenLetter && !submitted;
  // Confidence picker – respects the same "Klausti pasitikėjimo" setting as
  // quiz mode; only shown when the kid has chosen but not yet submitted.
  const askConf = !!store.settings.askConfidence;
  const showConfidence = askConf && canSubmit && !ans.confidence;
  const confLabels = {a: "Tikrai žinau", b: "Spėju iš dviejų", c: "Atsitiktinai"};
  const conf = ans.confidence || null;
  // Practice button. Three cases:
  //   - generator at the right mechanic+band → single button → opens generator
  //   - no generator but archive matches      → button opens an archive picker
  //   - last-resort random generator (no mechanic on the question, or
  //     5-point source with no in-band generator and no archive hit) →
  //     show with a quiet warning so the kid knows it's just an example
  let practiceBtn = "";
  if(practice.kind === "generator"){
    practiceBtn = `<button class="btn small" data-practice="${practice.gen}" title="Sugeneruotas to paties tipo uždavinys">Praktikuotis šio tipo</button>`;
  } else if(practice.kind === "archive"){
    practiceBtn = practice.related
      ? `<button class="btn small" data-practice-archive="1" title="Šios gudrybės 5 t. uždavinių archyve daugiau nėra – giminingos gudrybės (${escapeHTML(MECHANIC_LABEL[practice.related] || practice.related)}) to paties sudėtingumo uždavinys (yra ${practice.items.length})">Panašus uždavinys (gimininga gudrybė)</button>`
      : `<button class="btn small" data-practice-archive="1" title="Tos pačios gudrybės ir to paties sudėtingumo uždavinys iš kitų metų (yra ${practice.items.length})">Panašus uždavinys</button>`;
  } else if(practice.kind === "fallback"){
    practiceBtn = `<button class="btn small ghost" data-practice="${practice.gen}" title="Tikslaus to paties tipo generatoriaus dar nėra – tai tik kitas šio sudėtingumo uždavinys">Praktikuotis (kito tipo)</button>`;
  } else {
    // kind: "none" – 5-pt source with no in-band practice available.
    // Show a small explanation instead of a misleading random suggestion.
    practiceBtn = `<span class="help-bar" title="Šio tipo 5 t. generatoriaus dar nėra. Pasirink kitą gudrybę ar archyvo metus.">Atskiro to paties tipo uždavinio nėra – pasirink mokytis šios gudrybės.</span>`;
  }
  return `
    <section class="card archive-card" data-year="${year}" data-qnum="${q.num}"${focusOpts && focusOpts.hidden ? ' hidden' : ''}>
      <div class="qmeta">
        <b>${q.num} uždavinys</b>
        <span class="pill">${q.points} t.</span>
        ${mechPill}
        ${(() => { const m = (store.mistakes || {})[key]; return m && !m.fixedAt && !(submitted && (m.times || 0) <= 1) ? `<span class="pill bad" title="Šiame uždavinyje jau buvai suklydęs – dabar proga ištaisyti">📒 kartoji${m.times > 1 ? ` ×${m.times}` : ''}</span>` : ''; })()}
        ${tags}
      </div>
      ${questionBodyHTML(q)}
      ${imageHint}
      <div class="options${isImageOnly ? ' image-options' : ''}">${optionsHtml}</div>
      ${!submitted && ans.chosenLetter && (q.points || 3) === 5 && !ans.firstWrong ? `<p class="help-bar" style="margin:6px 0 0">Prieš tikrindamas: ar atsakymas tinka sąlygai? Įstatyk jį atgal ir patikrink vieną skaičių.</p>` : ''}
      ${bottom}
      ${showConfidence ? `<div class="confidence-row" role="radiogroup" aria-label="Kiek esi tikras?">
        <span class="help-bar" style="margin:0 8px 0 0">Kiek esi tikras?</span>
        ${["a","b","c"].map(c => `<button class="btn small ghost" role="radio" aria-checked="false" data-conf="${c}">${confLabels[c]}</button>`).join("")}
      </div>` : ''}
      ${conf ? `<div class="help-bar">Pasitikėjimas: <b>${confLabels[conf]}</b></div>` : ''}
      ${submitted && ans.tookSec ? (() => {
        // metacognition: how long it took vs the contest budget for this band
        const budget = PACE_SEC[q.points] || PACE_SEC[4];
        return `<div class="help-bar">⏱ Sprendei ${fmtMs(ans.tookSec * 1000)} · konkurse ${q.points} t. uždaviniui verta skirti iki ~${String(Math.round(budget / 6) / 10).replace('.', ',')} min${ans.tookSec > budget * 1.5 ? ' – konkurse tokį verta praleisti ir grįžti vėliau' : ''}.</div>`;
      })() : ''}
      <div class="footer-actions">
        <div class="row">
          ${!submitted && q.correct && (hints || !_aiEndpointDead) && hintTier < 3 ? `<button class="btn small ghost" data-action="hint">Užuomina (${hintTier+1}/3)</button>` : ''}
          ${!q.correct ? `<span class="help-bar">Šiems metams atsakymo nėra – pasitikrink PDF.</span>` : ''}
        </div>
        <div class="row">
          ${canSubmit && (!askConf || conf) ? `<button class="btn small primary" data-action="submit">Patikrinti</button>` : ''}
          ${practiceBtn}
          ${submitted && focusOpts && focusOpts.next ? `<button class="btn small primary" data-next-q="${focusOpts.next.num}">Kitas uždavinys →</button>` : ''}
        </div>
      </div>
    </section>
  `;
}

/* ============================================================
   VIII. RENDERING
   ============================================================ */
const $app = document.getElementById("app");

/* Home is split into tabs (2026-10-12): one long page had grown to 14
   cards. All panes are rendered; a tab switch only toggles [hidden], so
   every button keeps its wiring and the smoke test sees the whole page. */
const HOME_TABS = [
  {id: 'today',    icon: '🏠', label: 'Šiandien'},
  {id: 'learn',    icon: '🧠', label: 'Gudrybės'},
  {id: 'tests',    icon: '📝', label: 'Konkursas'},
  {id: 'practice', icon: '📚', label: 'Uždaviniai'},
  {id: 'me',       icon: '⭐', label: 'Prizai'},
];
function setHomeTab(id, opts){
  if(!HOME_TABS.some(t => t.id === id)) return;
  state.homeTab = id;
  $app.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== id; });
  $app.querySelectorAll('[data-tab]').forEach(b => {
    const on = b.dataset.tab === id;
    b.classList.toggle('on', on); if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if(!(opts && opts.keepScroll)) try { window.scrollTo(0, 0); } catch(_){}
}

function renderHome(){
  topUpQueueFromNotebook();
  state._planStep = null;   // returning home aborts any plan-step attribution
  state._resultsFromPlan = false;
  // Mechanic-level weakness (replaces legacy subStats panel)
  const weakMechs = weakestMechanics(6).filter(w => w.rate > 0 && w.showAttempts >= 4);
  // Spaced-repetition queue: how many items are due today
  const due = dueNow();

  const last = store.sessions[store.sessions.length-1];
  const totalAns = totalQuestionsAnswered() + Object.values(store.catStats).reduce((a,c)=>a+c.attempts,0);
  const kengura = store.settings.count === 30;
  const minutes = Math.round(store.settings.count * 2.5);

  // 14-day activity grid (kid-facing)
  const activityCells = [];
  for(let i = 13; i >= 0; i--){
    const k = dateKeyOffset(i);
    const a = store.activity[k];
    let lvl = 0;
    if(a){
      if(a.answered >= 20) lvl = 3;
      else if(a.answered >= 10) lvl = 2;
      else if(a.answered >= 1) lvl = 1;
    }
    const isToday = (i === 0);
    activityCells.push(`<span class="act-cell lvl${lvl}${isToday?' today':''}" title="${k}: ${a?(a.answered+' atsakyta'):'tuščia'}"></span>`);
  }

  // Mission candidates, priority-ordered. The kid gets the TOP one plus
  // an alternative – choice drives persistence better than assignment.
  const gapDays = daysSinceLastActivity();
  const longAbsence = (gapDays !== null && gapDays >= 14);
  const missions = [];
  if(!ARCHIVE_LOAD_FAILED){
    if(longAbsence) missions.push({
      tag: 'Sugrįžimas',
      title: `Su sugrįžimu! Nesimatėme ${gapDays} d.`,
      body: 'Pradėk lengvai: 3 paprasti uždaviniai prieš grįžtant prie pakartojimų.',
      cta: 'Pradėti apšilimą', action: 'graceWarmup', style: 'warm',
    });
    if(daysToContest() != null){
      const steps = planStepsForToday();
      const pd = store.planDone[todayKey()] || {};
      const nextStep = steps.find(s => !pd[s.id]);
      if(nextStep) missions.push({
        tag: `Šiandienos planas · ${steps.filter(s => pd[s.id]).length}/${steps.length}`,
        title: nextStep.label,
        body: `${PLAN_PHASE[planPhase()].icon} ${PLAN_PHASE[planPhase()].label}${daysToContest() > 0 ? ` · iki konkurso ${daysToContest()} d.` : ''} · ~${planMinutes([nextStep])} min`,
        cta: nextStep.act === 'none' ? 'Pažymėti' : nextStep.act === 'strategy' ? 'Skaityti' : 'Pradėti', action: 'planStep', actionData: nextStep.id, style: 'primary',
      });
    }
    if(due.length) missions.push({
      tag: 'Pakartojimas',
      title: `Šiandien laukia ${due.length} ${pluralForm(due.length,'uždavinys','uždaviniai','uždavinių')}`,
      body: 'Juose jau buvai suklydęs – pažiūrėkime, ar dabar pavyks.',
      cta: 'Pradėti pakartojimą', action: 'due', style: 'primary',
    });
    if(needsSpeedWork()) missions.push({
      tag: 'Greitis',
      title: '3 taškų sprintas',
      body: 'Paskutiniuose testuose 3 t. uždaviniai užtrunka per ilgai. 10 uždavinių per 10 min – konkurse jie greiti taškai.',
      cta: 'Bėgti sprintą', action: 'sprint', style: 'primary',
    });
    if(weakMechs && weakMechs.length){
      const w = weakMechs[0];
      missions.push({
        tag: 'Silpniausia vieta',
        title: MECHANIC_LABEL[w.mech] || w.mech,
        body: `Klaidų: ${Math.round(100*w.rate)} %. Viena serija su pavyzdžiu dažnai padeda šiai gudrybei tapti lengvesnei.`,
        cta: 'Mokytis', action: 'playlist', actionData: w.mech, style: 'primary',
      });
    }
    if(totalAns === 0) missions.push({
      tag: 'Pradžia',
      title: 'Pirmieji Kengūros uždaviniai',
      body: 'Tikri konkurso uždaviniai, po vieną. Pradėk nuo lengviausių – 3 taškų. Užstrigęs spausk „Užuomina“.',
      cta: 'Pradėti', action: 'firstPaper', style: 'primary',
    });
    const nextT = nextMechanicTarget();
    if(nextT) missions.push({
      tag: masteredBandOf(nextT.mech) ? 'Kilti lygiu' : 'Nauja gudrybė',
      title: `${MECHANIC_LABEL[nextT.mech] || nextT.mech}${nextT.band < mechTopBand(nextT.mech) ? ` (${nextT.band} t.)` : ''}`,
      body: masteredBandOf(nextT.mech) ? `Jau įveikei ${masteredBandOf(nextT.mech)} t. lygį – dabar ${nextT.band} t.` : 'Kitas žingsnis tavo mokymosi take – nauja gudrybė.',
      cta: 'Mokytis', action: 'playlist', actionData: nextT.mech, actionBand: nextT.band, style: 'primary',
    });
    if(Object.keys(store.mechRecent || {}).length >= 2) missions.push({
      tag: 'Mišri treniruotė',
      title: 'Atpažink gudrybę pats',
      body: 'Uždaviniai be gudrybės pavadinimo – kaip tikrame konkurse.',
      cta: 'Mišrus rinkinys', action: 'mixed', style: 'primary',
    });
    missions.push({
      tag: 'Toliau',
      title: 'Klaidų pakartoti nėra',
      body: 'Šiandien nieko nelaukia. Pabandyk naują testą arba pasirink gudrybę skiltyje „Gudrybės“.',
      cta: 'Pradėti testą', action: 'newTest', style: 'ghost',
    });
  }
  const mission = missions[0] || null;
  const altMission = mission
    ? missions.find(m => m !== mission && (m.action !== mission.action || m.actionData !== mission.actionData)) || null
    : null;
  // Recent mastery – show today's mastered mechanics if any
  const todayMastered = Object.entries(store.masteredMech || {})
    .filter(([m, t]) => {
      return dateKeyOf(new Date(t)) === todayKey();   // local day, not UTC
    })
    .map(([m]) => m);

  // Mechanics ordered for the playlist menu: 5-point-bearing mechanics
  // first (the contest's hard block), then 4pt, then 3pt-only.
  const mechBands = {};
  for(const t of ARCHIVE){
    for(const q of t.questions){
      if(!q.mechanic) continue;
      mechBands[q.mechanic] = mechBands[q.mechanic] || new Set();
      mechBands[q.mechanic].add(q.points || 3);
    }
  }
  const mechsForPlaylist = Object.keys(MECHANIC_METHODOLOGY)
    .filter(m => mechBands[m])
    .sort((a,b)=>{
      const aHas5 = mechBands[a].has(5) ? 0 : (mechBands[a].has(4) ? 1 : 2);
      const bHas5 = mechBands[b].has(5) ? 0 : (mechBands[b].has(4) ? 1 : 2);
      if(aHas5 !== bHas5) return aHas5 - bHas5;
      return (MECHANIC_LABEL[a]||a).localeCompare(MECHANIC_LABEL[b]||b, "lt");
    });

  const tab = HOME_TABS.some(t => t.id === state.homeTab) ? state.homeTab : 'today';
  const pane = id => `<div class="tab-pane" data-pane="${id}"${id === tab ? '' : ' hidden'}>`;
  const tabDots = {
    today: (()=>{ const st = planStepsForToday(); const pd = store.planDone[todayKey()] || {}; return st.some(x => !pd[x.id]); })(),
    tests: !!store.contestInProgress,
    me: (store.games.freeRaces || 0) > 0,
  };
  $app.innerHTML = `
    ${ARCHIVE_LOAD_FAILED ? `
    <section class="card" style="background:var(--bad-soft);border:1px solid var(--bad)">
      <h3 style="margin-top:0">⚠ Duomenų failas nepasiekiamas</h3>
      <p>Nepavyko įkelti <code>kengura-archive.js</code>. Archyvas, kontroliniai ir gudrybės – išjungti, kol failas nebus rastas. Patikrink, ar failas yra šalia <code>kengura.html</code> ir ar puslapis perkrautas „kietai“ (Ctrl+Shift+R).</p>
    </section>` : ``}
    <section class="card hero-top">
      <div class="hero-row">
        <div class="hero-streak" id="heroStreak" role="button" tabindex="0" aria-label="${liveStreak()} d. iš eilės – paspausk, kad sužinotum daugiau" style="cursor:pointer">
          <span class="streak-flame"${liveStreak()>0 ? '' : ' style="opacity:.3;filter:grayscale(1)"'}>🔥</span>
          <span class="streak-num">${liveStreak()}</span>
          <span class="streak-label">d. iš eilės</span>
          ${(()=>{ const left = 2 - ((store.streak.freezeMonth === monthKey()) ? (store.streak.freezesUsed || 0) : 0); return left > 0 ? `<span class="streak-label" title="Praleista diena serijos nenutraukia – ${left} kart${left === 1 ? 'ą' : 'us'} šį mėnesį">❄️${left}</span>` : ''; })()}
        </div>
        <div class="hero-streak" id="heroStars" role="button" tabindex="0" aria-label="${(store.stars && store.stars.total) || 0} žvaigžd. – paspausk, kad sužinotum daugiau" title="Iš viso žvaigždžių · laisvų parduotuvei: ${starsAvailable()}" style="cursor:pointer">
          <span class="streak-flame">⭐</span>
          <span class="streak-num">${(store.stars && store.stars.total) || 0}</span>
          <span class="streak-label">${pluralForm((store.stars && store.stars.total) || 0,'žvaigždė','žvaigždės','žvaigždžių')}${(store.plan && store.plan.weeklyStarGoal) ? ` · sav. ${starsThisWeek()}/${store.plan.weeklyStarGoal}` : ''}</span>
        </div>
        <div class="hero-activity" aria-label="Pastarųjų 14 dienų aktyvumas">
          ${activityCells.join('')}
        </div>
        ${META.profiles.length > 1 ? `<span class="pill" title="Aktyvus profilis – keisti tėvų rodinyje">👤 ${escapeHTML(activeProfileName() || 'pagrindinis')}</span>` : ''}
        <button class="btn small ghost" id="mistakeBookBtn" style="margin-left:auto" title="Visi uždaviniai, kuriuose suklydai" aria-label="Klaidų sąsiuvinis${Object.values(store.mistakes || {}).filter(m => !m.fixedAt).length ? ` (${Object.values(store.mistakes || {}).filter(m => !m.fixedAt).length})` : ''}">📒<span class="wide-only"> Klaidos</span>${Object.values(store.mistakes || {}).filter(m => !m.fixedAt).length ? ` (${Object.values(store.mistakes || {}).filter(m => !m.fixedAt).length})` : ''}</button>

/* "15 klausimų · 38 min" — every button that starts a free test says how
   big it is, so 30 questions never come as a surprise. */
function newTestSizeLabel(){
  const n = store.settings.count;
  const mins = (store.settings.kenguraMode || n === 30) ? 75 : Math.round(n * 2.5);
  return `${n} ${pluralForm(n,'uždavinys','uždaviniai','uždavinių')}${store.settings.useTimer ? ` · ${mins} min` : ''}`;
}

function startQuiz(){
  const count = store.settings.count;
  const kengura = store.settings.kenguraMode || count === 30;
  if(kengura){
    state.questions = generateKenguraQuiz(count);
  } else {
    state.questions = generateQuiz(count, store.settings.difficulties);
  }
  state.current = 0;
  state.answers = [];
  state.hintsUsedThis = 0;
  state._chosen = null; state._hintShown = false; state._firstStepShown = false;
  state._confidence = null;
  state._questionStartedAt = Date.now();
  state._sprintMode = false;
  state.view = "quiz";
  if(store.settings.useTimer){
    // Real Kengūra Benjamin: 75 minutes for 30 questions = 2.5 min/q.
    // Scale linearly with count.
    const minutes = Math.round(count * 2.5);
    startTimer(minutes * 60 * 1000);
  } else {
    stopTimer();
  }
  renderQuiz();
}

// Soft re-entry after a long absence (mission action: graceWarmup).
// Generates 3 light (3-point) questions, timer off, hints available –
// avoids drowning the kid in a flooded spaced-rep queue on day one back.
function startGraceWarmup(){
  state.questions = generateQuiz(3, [3]);
  state.current = 0;
  state.answers = [];
  state.hintsUsedThis = 0;
  state._chosen = null; state._hintShown = false; state._firstStepShown = false;
  state._confidence = null;
  state._questionStartedAt = Date.now();
  state._sprintMode = false;
  state.view = "quiz";
  state._graceMode = true;
  stopTimer();
  renderQuiz();
}

// Cache of each generator's nominal difficulty (sampled once with seed=1).
const GEN_DIFF = {};
function getGenDiff(key){
  if(GEN_DIFF[key] != null) return GEN_DIFF[key];
  try{ GEN_DIFF[key] = GENERATORS[key](1).difficulty; }catch(e){ GEN_DIFF[key] = 3; }
  return GEN_DIFF[key];
}

// Build a Kengūra-format quiz: Q1-10 = 3pt, Q11-20 = 4pt, Q21-30 = 5pt.
// For shorter `count`, scale buckets proportionally.
function generateKenguraQuiz(count){
  const third = Math.floor(count/3);
  const buckets = [
    {diff:3, n:third},
    {diff:4, n:third},
    {diff:5, n:count - 2*third},
  ];
  const out = [];
  const rand = rng(Date.now() & 0x7fffffff);
  for(const bucket of buckets){
    const eligible = GENERATOR_KEYS.filter(k => getGenDiff(k) === bucket.diff);
    // Adapt per-key cap to bucket size: a few generators per difficulty
    // need to repeat to fill 10 slots.  Cap = ceil(n / eligible) + slack.
    const cap = eligible.length
      ? Math.max(2, Math.ceil(bucket.n / eligible.length) + 1)
      : 999;
    const used = {};
    let made = 0, safety = 0;
    while(made < bucket.n && safety++ < bucket.n*60){
      const key = eligible.length ? pick(rand, eligible) : pick(rand, GENERATOR_KEYS);
      used[key] = used[key] || 0;
      if(used[key] >= cap) continue;
      const seed = randInt(rand, 1, 9999999);
      const q = buildQuestionFromKey(key, seed);
      out.push(q);
      used[key]++;
      made++;
    }
  }
  return out;
}

          let cls = "opt";
          if(q.imageOptions) cls += " image-opt";
          if(showResult){
            if(i === q.correctIndex) cls += " correct";

          } else if(state._chosen === i){
            cls += " selected";
          }

            ? `<span class="opt-figure">${opt}</span>`
            : `<span>${escapeHTML(opt)}</span>`;
          return `<button type="button" class="${cls}" data-i="${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            ${body}
          </button>`;
        }).join("")}

      ${state._hintShown && !showResult ? `<div class="hint"><b>Užuomina:</b> ${escapeHTML(q.hint)}</div>`:``}

function renderTimerBar(){
  if(!state.timerActive) return "";
  const remaining = Math.max(0, state.timerEndAt - Date.now());
  const totalMs = state.timerTotalMs || 1;
  const mins = Math.floor(remaining/60000);
  const secs = Math.floor((remaining%60000)/1000);
  const ratio = remaining/totalMs;
  const cls = remaining < 60000 ? "warn" : (ratio > 0.5 ? "calm" : "");
  const txt = `${mins}:${String(secs).padStart(2,"0")}`;
  return `<div class="timer-bar">
    <span>⏱</span>
    <span class="clock ${cls}">${txt}</span>
    <span class="grow"></span>
    <span class="help-bar">Liko laiko</span>
  </div>`;
}

function submitAnswer(){
  const idx = state.current;
  const q = state.questions[idx];
  const correct = state._chosen === q.correctIndex;
  const now = Date.now();
  const timeMs = state._questionStartedAt ? (now - state._questionStartedAt) : 0;
  const confidence = state._confidence || null;
  state.answers[idx] = {
    chosen: state._chosen,
    correct,
    hintUsed: !!state._hintShown,
    confidence,
    timeMs,
  };
  // confidence stats – must read confidence BEFORE we reset the state field
  if(confidence && store.confStats[confidence]){
    store.confStats[confidence].attempts++;
    if(!correct) store.confStats[confidence].wrong++;
  }
  state._confidence = null;
  state._questionStartedAt = now;
  logActivity(correct, q.difficulty || 3);
  Sfx.play(correct ? "correct" : "wrong");
  // record per-category and per-subtopic stats
  const c = store.catStats[q.category] = store.catStats[q.category] || {attempts:0, wrong:0};
  c.attempts++;
  if(!correct) c.wrong++;
  if(q.subtopic){
    const s = store.subStats[q.subtopic] = store.subStats[q.subtopic] || {attempts:0, wrong:0, gen:q.gen};
    s.attempts++;
    if(!correct) s.wrong++;
    s.gen = q.gen;
  }
  saveStore(store);
  renderQuiz();
}

function finishQuiz(early){
  stopTimer();
  const correct = state.answers.filter(a => a && a.correct).length;
  const total = state.questions.length;
  // Naive points: reward only.
  const points = state.questions.reduce((acc,q,i)=> acc + (state.answers[i]?.correct ? q.difficulty : 0), 0);
  // Kangaroo-style points with −25% penalty for wrong (only counts answered).
  const pointsWithPenalty = state.questions.reduce((acc,q,i)=>{
    const a = state.answers[i];
    if(!a) return acc;                           // skipped: 0
    if(a.correct) return acc + q.difficulty;     // correct: full
    return acc - q.difficulty * 0.25;            // wrong: −25%
  }, 0);
  // Per-band time tracking
  const bandTime = {3:0, 4:0, 5:0};
  state.questions.forEach((q,i)=>{
    const a = state.answers[i];
    if(!a || !a.timeMs) return;
    bandTime[q.difficulty || 3] = (bandTime[q.difficulty || 3] || 0) + a.timeMs;
  });
  const session = {
    when: Date.now(),
    total, correct, points,
    pointsWithPenalty: Math.round(pointsWithPenalty * 4) / 4,
    bandTime,
    early: !!early,
    sprint: !!state._sprintMode,
    answered: state.answers.filter(a=>a).length,
    questions: state.questions.map((q,i)=>({
      gen:q.gen, category:q.category, subtopic:q.subtopic, difficulty:q.difficulty,
      correct: !!state.answers[i]?.correct,
      hintUsed: !!state.answers[i]?.hintUsed,
      confidence: state.answers[i]?.confidence,
      answered: !!state.answers[i],
    })),
  };
  store.sessions.push(session);
  if(store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
  saveStore(store);
  // Plan credit only for a real attempt: at least half the questions
  // answered (warm-up 2 → 1, sprint 10 → 5). "Pabaigti dabar" on an empty
  // quiz must not tick the step or feed the daily bonus.
  state._resultsFromPlan = !!state._planStep;
  if(session.answered >= Math.ceil(total / 2)) markPlanStepDone();
  else state._planStep = null;
  state.view = "results";
  renderResults();
  // Perfect session (≥ 5 questions, all right) → bonus + confetti.
  if(total >= 5 && correct === total){
    awardBonus(5, "Tobula serija!");
    Fx.celebrate("plan");
  } else if(correct >= Math.ceil(total * 0.7)){
    Sfx.play("badge");
  }
}

function renderResults(){
  const correct = state.answers.filter(a => a?.correct).length;
  const total = state.questions.length;
  const points = state.questions.reduce((acc,q,i)=> acc + (state.answers[i]?.correct ? q.difficulty : 0), 0);
  const maxPoints = state.questions.reduce((a,q)=>a+q.difficulty,0);
  const negativeOn = !!store.settings.negativeScore;
  const pointsWithPenalty = state.questions.reduce((acc,q,i)=>{
    const a = state.answers[i]; if(!a) return acc;
    if(a.correct) return acc + q.difficulty;
    return acc - q.difficulty * 0.25;
  }, 0);

  // Per-band time spent – recommended budget: 1 min on 3-pt, 2.5 min on 4-pt, 5 min on 5-pt.
  const bandTime = {3:0, 4:0, 5:0};
  const bandCount = {3:0, 4:0, 5:0};
  state.questions.forEach((q,i)=>{
    const a = state.answers[i];
    bandCount[q.difficulty || 3]++;
    if(a && a.timeMs) bandTime[q.difficulty || 3] += a.timeMs;
  });
  const bandBudgetSec = {3:60, 4:150, 5:300};

  // Confidence accuracy this session
  const confSummary = {a:{att:0,ok:0}, b:{att:0,ok:0}, c:{att:0,ok:0}};
  state.questions.forEach((q,i)=>{
    const a = state.answers[i]; if(!a || !a.confidence) return;
    if(!confSummary[a.confidence]) return;
    confSummary[a.confidence].att++;
    if(a.correct) confSummary[a.confidence].ok++;
  });

  // category breakdown for this session
  const catBreak = {};
  state.questions.forEach((q,i)=>{
    const c = catBreak[q.category] = catBreak[q.category] || {ok:0, total:0};
    c.total++;
    if(state.answers[i]?.correct) c.ok++;
  });

  const wrongs = state.questions
    .map((q,i)=>({q, ans:state.answers[i], i}))
    .filter(x => !x.ans || !x.ans.correct);

  const answeredCount = state.answers.filter(a=>a).length;
  const earlyNote = answeredCount < total
    ? `<p class="help-bar" style="margin-top:8px">${state._quizTimedOut ? 'Laikas baigėsi' : 'Baigta anksčiau'}: atsakyta ${answeredCount} iš ${total}.</p>`
    : ``;
  const sprintBanner = state._sprintMode ? (()=>{
    const answeredA = state.answers.filter(a => a);
    const ms = answeredA.reduce((a,x)=>a+(x.timeMs||0),0);
    const avg = answeredA.length ? Math.round(ms/1000/answeredA.length) : 0;
    const fast = avg <= 60, sharp = correct >= Math.ceil(total*0.8);
    return `<section class="card">
      <h3>🏃 Sprinto verdiktas</h3>
      <p>Vidutiniškai <b>${avg} s</b> uždaviniui (tikslas – 60 s) · teisingų <b>${correct}/${total}</b>.</p>
      <p class="help-bar">${fast && sharp
        ? '3 taškų blokas – greitas ir tikslus. Šią konkurso dalį jau moki.'
        : !fast
        ? 'Dar lėtoka. 3 taškų uždaviniai konkurse – tavo bankas: spręsk sprintus dažniau, kol veiksmai taps automatiniai.'
        : 'Greitis geras – dabar pagerink tikslumą: geriau 55 s ir teisingai, nei 40 s ir klaida su −25 % bauda.'}</p>
    </section>`;
  })() : '';
  $app.innerHTML = `
    <section class="card">
      <h2>${state._sprintMode ? '🏃 Sprinto rezultatai' : 'Testo rezultatai'}</h2>
      <div class="grid two">
        <div class="stat"><b>${correct} / ${total}</b><span>Teisingų atsakymų</span></div>
        <div class="stat"><b>${points} / ${maxPoints}</b><span>Surinkti taškai</span></div>
        ${negativeOn ? `<div class="stat"><b>${fmtPts(pointsWithPenalty)} / ${maxPoints}</b><span>Su −25 % bauda</span></div>` : ''}
      </div>
      ${earlyNote}
      <div class="footer-actions" style="flex-wrap:wrap;gap:8px;margin-top:12px">
        ${(()=>{
          const next = state._resultsFromPlan ? planNextButtonHTML() : '';
          const size = newTestSizeLabel();
          if(next) return `<button class="btn ghost" id="homeBtn">← Į pradžią</button>
            <button class="btn ghost" id="againBtn" title="Ne plano dalis">Naujas testas (${size})</button>
            ${next}`;
          if(state._resultsFromPlan){
            const reward = planRewardButtonHTML();
            return `<span class="help-bar" style="margin:0">🎉 Šiandienos planas atliktas.</span>
            <button class="btn ghost" id="againBtn">Naujas testas (${size})</button>
            <button class="btn ${reward ? 'ghost' : 'primary'}" id="homeBtn">Į pradžią</button>${reward}`;
          }
          return `<button class="btn ghost" id="homeBtn">← Į pradžią</button>
            <button class="btn primary" id="againBtn">Naujas testas (${size})</button>`;
        })()}
      </div>
    </section>
    ${sprintBanner}
    ${total < 5 ? '<details class="card"><summary><b>Daugiau statistikos</b> <span class="help-bar">tempas, pasitikėjimas, temos</span></summary>' : ''}

    <section class="card">
      <h3>Tempas pagal sudėtingumą</h3>
      <p style="margin-top:0;font-size:13px;color:var(--muted)">Rekomenduojama: 3 t. ≈ 1 min, 4 t. ≈ 2,5 min, 5 t. ≈ 5 min uždaviniui. Atitinka konkurso 75 min / 30 uždavinių.</p>
      ${[3,4,5].map(b => {
        if(!bandCount[b]) return '';
        const sec = Math.round(bandTime[b]/1000);
        const budget = bandBudgetSec[b] * bandCount[b];
        const pct = budget > 0 ? Math.min(150, Math.round(100*sec/budget)) : 0;
        const overrun = sec > budget * 1.25;
        return `<div class="cat-row">
          <span>${b} t. (${bandCount[b]} užd.)</span>
          <div class="bar"><div style="width:${Math.min(100,pct)}%;background:${overrun?'var(--bad)':'var(--accent)'}"></div></div>
          <span class="pill ${overrun?'bad':'muted'}">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / ${Math.floor(budget/60)}:${String(budget%60).padStart(2,'0')}</span>
        </div>`;
      }).join('')}
    </section>

    ${(confSummary.a.att + confSummary.b.att + confSummary.c.att) > 0 ? `
    <section class="card">
      <h3>Pasitikėjimas ir teisingumas</h3>
      <p style="margin-top:0;font-size:13px;color:var(--muted)">Jei „Tikrai žinau“ tikslumas mažesnis nei 80 %, vadinasi, per dažnai esi pernelyg užtikrintas. Realiame Kengūros konkurse tai brangiai kainuoja (−25 % už klaidą).</p>
      ${[
        {k:'a', label:'Tikrai žinau'},
        {k:'b', label:'Spėju iš dviejų'},
        {k:'c', label:'Atsitiktinai'},
      ].map(({k,label}) => {
        const s = confSummary[k];
        if(!s.att) return '';
        const pct = Math.round(100*s.ok/s.att);
        const danger = k === 'a' && pct < 80;
        return `<div class="cat-row">
          <span>${label}</span>
          <div class="bar"><div style="width:${pct}%;background:${danger?'var(--bad)':'var(--good)'}"></div></div>
          <span class="pill ${danger?'bad':(pct>=80?'good':'muted')}">${s.ok}/${s.att} (${pct}%)</span>
        </div>`;
      }).join('')}
    </section>` : ''}

    <section class="card">
      <h3>Pagal kategorijas</h3>
      ${Object.entries(catBreak).map(([cat,b])=>{
        const pct = Math.round(100*b.ok/b.total);
        return `<div class="cat-row">
          <span>${CATEGORY_LABEL[cat]||cat}</span>
          <div class="bar"><div style="width:${pct}%"></div></div>
          <span class="pill ${pct>=80?"good":pct>=50?"muted":"bad"}">${b.ok}/${b.total}</span>
        </div>`;
      }).join("")}
    </section>
    ${total < 5 ? '</details>' : ''}

    <section class="card">
      <h3>Klaidos (${wrongs.length})</h3>
      ${wrongs.length === 0 ? `<p class="empty">Nė vienos klaidos – visi sprendimai pasiteisino.</p>`:
        wrongs.map(({q,ans,i})=>{
          const renderOpt = (idx)=>{
            if(idx == null) return "<i>nepasirinkta</i>";
            if(q.imageOptions) return `${String.fromCharCode(65+idx)} (paveikslas)`;
            return escapeHTML(q.options[idx]);
          };
          const sub = q.subtopic && SUBTOPIC_LABEL[q.subtopic] ? SUBTOPIC_LABEL[q.subtopic] : "";
          return `
          <details>
            <summary>${i+1}. ${escapeHTML(shortPrompt(q.prompt))}</summary>
            <p><b>Tavo atsakymas:</b> ${ans ? renderOpt(ans.chosen) : "<i>nepasirinkta</i>"}</p>
            <p><b>Teisingas:</b> ${renderOpt(q.correctIndex)}</p>
            <p class="explain">${escapeHTML(q.explain)}</p>
            <div class="footer-actions">
              <div class="row">
                <span class="pill muted">${CATEGORY_LABEL[q.category]||q.category}</span>
                ${sub ? `<span class="subtopic">· ${escapeHTML(sub)}</span>`:``}
              </div>
              <button class="btn small primary" data-similar="${i}">Spręsti panašų</button>
            </div>
          </details>
        `}).join("")
      }
    </section>

  `;

  document.getElementById("homeBtn").addEventListener("click", ()=>{ state.view="home"; renderHome(); });
  document.getElementById("againBtn").addEventListener("click", startQuiz);
  wirePlanNext();
  $app.querySelectorAll("[data-similar]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = parseInt(b.dataset.similar,10);
      state._returnTo = "results";
      openSimilar(state.questions[i].gen);
    });
  });
}

/* ============================================================
   CONTEST SIMULATOR – true Kangaroo conditions.

   75 min, 30 questions from a real past paper, −25% for wrong,
   no hints, no playlists, no confidence picker, no "practice
   similar" button. The point is to teach the kid contest-day
   conditions: cold paper, time pressure, no help.

   Stored in store.contests separately from store.sessions.
   ============================================================ */
const CONTEST_DURATION_MS = 75 * 60 * 1000;

function startContestTicker(){
  if(state._contestTimerInterval) clearInterval(state._contestTimerInterval);
  state._contestTimerInterval = setInterval(()=>{
    if(state.view !== "contest"){ clearInterval(state._contestTimerInterval); return; }
    if(Date.now() >= state.contestEndsAt){
      finishContest(true);
    } else {
      // re-render only timer bar
      const tb = document.getElementById("contestTimer");
      if(tb){
        const remain = Math.max(0, state.contestEndsAt - Date.now());
        // The only sound in the contest sim: a proctor-style 5-minute warning.
        if(!state._contestWarned && remain <= 5 * 60000){ state._contestWarned = true; Sfx.play("warn"); }
        const mm = Math.floor(remain/60000);
        const ss = Math.floor((remain%60000)/1000);
        tb.textContent = `${mm}:${String(ss).padStart(2,"0")}`;
        // quiet pace checkpoints (no sound, no popup): 15 min → 3 t., 40 min → 4 t.
        const elapsed = 75 * 60000 - remain;
        const left = b => state.contestQuestions.filter(q => (q.points || 3) === b && !state.contestAnswers[q.num]).length;
        let msg = "";
        if(elapsed >= 40 * 60000 && left(4) >= 3) msg = `40 min praėjo – dar liko ${left(4)} ${pluralForm(left(4),'uždavinys','uždaviniai','uždavinių')} po 4 t. Laikas pereiti prie 5 t.`;
        else if(elapsed >= 15 * 60000 && elapsed < 40 * 60000 && left(3) >= 3) msg = `15 min praėjo – dar liko ${left(3)} ${pluralForm(left(3),'uždavinys','uždaviniai','uždavinių')} po 3 t. Neužstrik – praleisk ir eik toliau.`;
        const pb = document.getElementById("contestPace");
        if(pb && pb.textContent !== msg){ pb.textContent = msg; pb.style.display = msg ? "" : "none"; }
      }
    }
  }, 1000);
}

/* Warm the service worker's figure cache (cache-first, so a fetch is all
   it takes). Resolves with how many figures came back OK. */
async function prefetchFigures(qs, onProgress){
  let ok = 0, n = 0;
  const list = qs.filter(q => q && q.figure);
  for(let i = 0; i < list.length; i += 6){
    await Promise.all(list.slice(i, i + 6).map(q => fetch(encodeURI(q.figure)).then(r => { if(r.ok) ok++; }).catch(() => {})));
    n = Math.min(list.length, i + 6);
    if(onProgress) onProgress(n);
  }
  return ok;
}
