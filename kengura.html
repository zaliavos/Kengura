/* ----------------------------------------------------------------
   PLAYLIST MODE – 4-step mastery sequence per mechanic.

   Step 0: Read the trick (methodology blurb)
   Step 1: Worked example – one archive Q with solution shown
   Step 2: Try with hints – one archive Q at the source band
   Step 3: Mastery check – 3 archive Qs, 5-min timer, no hints

   On step 3 success (≥2/3 correct in time), the mechanic is marked
   "mastered" in store.masteredMech.
   ---------------------------------------------------------------- */
function archiveQsForMech(mech, band){
  const out = [];
  const held = [];
  const reserved = new Set(reservedYears().map(String));
  let totalFree = 0;   // this mechanic's keyed questions outside the reserved years, ALL bands
  for(const t of ARCHIVE){
    const isHeld = reserved.has(String(t.year));
    for(const q of t.questions){
      if(q.mechanic !== mech) continue;
      if(!q.correct) continue;  // need answer key for the mastery check
      if(!isHeld) totalFree++;
      if(band && (q.points || 3) !== band) continue;
      (isHeld ? held : out).push({year:t.year, q});
    }
  }
  // Tiny mechanics would vanish from the track without their held-out
  // questions – for those the reservation is waived. The decision is made
  // on the whole mechanic, never per band, so band-specific and
  // band-free calls always agree on which questions exist.
  return totalFree >= 3 ? out : out.concat(held);
}

function pickPlaylistContent(mech, forcedBand){
  // Pool of archive questions of this mechanic, grouped by band
  const byBand = {3:[], 4:[], 5:[]};
  for(const item of archiveQsForMech(mech, null)){
    byBand[item.q.points || 3].push(item);
  }
  const bandsAvailable = [3,4,5].filter(b => byBand[b].length > 0);
  // Worked example: prefer one band BELOW source band so the kid sees
  // the trick on something easier first.
  // Mastery: 3 questions of the source band.
  const has5 = byBand[5].length > 0;
  const has4 = byBand[4].length > 0;
  const has3 = byBand[3].length > 0;
  // forcedBand comes from the step-down / step-up ladder after a mastery
  // fail or pass – it overrides the default "hardest available" pick.
  let sourceBand = (forcedBand && byBand[forcedBand].length)
    ? forcedBand
    : (has5 ? 5 : (has4 ? 4 : 3));
  let workedFromBand = has4 && sourceBand === 5 ? 4 : (has3 && sourceBand >= 4 ? 3 : sourceBand);
  const used = new Set();
  function take(band){
    let pool = byBand[band].filter(x => !used.has(`${x.year}-${x.q.num}`));
    // Prefer questions unseen in the last 2 weeks; fall back to the full
    // pool when the mechanic is too small to be picky.
    const fresh = pool.filter(x => !isRecentlySeen(x.year, x.q.num));
    if(fresh.length) pool = fresh;
    if(!pool.length) return null;
    const item = pool[Math.floor(Math.random()*pool.length)];
    used.add(`${item.year}-${item.q.num}`);
    return item;
  }
  const worked = take(workedFromBand) || take(sourceBand);
  const tryQ   = take(sourceBand) || take(workedFromBand);
  const mastery = [];
  for(let i=0; i<3; i++){
    // Fall back through every band so the mastery check always has its
    // ≥ 2 items when the mechanic has ≥ 4 questions at all.
    const m = take(sourceBand) || take(workedFromBand) || take(3) || take(4) || take(5);
    if(m) mastery.push(m);
  }
  // spare source-band question: a missed try step offers one more before the timed check
  const extraTry = take(sourceBand);
  return {sourceBand, worked, tryQ, mastery, bandsAvailable, extraTry};
}

/* Mastery-check clock = the real contest pace for the items it holds
   (1 min per 3-pt, 2,5 min per 4-pt, 5 min per 5-pt question). A flat
   5 minutes gave three 5-pt problems 100 s each – a third of what the
   contest itself allows, so a kid who could solve them still failed. */
const PACE_SEC = {3:60, 4:150, 5:300};
function playlistMasteryMs(items){
  return (items || []).reduce((t, it) => t + (PACE_SEC[it.q && it.q.points] || PACE_SEC[4]), 0) * 1000;
}
function fmtMs(ms){ const sec = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2,'0')}`; }

function stopPlaylistTimer(){
  if(state.playlistTimerInterval){
    clearInterval(state.playlistTimerInterval);
    state.playlistTimerInterval = null;
  }
}

function openPlaylist(mech, forcedBand){
  stopPlaylistTimer();
  state.view = "playlist";
  state.playlistSprint = false;
  state.playlistRetry = null;
  state.playlistMech = mech;
  // Stale mastery → light 2-question retest instead of the full playlist.
  // Pass keeps mastery fresh; fail clears it and offers the full playlist.
  const retest = !forcedBand && !!store.masteredMech[mech] && isMechMasteryStale(mech);
  if(forcedBand == null && !retest){
    // Track, mission, mechanic list, parent view, recap – all land on the
    // band the plan would choose (foundation cap, step-downs).
    const t = mechTargetFor(mech);
    if(t) forcedBand = t.band;
  }
  state.playlistRetest = retest;
  state.playlistRecorded = false;
  state.playlistFinalized = false;
  state.playlistContent = pickPlaylistContent(mech, retest ? (masteredBandOf(mech) || undefined) : forcedBand);
  if(retest){
    state.playlistContent.mastery = (state.playlistContent.mastery || []).slice(0, 2);
    state.playlistStep = 3;
  } else {
    state.playlistStep = 0;
  }
  state.playlistAns = {};       // key: "year-num" -> chosen letter
  state.playlistSubmitted = {}; // key -> bool
  state.playlistHintShown = {}; state.playlistFirstWrong = {}; state.playlistTryAt = {}; state.playlistFocusKey = null; state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false; // key -> bool
  state.playlistConf = {};      // key -> a|b|c
  state.playlistTimerStart = 0;
  state.playlistTimeExpired = false;
  renderPlaylist();
}

function openDueQueue(limit){
  // Due-queue is rendered as a mini playlist of the user's due questions.
  const due = dueNow();
  if(!due.length){ return; }
  // Map each due item to {year, q}
  const items = [];
  for(const d of due.slice(0, limit || 10)){
    const t = ARCHIVE.find(x=>x.year===d.year);
    if(!t) continue;
    const q = t.questions.find(x=>x.num===d.num);
    if(!q || !q.correct) continue;
    items.push({year:d.year, q});
  }
  if(!items.length) return;
  stopPlaylistTimer();
  state.view = "playlist";
  state.playlistSprint = false;
  state.playlistRetry = null;
  state.playlistMech = "__due__";
  state.playlistRetest = false;
  state.playlistRecorded = false;
  state.playlistFinalized = false;
  state.playlistStep = 3;       // jump straight to mastery step (just answers)
  state.playlistContent = {sourceBand:0, worked:null, tryQ:null, mastery:items, bandsAvailable:[]};
  state.playlistAns = {};
  state.playlistSubmitted = {};
  state.playlistHintShown = {}; state.playlistFirstWrong = {}; state.playlistTryAt = {}; state.playlistFocusKey = null; state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false;
  state.playlistConf = {};
  state.playlistTimerStart = 0;
  state.playlistTimeExpired = false;
  renderPlaylist();
}

function renderPlaylist(){
  const mech = state.playlistMech;
  const isDue = mech === "__due__";
  const isMixed = mech === "__mixed__";
  const special = isDue || isMixed;
  const retest = !!state.playlistRetest;
  const meta = special ? null : (MECHANIC_METHODOLOGY[mech] || {});
  const content = state.playlistContent;
  const step = state.playlistStep;

  const titleHtml = isDue && state.playlistFromBook
    ? `<h2 style="margin:0 0 4px">📒 Klaidų sąsiuvinis</h2>
       <p class="help-bar" style="margin:0">Uždaviniai, kuriuose suklydai. Be laikrodžio – sprendimą pamatysi atsakęs.</p>`
    : isDue
    ? `<h2 style="margin:0 0 4px">🔁 Pakartojimas</h2>
       <p class="help-bar" style="margin:0">Šiuos uždavinius jau sprendei ir suklydai. Išspręsk juos dar kartą ramiai – kai pavyks kelis kartus iš eilės, jie iš sąrašo dings.</p>`
    : isMixed && state.playlistRetry
    ? `<h2 style="margin:0 0 4px">🔁 Antras bandymas</h2>
       <p class="help-bar" style="margin:0">Kontrolinio klaidos ir praleisti uždaviniai – be laikrodžio. Sprendimą pamatysi tik atsakęs. Taip sužinosi, kiek taškų nubėgo dėl laiko ir skubėjimo, o kiek – dėl to, ko dar nemoki.</p>`
    : isMixed && state.playlistSprint
    ? `<h2 style="margin:0 0 4px">⚡ Tikrų 3 t. uždavinių sprintas</h2>
       <p class="help-bar" style="margin:0">10 uždavinių iš ankstesnių konkursų, ~1 min kiekvienam – tokiu tempu konkurse įveiksi pirmąjį bloką.</p>`
    : isMixed
    ? `<h2 style="margin:0 0 4px">Mišrus rinkinys</h2>
       <p class="help-bar" style="margin:0">Kaip konkurse: gudrybė nenurodyta. Pirma atpažink ją, tada spręsk.</p>`
    : retest
    ? `<h2 style="margin:0 0 4px">${escapeHTML(meta.title || mech)} – pakartojimo patikra</h2>
       <p class="help-bar" style="margin:0">Įvaldyta seniai. Du uždaviniai patikrins, ar dar pameni – jei abu teisingi, įvaldymas atnaujinamas.</p>`
    : `<h2 style="margin:0 0 4px">${escapeHTML(meta.title || mech)}</h2>
       <p class="help-bar" style="margin:0">${escapeHTML(meta.summary || '')}</p>`;

  const stepsHtml = (special || retest) ? "" : `
    <div class="playlist-steps">
      ${[0,1,2,3].map(i => {
        const pip = i < step ? "done" : (i === step ? "now" : "");
        return `<span class="step-pip ${pip}" title="${PLAYLIST_STEP_NAMES[i]}"${i === step ? ' aria-current="step"' : ''}>${i+1}</span>`;
      }).join('<span>·</span>')}
      <span style="margin-left:6px"><b>${PLAYLIST_STEP_NAMES[step]}</b>${step < 3 ? ` · toliau – ${PLAYLIST_STEP_NAMES[step + 1].toLowerCase()}` : ''}</span>
    </div>
  `;

  let body = "";
  if(!special && step === 0 && !retest && content.tryQ && !state.playlistPeeked){
    // a guess before the lesson makes the lesson stick (pretesting: Richland et
    // al.; Carpenter & Toftness) – no grading, no answer, just a look
    body = `
      <div class="explain" style="margin-bottom:10px"><b>Pirmiausia – pusė minutės su šiuo uždaviniu.</b> Spręsti nereikia: kaip pradėtum? Ką pastebi? Po gudrybės jį išspręsi.</div>
      ${questionBodyHTML(content.tryQ.q, {lazy:false})}
      <div class="footer-actions">
        <button class="btn ghost" id="plBack">← Į pradžią</button>
        <button class="btn primary" id="plPeeked">Pagalvojau – rodyk gudrybę</button>
      </div>`;
  } else if(!special && step === 0){
    body = `
      <div class="methodology">
        <h4>Gudrybė</h4>
        <p>${escapeHTML(meta.trick || '')}</p>
        <h4>Pirmas žingsnis sprendžiant</h4>
        <p>${escapeHTML(meta.keyStep || '')}</p>
        ${meta.pitfalls ? `<h4>Klaidos, kurių vengti</h4><p>${escapeHTML(meta.pitfalls)}</p>` : ''}
      </div>
      <div class="footer-actions">
        <button class="btn ghost" id="plBack">← Į pradžią</button>
        <button class="btn primary" id="plNext">Toliau – pažiūrėk pavyzdį</button>
      </div>
    `;
  } else if(!special && step === 1 && content.worked){
    body = renderPlaylistQuestion(content.worked, {showSolution:true, mode:"worked"});
  } else if(!special && step === 2 && content.tryQ){
    body = (state.playlistPeeked && !state.playlistSubmitted[`${content.tryQ.year}-${content.tryQ.q.num}`] ? `<p class="help-bar" style="margin:8px 0 0">Tas pats uždavinys, kurį matei pradžioje – dabar žinai gudrybę.</p>` : '')
      + renderPlaylistQuestion(content.tryQ, {showSolution:false, mode:"try"});
  } else if(step === 3){
    if(!state.playlistTimerStart) state.playlistTimerStart = Date.now();
    const items = content.mastery || [];
    const submittedCount = items.filter(it => state.playlistSubmitted[`${it.year}-${it.q.num}`]).length;
    const correctCount = items.filter(it => {
      const k = `${it.year}-${it.q.num}`;
      return state.playlistSubmitted[k] && state.playlistAns[k] === it.q.correct;
    }).length;
    const allDone = submittedCount === items.length;
    // Mastery now needs ALL correct – with 5 options, 2/3 survives guessing
    // ~10 % of the time; 3/3 is honest evidence.
    const passed = correctCount === items.length && items.length >= 2;
    const bands = content.bandsAvailable || [];
    // Ladder buttons only point at bands with enough questions for a
    // passable mastery check (≥ 2) – same rule as the plan.
    const enough = b => archiveQsForMech(mech, b).length >= 2;
    const lowerBand = special ? null : bands.filter(b => b < content.sourceBand && enough(b)).pop() || null;
    const higherBand = !special && content.sourceBand < 5 && bands.includes(5) && enough(5) ? 5 : null;
    const timerHtml = special && !state.playlistSprint ? '' : `<span class="pl-countdown" id="plCountdown">⏱ ${fmtMs(playlistMasteryMs(items))}</span>`;
    // One quiet pill row instead of a sentence of instructions: the kid sees
    // how many, whether there is a clock, and (mastery) that all must be right.
    const headWord = isDue ? '' : state.playlistRetry ? '' : isMixed ? '' : (retest ? 'Pakartojimo patikra' : 'Įvaldymo testas');
    body = `
      <div class="qmeta pl-head" style="margin:8px 0 0">
        ${headWord ? `<b>${headWord}</b>` : ''}
        <span class="pill">${items.length} ${pluralForm(items.length,'uždavinys','uždaviniai','uždavinių')}</span>
        ${special && !state.playlistSprint ? `<span class="pill muted">be laiko</span>` : `<span class="pill muted">be užuominų</span>`}
        ${!special && !retest ? `<span class="pill muted" title="Įvaldymui visi atsakymai turi būti teisingi">visi turi būti teisingi</span>` : ''}
        ${timerHtml}
        ${allDone || submittedCount === 0 ? '' : `<span class="help-bar" style="margin:0">${submittedCount}/${items.length} atsakyta</span>`}
      </div>
      <div class="progress" role="progressbar" aria-label="Atsakyta" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${submittedCount}" style="margin:8px 0 0"><div style="width:${items.length ? Math.round(100 * submittedCount / items.length) : 0}%"></div></div>
      ${(() => {
        // one question on screen; the strip shows where the others stand
        const keys = items.map(it => `${it.year}-${it.q.num}`);
        if(!keys.includes(state.playlistFocusKey)){
          const open = keys.find(kk => !state.playlistSubmitted[kk]);
          state.playlistFocusKey = open || keys[0] || null;
        }
        if(items.length < 2) return '';
        return `<div class="contest-strip arch-strip" role="group" aria-label="Uždaviniai">${items.map((it, i) => { const kk = keys[i]; const sub = state.playlistSubmitted[kk];
          const cls = sub ? (state.playlistAns[kk] === it.q.correct ? ' good' : ' bad') : '';
          return `<button class="contest-pip${cls}${kk === state.playlistFocusKey ? ' current' : ''}" data-pl-pip="${kk}"${kk === state.playlistFocusKey ? ' aria-current="step"' : ''} aria-label="${i + 1} uždavinys${sub ? ' – atsakyta' : ''}">${i + 1}</button>`; }).join('')}</div>`;
      })()}
      ${items.map((it, i) => {
        // after an answer: one tap to the next question still open
        const nx = items.slice(i + 1).concat(items.slice(0, i)).find(o => !state.playlistSubmitted[`${o.year}-${o.q.num}`]);
        const timed = !special || state.playlistSprint;
        return renderPlaylistQuestion(it, {showSolution: state.playlistSubmitted[`${it.year}-${it.q.num}`] || state.playlistTimeExpired, mode:"mastery",
          holdFeedback: (timed || (isMixed && !state.playlistRetry)) && !allDone && !state.playlistTimeExpired,
          hidden: items.length > 1 && `${it.year}-${it.q.num}` !== state.playlistFocusKey,
          hideMech: isMixed && !state.playlistSprint && !state.playlistRetry,
          nextKey: nx && !state.playlistTimeExpired ? `${nx.year}-${nx.q.num}` : null});
      }).join('')}
      ${items.length > 1 ? (() => { const fi = items.findIndex(it => `${it.year}-${it.q.num}` === state.playlistFocusKey);
        return `<nav class="arch-nav" aria-label="Uždaviniai"><button class="btn small" id="plPrevQ" aria-label="Ankstesnis uždavinys"${fi <= 0 ? ' disabled' : ''}>←</button><span class="arch-pos">${fi + 1} / ${items.length}</span><button class="btn small" id="plNextQ" aria-label="Kitas uždavinys"${fi >= items.length - 1 ? ' disabled' : ''}>→</button></nav>`; })() : ''}
      ${state.playlistTimeExpired && !allDone ? `
        <div class="explain" style="background:var(--bad-soft);border:1px solid var(--bad)">
          <b>Laikas baigėsi.</b> Neatsakyti uždaviniai lieka kaip neteisingi. Spausk „Baigti“, kad pamatytum rezultatą.
        </div>
      ` : ``}
      ${allDone ? (()=>{
        if(special && state.playlistRetry){
          const pts = items.filter(it => state.playlistAns[`${it.year}-${it.q.num}`] === it.q.correct).reduce((a, it) => a + (it.q.points || 3), 0);
          return `<div class="explain" style="background:${correctCount ? 'var(--good-soft)' : '#f7f3e7'};border:1px solid ${correctCount ? 'var(--good)' : 'var(--line)'}">
            <b>Antru bandymu išsprendei ${correctCount} iš ${items.length}.</b>
            ${pts ? `Tai <b>${pts} t.</b>, kuriuos kontroliniame praradai ne dėl žinių, o dėl laiko ar skubėjimo – juos susigrąžins ramesnis tempas ir 🚩 žymės.` : 'Šie uždaviniai kol kas per sunkūs – jų gudrybes rasi sprendimuose ir plane.'}
          </div>`;
        }
        if(special){
          return `<div class="explain" style="background:var(--good-soft);border:1px solid var(--good)">
            <b>${isDue ? 'Pakartojimas atliktas.' : state.playlistSprint ? 'Sprintas baigtas.' : 'Rinkinys atliktas.'}</b>
            <span class="muted small">Teisingai ${correctCount} iš ${items.length}.${state.playlistSprint ? (()=>{ const used = Math.round((Date.now() - (state.playlistTimerStart || Date.now())) / 1000); const per = Math.round(used / Math.max(1, items.length)); return ` Vidutiniškai ${per} s vienam – konkurse 3 t. uždaviniui verta skirti iki 60 s.`; })() : ''}${isDue ? (correctCount === items.length ? ' Visi teisingi – šie uždaviniai sugrįš po kelių dienų, kad neužsimirštų.' : ' Tuos, kuriuose suklydai, pakartosi rytoj.') : ''}</span>
          </div>`;
        }
        if(retest){
          return passed
            ? `<div class="explain mastery-pass" style="background:var(--good-soft);border:1px solid var(--good)">
                <span class="star">⭐</span><b>Dar pameni!</b> Įvaldymas atnaujintas – pasimatysime vėl po ${masteryDecayDays()} d.
               </div>`
            : `<div class="explain" style="background:var(--bad-soft);border:1px solid var(--bad)">
                <b>Primiršai – nieko tokio.</b> Pereik šios gudrybės seriją iš naujo – tai normalu po pertraukos.
               </div>`;
        }
        return passed
          ? `<div class="explain mastery-pass" style="background:var(--good-soft);border:1px solid var(--good)">
              <span class="star">⭐</span>${content.sourceBand && content.sourceBand < mechTopBand(state.playlistMech)
                ? `<b>Įveikta ${content.sourceBand} t. lygiu!</b> Kitas žingsnis – šios gudrybės ${mechTopBand(state.playlistMech)} t. uždaviniai; planas juos pasiūlys.`
                : `<b>Gudrybė įvaldyta!</b> Pažymėjome kaip įvaldytą – pasimatysime vėl po ${masteryDecayDays()} d.`}
              <br><span class="muted small">Visi ${items.length} atsakymai teisingi${content.sourceBand ? ` (${content.sourceBand} t. lygis)` : ''}.</span>
             </div>`
          : `<div class="explain" style="background:var(--bad-soft);border:1px solid var(--bad)">
              <b>Dar ne visai.</b>
              Kad įvaldytum, visi ${items.length} atsakymai turi būti teisingi – šįkart teisingų ${correctCount}.
              ${lowerBand ? ` Pabandyk ${lowerBand} t. lygiu ir vėl kilk.` : ' Pabandyk dar kartą po kelių dienų.'}
             </div>`;
      })() : ``}
      <div class="footer-actions">
        <button class="btn ghost" id="plBack">← Į pradžią</button>
        <div class="row">
          ${allDone && !special && !retest && !passed && lowerBand ? `<button class="btn" id="plStepDown" data-band="${lowerBand}">Pabandyti ${lowerBand} t. lygiu</button>` : ''}
          ${allDone && !special && !retest && passed && higherBand ? `<button class="btn" id="plStepUp" data-band="${higherBand}">Kilti į ${higherBand} t. lygį</button>` : ''}
          ${allDone && retest && !passed ? `<button class="btn" id="plRedo">Pereiti seriją iš naujo</button>` : ''}
          ${(allDone || state.playlistTimeExpired) ? (state._planStep && nextPlanStep(state._planStep)
              ? `<button class="btn ghost" id="plDone">Baigti</button>${planNextButtonHTML(state._planStep)}`
              : `<button class="btn primary" id="plDone">Baigti</button>`) : ''}
        </div>
      </div>
    `;
  } else {
    body = `<p class="empty">Šios gudrybės archyve uždavinių neužtenka. Grįžk ir pasirink kitą.</p>
      <div class="footer-actions"><button class="btn ghost" id="plBack">← Į pradžią</button></div>`;
  }

  $app.innerHTML = `
    <section class="card">
      <button class="nav-back" id="plBackTop">← Į pradžią</button>
      ${titleHtml}
      ${stepsHtml}
      ${body}
    </section>
  `;

  // Record submitted mastery answers exactly once (also on early exit,
  // so answered questions still feed stats + spaced repetition).
  function recordPlaylistAnswers(){
    if(state.playlistRecorded) return;
    state.playlistRecorded = true;
    (content.mastery || []).forEach(it => {
      const k = `${it.year}-${it.q.num}`;
      if(!state.playlistSubmitted[k]) return;
      // the kid may already have said why (chips under the answer) – noteMistake
      // clears the reason for a NEW slip, so keep this one across the recording
      const pre = (store.mistakes || {})[k];
      const keepReason = pre && pre.reason;
      recordArchiveAnswer(it.year, it.q, state.playlistAns[k] === it.q.correct, (state.playlistConf || {})[k] || null);
      const post = (store.mistakes || {})[k];
      if(keepReason && post && !post.fixedAt) post.reason = keepReason;
    });
  }
  // Full completion: record answers + apply mastery / retest bookkeeping.
  function finalizePlaylist(){
    stopPlaylistTimer();
    if(state.playlistFinalized) return;   // "← Į pradžią" after a button that already finalized
    state.playlistFinalized = true;
    const items = content.mastery || [];
    // only submitted answers count – a letter tapped but never sent is unanswered
    const correctCount = items.filter(it => {
      const k = `${it.year}-${it.q.num}`;
      return state.playlistSubmitted[k] && state.playlistAns[k] === it.q.correct;
    }).length;
    const submittedCount = items.filter(it => state.playlistSubmitted[`${it.year}-${it.q.num}`]).length;
    const passed = correctCount === items.length && items.length >= 2;
    let newlyMastered = false;
    if(!special){
      const mech = state.playlistMech;
      const band = content.sourceBand || 3;
      if(retest){
        if(passed) store.masteredMech[mech] = Date.now();
        else {
          // Stale mastery failed its re-check: drop one band, keep the rest.
          delete store.masteredMech[mech];
          const had = masteredBandOf(mech);
          const lower = [3,4,5].filter(b => b < had && archiveQsForMech(mech, b).length >= 2).pop();
          store.masteredBand = store.masteredBand || {};
          if(lower) store.masteredBand[mech] = lower; else delete store.masteredBand[mech];
        }
      } else {
        noteMechAttempt(mech, band, passed);
        if(passed){
          store.masteredBand = store.masteredBand || {};
          const prev = masteredBandOf(mech);
          store.masteredBand[mech] = Math.max(prev, band);
          // Full mastery only at the top band the archive has for this mechanic
          if(band >= mechTopBand(mech)){
            newlyMastered = !store.masteredMech[mech];
            store.masteredMech[mech] = Date.now();
          } else {
            newlyMastered = band > prev;   // partial step up still earns the bonus
          }
        }
      }
    }
    if(state.playlistSprint && submittedCount){
      // the real-question sprint counts as a session, so needsSpeedWork()
      // sees its pace too (it read only the generated sprints)
      const spent = Math.min(Date.now() - (state.playlistTimerStart || Date.now()), playlistMasteryMs(items));
      store.sessions.push({when: Date.now(), total: items.length, correct: correctCount, points: correctCount * 3,
        pointsWithPenalty: correctCount * 3 - (submittedCount - correctCount) * 0.75, bandTime: {3: spent, 4: 0, 5: 0},
        early: submittedCount < items.length, sprint: true, archive: true, answered: submittedCount,
        questions: items.map(it => { const k = `${it.year}-${it.q.num}`; return {difficulty: 3, category: "archyvas", correct: !!state.playlistSubmitted[k] && state.playlistAns[k] === it.q.correct, answered: !!state.playlistSubmitted[k]}; })});
      if(store.sessions.length > 30) store.sessions = store.sessions.slice(-30);
    }
    if(state.playlistRetry){
      // the second try is the contest day's "review the mistakes" step
      const pd = store.planDone[todayKey()] || {};
      if(submittedCount && pd.core && !pd.cooldown && planStepsForToday().some(st => st.id === "cooldown" && st.act === "none")) markPlanStepDoneManual("cooldown");
      const c = (store.contests || []).find(x => x.when === state.playlistRetry);
      if(c && submittedCount) c.retry = {n: items.length, ok: correctCount,
        pts: items.filter(it => state.playlistSubmitted[`${it.year}-${it.q.num}`] && state.playlistAns[`${it.year}-${it.q.num}`] === it.q.correct).reduce((a, it) => a + (it.q.points || 3), 0)};
    }
    recordPlaylistAnswers();
    saveStore(store);
    // as in finishQuiz: the plan step counts only when at least half was answered
    if(submittedCount >= Math.ceil(items.length / 2)) markPlanStepDone();
    else state._planStep = null;
    if(passed && !special){
      Fx.celebrate("mastery");
      const full = !!store.masteredMech[state.playlistMech];
      if(newlyMastered) awardBonus(5, `${full ? 'Įvaldyta' : `Įveikta ${content.sourceBand} t. lygiu`}: ${MECHANIC_LABEL[state.playlistMech] || state.playlistMech}`);
    } else if(special && items.length && correctCount === items.length){
      Fx.celebrate("plan");
    }
  }

  // Wire common controls
  const exitHome = ()=>{
    stopPlaylistTimer();
    const all = (content.mastery || []).length && (content.mastery || []).every(it => state.playlistSubmitted[`${it.year}-${it.q.num}`]);
    if(step === 3 && all){
      // every item answered: leaving by the top button must not lose the mastery
      finalizePlaylist();
    } else if(step === 3){
      recordPlaylistAnswers();   // don't lose answered questions
      // Bailing out of a mastery check after a miss is a failed attempt –
      // otherwise quitting whenever the first answer is wrong dodges the
      // step-down ladder forever.
      if(!special && !retest){
        const items = content.mastery || [];
        const missed = items.some(it => { const k = `${it.year}-${it.q.num}`; return state.playlistSubmitted[k] && state.playlistAns[k] !== it.q.correct; });
        if(missed) noteMechAttempt(state.playlistMech, content.sourceBand || 3, false);
      }
    }
    saveStore(store);
    state.view="home"; renderHome();
  };
  const backTop = document.getElementById("plBackTop");
  if(backTop) backTop.addEventListener("click", exitHome);
  const back = document.getElementById("plBack");
  if(back) back.addEventListener("click", ()=>{ const fb = state.playlistFromBook; exitHome(); if(fb){ state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false; openMistakeBook(); } });
  // focus-mode navigation inside a set
  $app.querySelectorAll("[data-pl-pip]").forEach(b => b.addEventListener("click", ()=> plFocus(b.dataset.plPip)));
  const plSteps = d => { const items = (content && content.mastery) || []; const keys = items.map(it => `${it.year}-${it.q.num}`); const i = keys.indexOf(state.playlistFocusKey) + d; if(i >= 0 && i < keys.length) plFocus(keys[i]); };
  const pPrev = document.getElementById("plPrevQ"), pNext = document.getElementById("plNextQ");
  if(pPrev) pPrev.addEventListener("click", ()=> plSteps(-1));
  if(pNext) pNext.addEventListener("click", ()=> plSteps(1));
  const peeked = document.getElementById("plPeeked");
  if(peeked) peeked.addEventListener("click", ()=>{ state.playlistPeeked = true; renderPlaylist(); toTop(); });
  const next = document.getElementById("plNext");
  if(next) next.addEventListener("click", ()=>{ state.playlistStep++; renderPlaylist(); toTop(); });
  const done = document.getElementById("plDone");
  if(done) done.addEventListener("click", ()=>{
    finalizePlaylist();
    if(state.playlistFromBook){ state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false; openMistakeBook(); return; }
    state.view = "home";
    renderHome();
  });
  wirePlanNext(finalizePlaylist);
  const stepDown = document.getElementById("plStepDown");
  if(stepDown) stepDown.addEventListener("click", ()=>{
    finalizePlaylist();
    openPlaylist(mech, parseInt(stepDown.dataset.band, 10));
  });
  const stepUp = document.getElementById("plStepUp");
  if(stepUp) stepUp.addEventListener("click", ()=>{
    finalizePlaylist();
    openPlaylist(mech, parseInt(stepUp.dataset.band, 10));
  });
  const redo = document.getElementById("plRedo");
  if(redo) redo.addEventListener("click", ()=>{
    finalizePlaylist();
    openPlaylist(mech, (content.sourceBand || undefined));
  });

  // Mastery-step countdown: tick the visible timer, expire at the contest pace.
  // (due queue and mixed sets use step 3 with no time pressure – skip timer.)
  stopPlaylistTimer();
  if(step === 3 && (!special || state.playlistSprint) && !state.playlistTimeExpired && state.playlistTimerStart){
    const tick = () => {
      const remainingMs = playlistMasteryMs(content.mastery) - (Date.now() - state.playlistTimerStart);
      const span = document.getElementById("plCountdown");
      if(remainingMs <= 0){
        state.playlistTimeExpired = true;
        stopPlaylistTimer();
        renderPlaylist();
        return;
      }
      if(span){
        span.textContent = `⏱ ${fmtMs(remainingMs)}`;
        if(remainingMs < 60000 && !span.classList.contains("warn")){ span.classList.add("warn"); span.setAttribute("role", "status"); span.setAttribute("aria-label", "Liko mažiau nei minutė"); }
      }
    };
    tick();
    state.playlistTimerInterval = setInterval(tick, 1000);
  }

  // Wire each playlist question's option clicks + check buttons
  $app.querySelectorAll(".playlist-q").forEach(card => {
    const yr = card.dataset.year;
    const num = parseInt(card.dataset.qnum, 10);
    const k = `${yr}-${num}`;
    card.querySelectorAll(".opt[data-letter]").forEach(opt => {
      opt.addEventListener("click", ()=>{
        if(state.playlistSubmitted[k]) return;
        if(state.playlistTimeExpired) return;
        if(opt.dataset.letter === (state.playlistFirstWrong || {})[k]) return;
        state.playlistAns[k] = opt.dataset.letter;
        renderPlaylist();
      });
    });
    card.querySelectorAll("[data-pl-conf]").forEach(b => b.addEventListener("click", ()=>{
      state.playlistConf = state.playlistConf || {};
      state.playlistConf[k] = b.dataset.plConf;
      renderPlaylist();
    }));
    card.querySelectorAll("[data-pl-why]").forEach(b => b.addEventListener("click", ()=>{
      store.mistakes = store.mistakes || {};
      const [yy, nn] = k.split("-");
      // the mastery step records its answers at the end – make sure the entry exists
      const m = store.mistakes[k] = store.mistakes[k] || {year: yy, num: Number(nn), times: 0, first: Date.now(), lastWrong: Date.now()};
      m.reason = b.dataset.plWhy; m.reasons = m.reasons || {}; m.reasons[m.reason] = (m.reasons[m.reason] || 0) + 1;
      saveStore(store); renderPlaylist();
    }));
    const checkBtn = card.querySelector("[data-pl-check]");
    if(checkBtn) checkBtn.addEventListener("click", ()=>{
      if(state.playlistAns[k] == null) return;
      if(askConfidenceNow() && !(state.playlistConf || {})[k]) return;   // pick confidence first
      if(state.playlistTimeExpired) return;
      // the try step gets a second go (as archive cards): first miss recorded,
      // option crossed out, solution held back
      const tryIt = state.playlistStep === 2 && content.tryQ && `${content.tryQ.year}-${content.tryQ.q.num}` === k ? content.tryQ : null;
      state.playlistFirstWrong = state.playlistFirstWrong || {};
      const hadMiss = !!state.playlistFirstWrong[k];
      if(tryIt && !hadMiss && state.playlistAns[k] !== tryIt.q.correct){
        state.playlistFirstWrong[k] = state.playlistAns[k];
        delete state.playlistAns[k];
        recordArchiveAnswer(tryIt.year, tryIt.q, false, (state.playlistConf || {})[k] || null);
        Sfx.play("wrong");
        renderPlaylist();
        scrollToPlaylistQ(k, ".verdict");
        return;
      }
      state.playlistSubmitted[k] = true;
      if(hadMiss) noteSecondTry(state.playlistAns[k] === tryIt.q.correct);
      // The try step records its answer right away; the worked example had its
      // solution on screen, so it only counts as seen (no stars, no stats)
      if(state.playlistStep === 1 && content.worked){
        store.seenQ[`${content.worked.year}-${content.worked.q.num}`] = Date.now();
      } else if(state.playlistStep !== 3 && !hadMiss){
        const it = content.tryQ;
        if(it){
          recordArchiveAnswer(it.year, it.q, state.playlistAns[k] === it.q.correct, (state.playlistConf || {})[k] || null);
        }
      }
      {
        const it = (content.mastery || []).concat([content.worked, content.tryQ]).find(x => x && `${x.year}-${x.q.num}` === k);
        if(it) Sfx.play(state.playlistAns[k] === it.q.correct ? "correct" : "wrong");
      }
      renderPlaylist();
      scrollToPlaylistQ(k, ".verdict");
    });
    const revealBtn = card.querySelector("[data-pl-reveal]");
    if(revealBtn) revealBtn.addEventListener("click", () => {
      state.playlistAns[k] = (state.playlistFirstWrong || {})[k];
      state.playlistSubmitted[k] = true;
      noteSecondTry(false);
      renderPlaylist();
    });
    const gotoBtn = card.querySelector("[data-pl-goto]");
    if(gotoBtn) gotoBtn.addEventListener("click", () => plFocus(gotoBtn.dataset.plGoto));
    const hintBtn = card.querySelector("[data-pl-hint]");
    if(hintBtn) hintBtn.addEventListener("click", ()=>{
      // an early tap on a 4/5-pointer first gets three questions to ask oneself
      const t = (state.playlistTryAt || {})[k];
      const tq = content.tryQ && content.tryQ.q;
      if(t && tq && tryFirstPending(tq, t)){ t.tryFirstNote = true; renderPlaylist(); return; }
      state.playlistHintShown[k] = (Number(state.playlistHintShown[k]) || 0) + 1;
      renderPlaylist();
    });
    card.querySelectorAll("[data-pl-recog]").forEach(b => b.addEventListener("click", ()=>{
      state.playlistRecogPick = state.playlistRecogPick || {};
      if(state.playlistRecogPick[k]) return;
      state.playlistRecogPick[k] = b.dataset.plRecog;
      const it = ((content && content.mastery) || []).find(x => `${x.year}-${x.q.num}` === k);
      if(it){
        const right = b.dataset.plRecog === it.q.mechanic;
        store.recogStats = store.recogStats || {attempts:0, correct:0};
        store.recogStats.attempts++; if(right) store.recogStats.correct++;
        if(!right){ const pair = `${it.q.mechanic}>${b.dataset.plRecog}`; store.recogConfusion = store.recogConfusion || {}; store.recogConfusion[pair] = (store.recogConfusion[pair] || 0) + 1; }
        saveStore(store);
      }
      renderPlaylist();
    }));
    const anotherBtn = card.querySelector("[data-pl-anothertry]");
    if(anotherBtn) anotherBtn.addEventListener("click", ()=>{
      if(!content.extraTry) return;
      content.tryQ = content.extraTry;
      content.extraTry = null;       // one spare only – then the check
      renderPlaylist();
      toTop();
    });
    const nextStepBtn = card.querySelector("[data-pl-nextstep]");
    if(nextStepBtn) nextStepBtn.addEventListener("click", ()=>{
      state.playlistStep++;
      renderPlaylist();
      toTop();
    });
  });
}

/* After an answer the verdict comes into view; "Kitas uždavinys" scrolls to
   the next open question (mastery sets show all questions at once). */
function scrollToPlaylistQ(key, inner){
  try {
    const [y, n] = String(key).split("-");
    const card = document.querySelector(`.playlist-q[data-year="${y}"][data-qnum="${n}"]`);
    const el = card && (inner ? card.querySelector(inner) || card : card);
    if(el && el.scrollIntoView) el.scrollIntoView({behavior: smoothScroll(), block: inner ? "center" : "start"});
    if(inner && el && el.focus && el.classList && el.classList.contains("verdict")) el.focus({preventScroll: true});
  } catch(_){}
}

/* A re-render inside the same view (next item) doesn't pass the view hook's
   scroll reset – the next figure would start above the screen on a phone. */
function toTop(){ try { window.scrollTo(0, 0); } catch(_){} }
function plFocus(key){
  state.playlistFocusKey = key;
  renderPlaylist();
  try { const c = document.querySelector(".playlist-q:not([hidden])"); window.scrollTo(0, c ? Math.max(0, c.getBoundingClientRect().top + window.scrollY - 8) : 0); } catch(_){}
}

/* Keys in sets and the recognition drill, as in the archive focus mode:
   A–E / 1–5 pick, Enter checks or moves on, ← → between questions. */
(function wirePracticeKeys(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  document.addEventListener("keydown", e => {
    if(state.view !== "playlist" && state.view !== "recog") return;
    if(e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".fig-zoom")) return;
    if(e.target && e.target.closest && e.target.closest("input,textarea,select")) return;
    const k = e.key;
    const scope = state.view === "recog" ? document.getElementById("recogOptions") : document.querySelector(".playlist-q:not([hidden])");
    if(!scope) return;
    if(state.view === "playlist" && (k === "ArrowLeft" || k === "ArrowRight")){
      const b = document.getElementById(k === "ArrowLeft" ? "plPrevQ" : "plNextQ");
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
      return;
    }
    const L = /^[a-eA-E]$/.test(k) ? k.toUpperCase() : /^[1-5]$/.test(k) ? "ABCDE"[Number(k) - 1] : null;
    if(L){
      const opts = [...scope.querySelectorAll(".opt")];
      const o = state.view === "recog" ? opts["ABCDE".indexOf(L)] : scope.querySelector(`.opt[data-letter="${L}"]`);
      if(o && !o.disabled){ e.preventDefault(); o.click(); }
      return;
    }
    if(k === "Enter" && !(e.target && e.target.closest && e.target.closest("button,summary,a,[role=button]"))){
      const s = state.view === "recog"
        ? (document.getElementById("recogSubmit") || document.getElementById("recogNext"))
        : (scope.querySelector("[data-pl-check]") || scope.querySelector("[data-pl-goto]") || scope.querySelector("[data-pl-nextstep]"));
      if(s && !s.disabled){ e.preventDefault(); s.click(); }
    }
  });
})();

/* JS smooth scrolling ignores the CSS reduced-motion override – ask once per call. */
function smoothScroll(){
  try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"; } catch(_){ return "smooth"; }
}

const PLAYLIST_STEP_NAMES = ["Gudrybė", "Pavyzdys", "Pabandyk", "Patikra"];
function renderPlaylistQuestion(item, opts){
  const {year, q} = item;
  const k = `${year}-${q.num}`;
  const chosen = state.playlistAns[k];
  const submitted = !!state.playlistSubmitted[k];
  // a timed check holds everything but the verdict until the set is over:
  // three questions of one trick – the first solution would give away the rest
  const hold = !!opts.holdFeedback;
  const showSol = !hold && (opts.showSolution || submitted);
  const mode = opts.mode;
  // Mixed sets hide the mechanic until the answer is in – recognising the
  // trick is the point. It's revealed with the feedback.
  const hideMech = !!opts.hideMech && !submitted;
  // ...and asks for it: four trick names, one tap, logged like the drill
  const recogPick = (state.playlistRecogPick || {})[k];
  let recogRow = '';
  if(hideMech && q.mechanic && MECHANIC_LABEL[q.mechanic]){
    const others = MECHANIC_ORDER.filter(m => m !== q.mechanic && MECHANIC_LABEL[m]);
    const h = keyHash(k);
    const picks = [q.mechanic, others[h % others.length], others[(h >>> 3) % others.length], others[(h >>> 6) % others.length]];
    const choices = [...new Set(picks)].sort((a, b) => keyHash(k + a) - keyHash(k + b));
    recogRow = recogPick
      ? `<p class="help-bar" style="margin:4px 0 8px">${recogPick === q.mechanic ? '✓ Atpažinai' : 'Ne visai – tai'}: <b>${escapeHTML(MECHANIC_LABEL[q.mechanic])}</b>.</p>`
      : `<div style="margin:4px 0 8px"><b style="font-size:14px">Kokia gudrybė?</b> <span class="help-bar" style="margin:0">(nebūtina)</span><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px">${choices.map(m => `<button class="btn small ghost" data-pl-recog="${m}">${escapeHTML(MECHANIC_LABEL[m])}</button>`).join('')}</div></div>`;
  }
  // Review items say why they are back and, after the answer, when they return
  const dueItem = state.playlistMech === "__due__" ? (store.dueQueue || {})[k] : null;
  const dueNote = dueItem ? (dueItem.confWrong
    ? `<span class="pill bad" title="Praeitą kartą buvai tikras, bet suklydai">buvai tikras, bet suklydai</span>`
    : (dueItem.streak || 0) > 0
      ? `<span class="pill good">jau ${dueItem.streak} ${dueItem.streak === 1 ? 'kartą' : 'kartus'} iš eilės teisingai</span>`
      : `<span class="pill muted">${dueItem.fromContest ? 'klaida kontroliniame' : 'praeitą kartą suklydai'}</span>`) : '';
  const dueAfter = !dueItem ? '' : (chosen === q.correct
    ? ((dueItem.streak || 0) + 1 >= SR_INTERVALS_DAYS.length
        ? ' Įveikta – šis uždavinys nebegrįš.'
        : ` Sugrįš dar kartą po ${SR_INTERVALS_DAYS[Math.min((dueItem.streak || 0) + 1, SR_INTERVALS_DAYS.length - 1)]} d.`)
    : ' Pakartosime rytoj.');
  // picture answers (see renderArchiveCard): letter circles only
  const isImageOnly = !!q.imageOnlyOptions;
  const firstWrong = (state.playlistFirstWrong || {})[k] || null;
  const optionsHtml = ["A","B","C","D","E"].map(letter => {
    const v = q.options[letter];
    if(v == null) return "";
    let extra = "";
    if(submitted){
      if(q.correct === letter) extra = " correct";
      else if(chosen === letter || firstWrong === letter) extra = " wrong";
    } else if(firstWrong === letter){
      extra = " struck";
    } else if(chosen === letter){
      extra = " selected";
    }
    const off = (!submitted && firstWrong === letter ? ' disabled aria-disabled="true"' : '') + (extra === ' selected' ? ' aria-pressed="true"' : '');
    if(isImageOnly) return `<button type="button" class="opt opt-letter-only${extra}" data-letter="${letter}"${off}><span class="letter">${letter}</span></button>`;
    const isEmptyOpt = String(v).trim() === "";
    return `<button type="button" class="opt${isEmptyOpt ? ' opt-empty' : ''}${extra}" data-letter="${letter}"${off}>
      <span class="letter">${letter}</span>
      <span>${isEmptyOpt ? '<i style="color:var(--muted)">– atsakymas paveikslėlyje –</i>' : escapeHTML(v)}</span>
    </button>`;
  }).join("");
  const imageHint = isImageOnly
    ? `<p class="help-bar" style="margin:0 0 6px"><b>Atsakymai – paveikslėlyje.</b> Pažymėk raidę pagal pasirinktą pavyzdį.</p>`
    : (q.hasMissingOptionText ? `<p class="help-bar" style="margin:0 0 6px">Kai kurie atsakymai – paveikslėlyje (be teksto). Pažymėk raidę.</p>` : '');
  const showHint = mode === "try" && !submitted && state.playlistHintShown[k];
  // try step: the clock for the try-first friction starts when the problem is first shown
  const tryAt = mode === "try" ? ((state.playlistTryAt = state.playlistTryAt || {})[k] = (state.playlistTryAt || {})[k] || {shownAt: Date.now()}) : null;
  // hint: this question's own idea, else the trick's generic suggestion; the
  // official text's first sentence only as a last resort (it often computes
  // the answer outright)
  const approach = kidIdeaOf(q) || (q.mechanic && MECHANIC_HINTS[q.mechanic] && MECHANIC_HINTS[q.mechanic].suggest)
    || (q.solution ? approachFromSolution(q.solution) : null);
  // Calibration inside playlists too (try + mastery): the plan's core is
  // mostly playlists, so without this the parent's confidence stats starve.
  // hint ladder: first what to notice (the trick's own ladder), then this problem's idea
  const notice = q.mechanic && MECHANIC_HINTS[q.mechanic] && MECHANIC_HINTS[q.mechanic].notice;
  const hintTiers = [notice, approach].filter((h, i, a) => h && a.indexOf(h) === i);
  const hintCount = Math.min(hintTiers.length, Number(state.playlistHintShown[k]) || 0);
  const conf = (state.playlistConf || {})[k] || null;
  const needConf = askConfidenceNow() && mode !== "worked" && !submitted && !!chosen;
  const canCheck = chosen && !(needConf && !conf);
  const confRow = needConf ? (conf
    ? `<div class="help-bar">Pasitikėjimas: <b>${({a:'Tikrai žinau',b:'Spėju iš dviejų',c:'Atsitiktinai'})[conf]}</b></div>`
    : `<div class="confidence-row" role="radiogroup" aria-label="Kiek esi tikras?"><span class="help-bar" style="margin:0 8px 0 0">Kiek esi tikras?</span><button class="btn small ghost" role="radio" aria-checked="false" data-pl-conf="a">Tikrai žinau</button><button class="btn small ghost" role="radio" aria-checked="false" data-pl-conf="b">Spėju iš dviejų</button><button class="btn small ghost" role="radio" aria-checked="false" data-pl-conf="c">Atsitiktinai</button></div>`) : '';
  let footer = "";
  if(mode === "worked"){
    footer = submitted
      ? `<button class="btn small primary" data-pl-nextstep>Toliau – pabandyk pats</button>`
      : `<button class="btn small primary" data-pl-check ${chosen ? '' : 'disabled'}>Patikrinti</button>`;
  } else if(mode === "try"){
    const missed = submitted && chosen !== q.correct;
    const spare = missed && state.playlistContent && state.playlistContent.extraTry;
    footer = submitted
      ? (spare
        ? `<button class="btn small" data-pl-nextstep>Vis tiek į patikrą</button><button class="btn small primary" data-pl-anothertry>Dar vienas bandomasis →</button>`
        : `<button class="btn small primary" data-pl-nextstep>Toliau – įvaldymo testas</button>`)
      : `${confRow}${hintCount < hintTiers.length ? `<button class="btn small ghost" data-pl-hint>Užuomina${hintTiers.length > 1 ? ` (${hintCount + 1}/${hintTiers.length})` : ''}</button>` : ''}
         <button class="btn small primary" data-pl-check ${canCheck ? '' : 'disabled'}>Patikrinti</button>`;
  } else { // mastery
    footer = submitted
      ? (opts.nextKey ? `<button class="btn small primary" data-pl-goto="${opts.nextKey}">Kitas uždavinys →</button>` : '')
      : `${confRow}<button class="btn small primary" data-pl-check ${canCheck ? '' : 'disabled'}>Atsakyti</button>`;
  }
  return `
    <section class="card playlist-q" data-year="${year}" data-qnum="${q.num}" style="margin-top:12px"${opts.hidden ? ' hidden' : ''}>
      <div class="qmeta">
        <b>${q.num} uždavinys</b><span class="help-bar" style="margin:0">${escapeHTML(year)} m.</span>
        <span class="pill">${q.points} t.</span>
        ${q.mechanic && !hideMech ? `<span class="pill muted">${escapeHTML(MECHANIC_LABEL[q.mechanic]||q.mechanic)}</span>` : ''}
        ${hideMech ? `<span class="pill">❓ kokia gudrybė?</span>` : ''}
        ${dueNote}
      </div>
      ${questionBodyHTML(q, {lazy:false})}
      ${recogRow}
      ${mode === "worked" && !submitted && q.solutionKid ? `<div class="explain kid-sol worked-faded"><b>Pavyzdys</b>${kidSolutionHTML(q.solutionKid, {fade: true})}</div>` : ''}
      ${imageHint}
      <div class="options${isImageOnly ? ' image-options' : ''}">${optionsHtml}</div>
      ${submitted ? `<div class="explain verdict" role="status" tabindex="-1" style="background:${chosen === q.correct ? 'var(--good-soft)' : 'var(--bad-soft)'};border:1px solid ${chosen === q.correct ? 'var(--good)' : 'var(--bad)'};">
        <b>${chosen === q.correct ? (mode === 'worked' ? '✓ Pavyzdį užbaigei.' : firstWrong ? '✓ Teisingai – iš antro karto.' : '✓ Teisingai.') : 'Ne šis atsakymas.'}</b>${chosen === q.correct && mode !== 'worked' && !state.playlistSprint && (q.points || 3) >= 4 && q.mechanic && MECHANIC_LABEL[q.mechanic] ? ` Pastebėjai gudrybę – <b>${escapeHTML(MECHANIC_LABEL[q.mechanic])}</b>.` : ''}
        Teisingas atsakymas – <b>${q.correct}</b>${q.options[q.correct]?` (${escapeHTML(q.options[q.correct])})`:''}.${dueAfter}
      </div>` : ''}
      ${!submitted && firstWrong ? `<div class="explain verdict retry" role="status" tabindex="-1" style="background:var(--bad-soft);border:1px solid var(--bad)">
        <b>Ne ${firstWrong}.</b> Pabandyk dar kartą – vieną variantą jau atmetei.
        ${q.misconceptions && q.misconceptions[firstWrong] ? `<div class="misconception" style="margin-top:6px"><b>Kur galėjo slėptis klaida:</b> ${escapeHTML(q.misconceptions[firstWrong])}</div>` : ''}
        <div class="row" style="margin-top:8px"><button class="btn small ghost" data-pl-reveal>Rodyti sprendimą</button></div>
      </div>` : ''}
      ${tryAt && tryAt.tryFirstNote && !submitted && !showHint ? TRY_FIRST_NOTE_HTML : ''}
      ${showHint ? hintTiers.slice(0, hintCount).map((h, i) => `<div class="hint"><b>Užuomina ${i + 1}/${hintTiers.length}:</b> ${escapeHTML(h)}</div>`).join('') : ''}
      ${submitted && hold ? `<p class="help-bar" style="margin:6px 0">Sprendimai – kai baigsi rinkinį.</p>` : ''}
      ${submitted && !hold && (chosen !== q.correct ? chosen : firstWrong) && q.misconceptions && q.misconceptions[chosen !== q.correct ? chosen : firstWrong] ? `<div class="explain"><b>${chosen === q.correct ? 'Pirmą kartą' : 'Tavo klaida'}:</b> ${escapeHTML(q.misconceptions[chosen !== q.correct ? chosen : firstWrong])}</div>` : ''}
      ${submitted && !hold && chosen && (chosen !== q.correct || firstWrong) ? (() => { const m = (store.mistakes || {})[k]; return m && m.reason
        ? `<p class="help-bar" style="margin:6px 0">Užrašyta: ${escapeHTML(MISTAKE_REASONS[m.reason] || m.reason)}.</p>`
        : `<div style="margin:6px 0"><b style="font-size:14px">Kodėl, manai, suklydai?</b><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px">${Object.entries(MISTAKE_REASONS).map(([id, t]) => `<button class="btn small ghost" data-pl-why="${id}">${escapeHTML(t)}</button>`).join('')}</div></div>`; })() : ''}
      ${showSol && (q.solutionKid || q.solution) && !(mode === "worked" && !submitted && q.solutionKid) ? `<div class="explain">${solutionBlockHTML(q)}</div>` : ''}
      <div class="footer-actions">
        <div class="row"></div>
        <div class="row">${footer}</div>
      </div>
    </section>
  `;
}

function renderReview(){
  const q = state.reviewSimilar;
  const showResult = state._submittedReview;
  const backLabel = state._returnTo === "archiveYear"
    ? "← Atgal į originalų testą"
    : (state._returnTo === "home" ? "← Į pradžią" : "← Atgal į rezultatus");
  const subtopicLabel = q.subtopic && SUBTOPIC_LABEL[q.subtopic] ? SUBTOPIC_LABEL[q.subtopic] : "";
  $app.innerHTML = `
    <section class="card">
      <button class="nav-back" id="backBtn">${backLabel}</button>
      <div class="qmeta">
        <span><b>Panašus uždavinys</b></span>
        <span class="pill">${q.difficulty} t.</span>
        <span class="pill muted">${CATEGORY_LABEL[q.category]||q.category}</span>
        ${subtopicLabel ? `<span class="subtopic">· ${escapeHTML(subtopicLabel)}</span>`:``}
      </div>
      <div class="qprompt">${escapeHTML(q.prompt)}</div>
      ${q.figure ? `<div class="figure">${q.figure}</div>` : ``}

      <div class="options ${q.imageOptions?'image-options':''}" id="rOptions">
        ${q.options.map((opt,i)=>{
          let cls = "opt";
          if(q.imageOptions) cls += " image-opt";
          if(showResult){
            if(i === q.correctIndex) cls += " correct";
            else if(i === state._reviewChosen) cls += " wrong";
          } else if(state._reviewChosen === i){

          }
          const body = q.imageOptions
            ? `<span class="opt-figure">${opt}</span>`
            : `<span>${escapeHTML(opt)}</span>`;
          return `<button type="button" class="${cls}" data-i="${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            ${body}
          </button>`;
        }).join("")}
      </div>

      ${state._reviewFirstStep && !showResult && q.firstStep ? `<div class="firststep"><b>Pirmas žingsnis:</b> ${escapeHTML(q.firstStep)}</div>`:``}
      ${state._reviewHint && !showResult ? `<div class="hint"><b>Užuomina:</b> ${escapeHTML(q.hint)}</div>`:``}
      ${showResult ? `<div class="explain"><b>Paaiškinimas:</b> ${escapeHTML(q.explain)}</div>`:``}

      <div class="footer-actions">
        <div class="row">
          ${!showResult && !state._reviewFirstStep && q.firstStep ? `<button class="btn ghost small" id="rFirstStep">Pirmas žingsnis</button>`:``}
          ${!showResult && !state._reviewHint ? `<button class="btn ghost small" id="rHint">Užuomina</button>`:``}
        </div>
        <div class="row">
          ${!showResult ? `<button class="btn primary" id="rSubmit" ${state._reviewChosen==null?"disabled":""}>Patikrinti</button>`:``}
          ${showResult ? `<button class="btn" id="rAnother">Dar vienas panašus</button>`:``}
        </div>
      </div>
    </section>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{
    state._reviewChosen=null; state._reviewHint=false; state._reviewFirstStep=false; state._submittedReview=false;
    if(state._returnTo === "archiveYear"){
      state._returnTo = null;
      state.view = "archiveYear";
      renderArchiveYear();
    } else if(state._returnTo === "home"){
      state._returnTo = null;
      state.view = "home";
      renderHome();
    } else {
      state.view="results"; renderResults();
    }
  });
  const fs = document.getElementById("rFirstStep");
  if(fs) fs.addEventListener("click", ()=>{ state._reviewFirstStep=true; renderReview(); });
  document.getElementById("rOptions").addEventListener("click", e=>{
    if(showResult) return;
    const o = e.target.closest(".opt"); if(!o) return;
    state._reviewChosen = parseInt(o.dataset.i,10);
    renderReview();
  });
  const h = document.getElementById("rHint");
  if(h) h.addEventListener("click", ()=>{ state._reviewHint=true; renderReview(); });
  const s = document.getElementById("rSubmit");
  if(s) s.addEventListener("click", ()=>{
    state._submittedReview = true;
    // also count toward catStats
    const c = store.catStats[q.category] = store.catStats[q.category] || {attempts:0, wrong:0};
    c.attempts++;
    if(state._reviewChosen !== q.correctIndex) c.wrong++;
    saveStore(store);
    renderReview();
  });
  const a = document.getElementById("rAnother");
  if(a) a.addEventListener("click", ()=>{
    state._reviewChosen=null; state._reviewHint=false; state._reviewFirstStep=false; state._submittedReview=false;
    openSimilar(q.gen);
  });
}

/* ============================================================
   VII¼. COURSE LAYER – sprint, mixed sets, recognition drill,
   and the daily treniruočių planas with contest countdown.
   ============================================================ */

/* -------- 3-pt speed sprint: 10 questions, 10 minutes ---------
   Fluency on the 3-point block is a contest skill in itself – banking
   30 points fast buys time for the 5-point teeth of the paper. */
function startSprint(){
  state.questions = generateQuiz(10, [3]);
  state.current = 0;
  state.answers = [];
  state.hintsUsedThis = 0;
  state._chosen = null; state._hintShown = false; state._firstStepShown = false;
  state._confidence = null;
  state._questionStartedAt = Date.now();
  state._sprintMode = true;
  state._graceMode = false;
  state.view = "quiz";
  startTimer(10 * 60 * 1000);
  renderQuiz();
}

/* -------- Mixed set: interleaved practice, mechanic hidden ---------
   Blocked playlists are right for first acquisition; retention and the
   "which trick is this?" skill need mixed practice with the label off. */
/* Real 3-point sprint: 10 archive 3-pointers (unseen first, held-out papers
   excluded) against the contest clock – ~1 min each. The generated sprint
   trains arithmetic speed; this one trains the actual first block. */
function openArchiveSprint(){
  const reserved = new Set(reservedYears().map(String));
  const pool = [];
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year))) continue;
    for(const q of t.questions) if(q.correct && (q.points || 3) === 3) pool.push({year: t.year, q});
  }
  const unseen = pool.filter(x => !isRecentlySeen(x.year, x.q.num));
  const source = unseen.length >= 10 ? unseen : pool;
  shuffleInPlace(source);
  const items = source.slice(0, 10);
  if(items.length < 5){ alert("Per mažai 3 t. uždavinių."); return; }
  stopPlaylistTimer();
  state.view = "playlist";
  state.playlistSprint = true;
  state.playlistRetry = null;
  state.playlistMech = "__mixed__";
  state.playlistRetest = false;
  state.playlistRecorded = false;
  state.playlistFinalized = false;
  state.playlistStep = 3;
  state.playlistContent = {sourceBand:3, worked:null, tryQ:null, mastery:items, bandsAvailable:[]};
  state.playlistAns = {}; state.playlistSubmitted = {}; state.playlistHintShown = {}; state.playlistFirstWrong = {}; state.playlistTryAt = {}; state.playlistFocusKey = null; state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false; state.playlistConf = {};
  state.playlistTimerStart = 0;
  state.playlistTimeExpired = false;
  renderPlaylist();
}

// "Antras bandymas": a paper's wrong + skipped questions again, no clock and
// no solutions until each is answered. Separates points lost to time and
// haste from points lost to not knowing how (stored as contest.retry).
const RETRY_MAX = 10;
function contestRetryItems(c){
  const t = ARCHIVE.find(t => String(t.year) === String(c.year));
  if(!t || !c.answers) return [];
  const miss = t.questions.filter(q => q.correct && c.answers[q.num] !== q.correct);
  // easier first: a missed 3-pointer is the cheapest point to win back
  miss.sort((a, b) => (a.points || 3) - (b.points || 3) || a.num - b.num);
  return miss.slice(0, RETRY_MAX).map(q => ({year: t.year, q}));
}
function openContestRetry(when){
  const c = (store.contests || []).find(x => x.when === when);
  if(!c) return;
  const items = contestRetryItems(c);
  if(!items.length) return;
  stopPlaylistTimer();
  state.view = "playlist";
  state.playlistSprint = false;
  state.playlistRetry = when;
  state.playlistMech = "__mixed__";
  state.playlistRetest = false;
  state.playlistRecorded = false;
  state.playlistFinalized = false;
  state.playlistStep = 3;
  state.playlistContent = {sourceBand: 3, worked: null, tryQ: null, mastery: items, bandsAvailable: []};
  state.playlistAns = {}; state.playlistSubmitted = {}; state.playlistHintShown = {}; state.playlistFirstWrong = {}; state.playlistTryAt = {}; state.playlistFocusKey = null; state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false; state.playlistConf = {};
  state.playlistTimerStart = 0;
  state.playlistTimeExpired = false;
  renderPlaylist();
}

function openMixedSet(count){
  count = count || 6;
  const recentMechs = Object.keys(store.mechRecent || {});
  const pool = [];
  const reserved = new Set(reservedYears().map(String));
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year))) continue;   // held out for contest sims
    for(const q of t.questions){
      if(!q.correct || !q.mechanic) continue;
      if((q.points || 3) < 4 && !recentMechs.includes(q.mechanic)) continue;
      pool.push({year:t.year, q});
    }
  }
  const practiced = pool.filter(x => recentMechs.includes(x.q.mechanic) && !isRecentlySeen(x.year, x.q.num));
  const unseen    = pool.filter(x => !isRecentlySeen(x.year, x.q.num));
  const source = practiced.length >= count ? practiced : (unseen.length >= count ? unseen : pool);
  shuffleInPlace(source);
  // at most 2 per mechanic – otherwise it isn't interleaving
  const perMech = {};
  const items = [];
  for(const x of source){
    const m = x.q.mechanic;
    perMech[m] = perMech[m] || 0;
    if(perMech[m] >= 2) continue;
    perMech[m]++;
    items.push(x);
    if(items.length >= count) break;
  }
  if(items.length < 3){ alert("Per mažai tinkamų uždavinių mišriam rinkiniui."); return; }
  stopPlaylistTimer();
  state.view = "playlist";
  state.playlistSprint = false;
  state.playlistRetry = null;
  state.playlistMech = "__mixed__";
  state.playlistRetest = false;
  state.playlistRecorded = false;
  state.playlistFinalized = false;
  state.playlistStep = 3;
  state.playlistContent = {sourceBand:0, worked:null, tryQ:null, mastery:items, bandsAvailable:[]};
  state.playlistAns = {};
  state.playlistSubmitted = {};
  state.playlistHintShown = {}; state.playlistFirstWrong = {}; state.playlistTryAt = {}; state.playlistFocusKey = null; state.playlistFromBook = false; state.playlistRecogPick = {}; state.playlistPeeked = false;
  state.playlistConf = {};
  state.playlistTimerStart = 0;
  state.playlistTimeExpired = false;
  renderPlaylist();
}

/* -------- Mechanic-recognition drill: "Kokia gudrybė?" ---------
   The real 5-point bottleneck is recognising WHICH trick a problem
   hides. Show a 4/5-pt question; the kid picks the mechanic (not the
   answer) from 4 options. 10 per round, no solving required. */
/* Catch-all tags: fine for stats, useless as an answer to "which trick?" */
const RECOG_CATCH_ALL = new Set(["arith-compute", "geometry-misc"]);
function buildRecogPool(){
  const pool = [];
  const reserved = new Set(reservedYears().map(String));
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year))) continue;   // held out for contest sims
    for(const q of t.questions){
      if((q.points || 3) < 4) continue;
      if(!q.mechanic || !MECHANIC_LABEL[q.mechanic]) continue;
      if(RECOG_CATCH_ALL.has(q.mechanic)) continue;   // "just compute" is not a trick to recognise
      pool.push({year:t.year, q});
    }
  }
  return pool;
}
function isRecogRecentlySeen(year, num){
  const t = (store.recogSeen || {})[`${year}-${num}`];
  return !!t && (Date.now() - t) < RECENT_SEEN_DAYS * ONE_DAY_MS;
}

function openRecogDrill(){
  const pool = buildRecogPool();
  if(pool.length < 10){ alert("Per mažai uždavinių atpažinimo treniruotei."); return; }
  const mechSet = [...new Set(pool.map(x => x.q.mechanic))];
  shuffleInPlace(pool);
  // Freshness: questions not shown in the drill for 2 weeks come first, so
  // the kid recognises mechanics, not pictures. (Stable partition keeps
  // the shuffle inside each half.)
  pool.sort((a, b) => (isRecogRecentlySeen(a.year, a.q.num) ? 1 : 0) - (isRecogRecentlySeen(b.year, b.q.num) ? 1 : 0));
  // one question per mechanic per round, for variety
  const perMech = {};
  const qs = [];
  for(const x of pool){
    if(perMech[x.q.mechanic]) continue;
    perMech[x.q.mechanic] = 1;
    qs.push(x);
    if(qs.length >= 10) break;
  }
  while(qs.length < 10) qs.push(pool[Math.floor(Math.random()*pool.length)]);
  state.view = "recog";
  state.recogQs = qs.map(x => ({
    year: x.year, q: x.q,
    opts: shuffleInPlace([x.q.mechanic, ...shuffleInPlace(mechSet.filter(m => m !== x.q.mechanic)).slice(0,3)]),
  }));
  state.recogIdx = 0;
  state.recogChosen = null;
  state.recogSubmitted = false;
  state.recogCorrect = 0;
  state.recogTimes = []; state._recogShownIdx = null; state.recogMixups = [];
  renderRecog();
}

function renderRecog(){
  const items = state.recogQs;
  const idx = state.recogIdx;
  if(idx >= items.length){ renderRecogResult(); return; }
  if(!state.recogSubmitted && state._recogShownIdx !== idx){ state._recogShownIdx = idx; state._recogShownAt = Date.now(); }

  const q = it.q;

        <button class="btn ghost small" id="recogQuit">← Pradžia</button>
      </div>

    </section>

      <div class="qmeta"><span class="pill ${q.points===5?'bad':''}">${q.points} t.</span><span class="pill muted">${escapeHTML(it.year)} m.</span></div>

      <div class="options" id="recogOptions">

          return `<button type="button" class="${cls}" data-mech="${m}">

      </div>
      ${submitted ? `<div class="explain" style="background:${right?'var(--good-soft)':'var(--bad-soft)'};border:1px solid ${right?'var(--good)':'var(--bad)'}">
        <b>${right ? '✓ Teisingai.' : 'Ne.'}</b> Tai – <b>${escapeHTML(MECHANIC_LABEL[q.mechanic]||q.mechanic)}</b>.
        ${(() => { const idea = q.solutionKid && (q.solutionKid.match(/^Gudrybė:\s*(.+?[.!?])(\s|$)/) || [])[1]; return idea ? `<div style="margin-top:6px"><b>Šiame uždavinyje:</b> ${escapeHTML(idea)}</div>` : ''; })()}
        ${summary ? `<div style="margin-top:6px;font-size:13px">${escapeHTML(summary)}</div>` : ''}
      </div>` : ''}
      <div class="footer-actions">
        <div class="row"></div>
        <div class="row">
          ${!submitted
            ? `<button class="btn primary" id="recogSubmit" ${state.recogChosen ? '' : 'disabled'}>Patikrinti</button>`
            : `<button class="btn primary" id="recogNext">${idx < items.length-1 ? 'Kitas →' : 'Rezultatai →'}</button>`}
        </div>
      </div>
    </section>`;
  document.getElementById("recogQuit").addEventListener("click", ()=>{ state.view="home"; renderHome(); });
  document.getElementById("recogOptions").addEventListener("click", e=>{
    if(state.recogSubmitted) return;
    const o = e.target.closest(".opt"); if(!o) return;
    state.recogChosen = o.dataset.mech;
    renderRecog();
  });
  const sub = document.getElementById("recogSubmit");
  if(sub) sub.addEventListener("click", ()=>{
    if(!state.recogChosen) return;
    state.recogSubmitted = true;
    const right = state.recogChosen === q.mechanic;
    if(right) state.recogCorrect++;
    // recognition speed: on contest day the trick should be seen in seconds
    const secs = Math.min(120, Math.round((Date.now() - (state._recogShownAt || Date.now())) / 1000));
    state.recogTimes = (state.recogTimes || []).concat([{secs, right}]);
    if(!right){   // which tricks get mixed up – the pair is the lesson
      const pair = `${q.mechanic}>${state.recogChosen}`;
      store.recogConfusion = store.recogConfusion || {};
      store.recogConfusion[pair] = (store.recogConfusion[pair] || 0) + 1;
      state.recogMixups = (state.recogMixups || []).concat([pair]);
    }
    store.recogSeen[`${state.recogQs[state.recogIdx].year}-${q.num}`] = Date.now();
    store.recogStats.attempts++;
    if(right) store.recogStats.correct++;
    logActivity(right, 3);   // recognition is real practice – counts for streak/stars
    Sfx.play(right ? "correct" : "wrong");
    saveStore(store);
    renderRecog();
  });
  const nxt = document.getElementById("recogNext");
  if(nxt) nxt.addEventListener("click", ()=>{
    state.recogIdx++;

function renderRecogResult(){

      ${(() => { const all = Object.entries(store.recogConfusion || {}).filter(([p]) => (state.recogMixups || []).includes(p)).sort((a, b) => b[1] - a[1]);

      <p class="help-bar">${ok >= 8 ? 'Gudrybę dažniausiai pamatei iš karto – konkurse tai sutaupo minučių.' : ok >= 5 ? 'Kuo greičiau atpažįsti gudrybę, tuo greičiau žinai, ką daryti.' : 'Atpažinti padeda pažinti: pasimokyk gudrybės, kurią painiojai, ir pabandyk vėl.'}</p>
      ${(() => { const mx = Object.entries(store.recogConfusion || {}).filter(([p]) => (state.recogMixups || []).includes(p)).sort((a, b) => b[1] - a[1])[0]; if(!mx) return ''; const act = mx[0].split('>')[0]; return MECHANIC_LABEL[act] ? `<p style="margin:6px 0 0"><button class="btn small" id="recogLearn" data-mech="${act}">Mokytis: ${escapeHTML(MECHANIC_LABEL[act])} →</button></p>` : ''; })()}
      <div class="footer-actions" style="justify-content:center;gap:8px">

/* -------- Mąstymo treniruotė: someone else's slip + putting steps in order --------
   Two kinds of item, alternating. "Kur suklydo Tomas?" – an erroneous
   example: Tomas picked a wrong letter and the kid matches it to the slip
   that produces it (the question's own notes, 2–3 letters), then sees the
   right answer. Finding and explaining another's error helps delayed
   learning (Adams, McLaren et al.; Große & Renkl). "Sudėliok sprendimą" –
   the kid solution's steps shuffled; tap them in order (reading the
   reasoning, not just the answer). No clock, one star per item. */
const THINK_ITEMS = 6;
const THINK_NAMES = ["Tomas", "Ugnė", "Matas", "Emilija", "Jonas", "Gabija"];   // "suklydo" / "pasirinko" fit both
function buildThinkItems(){
  const reserved = new Set(reservedYears().map(String));
  const slip = [], order = [];
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year)) || OUT_OF_SCOPE_YEARS.has(String(t.year))) continue;
    for(const q of t.questions){
      if((q.points || 3) < 4 || !q.correct) continue;
      const notes = Object.entries(q.misconceptions || {}).filter(([L, txt]) => L !== q.correct && q.options && q.options[L] != null && txt && txt.length > 15);
      if(notes.length >= 2) slip.push({kind: "slip", year: t.year, q, notes});
      const parts = q.solutionKid ? kidSolutionParts(q.solutionKid) : null;
      if(parts && parts.paras.length >= 3 && parts.paras.length <= 5) order.push({kind: "order", year: t.year, q, parts});
    }
  }
  const fresh = arr => shuffleInPlace(arr).sort((a, b) => (isRecentlySeen(a.year, a.q.num) ? 1 : 0) - (isRecentlySeen(b.year, b.q.num) ? 1 : 0));
  fresh(slip); fresh(order);
  const items = [];
  for(let i = 0; items.length < THINK_ITEMS && (slip.length || order.length); i++){
    const src = (i % 2 === 0 && slip.length) || !order.length ? slip : order;
    const it = src.shift();
    if(it.kind === "slip"){
      const pick = it.notes[Math.floor(Math.random() * it.notes.length)];
      it.chosen = pick[0];
      it.choices = shuffleInPlace(it.notes.slice(0, 3).some(n => n[0] === pick[0]) ? it.notes.slice(0, 3) : [pick].concat(it.notes.filter(n => n[0] !== pick[0]).slice(0, 2)));
    } else {
      it.shuffled = shuffleInPlace(it.parts.paras.map((p, i) => i));
      if(it.shuffled.every((v, i) => v === i)) it.shuffled.reverse();
    }
    items.push(it);
  }
  return items;
}
function openThinkDrill(){
  const items = buildThinkItems();
  if(items.length < 2){ showToast("🧠", "Kol kas per mažai uždavinių šiai treniruotei."); return; }
  state.view = "think";
  state.think = {items, idx: 0, ok: 0, pick: null, done: false, order: [], misses: 0};
  renderThink();
}
function renderThink(){
  const T = state.think, it = T.items[T.idx], q = it.q;
  const head = `<div class="contest-header"><div><b>🧠 Mąstymo treniruotė</b> <span class="help-bar" style="margin-left:6px">${T.idx + 1} / ${T.items.length}</span></div><button class="btn ghost small" id="thinkQuit">← Pradžia</button></div>`;
  let body = "";
  if(it.kind === "slip"){
    const right = T.done && T.pick === it.chosen;
    const who = THINK_NAMES[keyHash(`${it.year}-${q.num}`) % THINK_NAMES.length];
    body = `<h3 style="margin:4px 0">Kur suklydo ${who}?</h3>

      ${questionBodyHTML(q, {lazy:false})}
      <div class="options">${it.choices.map(([L, txt]) => {
        let cls = "opt";
        if(T.done && L === it.chosen) cls += " correct"; else if(T.done && L === T.pick) cls += " wrong"; else if(!T.done && T.pick === L) cls += " selected";

        <details style="margin-top:8px"><summary>Sprendimas</summary><div class="explain">${solutionBlockHTML(q)}</div></details>` : ''}`;

      ${it.parts.trick ? `<p class="kid-trick" style="margin:6px 0">💡 ${escapeHTML(it.parts.trick)}</p>` : ''}
      ${placed.length ? `<ol class="think-placed" style="margin:6px 0 10px 18px;padding:0">${placed.map(i => `<li style="margin:4px 0">${escapeHTML(it.parts.paras[i])}</li>`).join('')}</ol>` : ''}
      ${!done ? `<div class="options">${it.shuffled.filter(i => !placed.includes(i)).map(i => `<button type="button" class="opt${T.wrongTap === i ? ' wrong' : ''}" data-think-step="${i}"><span>${escapeHTML(it.parts.paras[i])}</span></button>`).join('')}</div>
        ${T.wrongTap != null ? `<p class="help-bar" role="status" style="color:var(--bad)">Ne šis – ko reikia prieš jį?</p>` : ''}` : `<div class="explain verdict" role="status" tabindex="-1" style="background:var(--good-soft);border:1px solid var(--good)"><b>✓ Sudėliota${T.misses ? ` (pataisymų: ${T.misses})` : ' iš pirmo karto'}.</b> ${it.parts.ans ? escapeHTML(it.parts.ans.trim()) : ''}</div>`}`;
  }
  const finished = it.kind === "slip" ? T.done : T.order.length === it.parts.paras.length;
  $app.innerHTML = `<section class="card">${head}</section>

      <div class="footer-actions"><div class="row"></div><div class="row">

  if(chk) chk.addEventListener("click", ()=>{

    try { const v = $app.querySelector(".verdict"); if(v){ v.scrollIntoView({behavior: smoothScroll(), block: "center"}); v.focus({preventScroll: true}); } } catch(_){}

  $app.querySelectorAll("[data-think-step]").forEach(b => b.addEventListener("click", ()=>{
    const i = Number(b.dataset.thinkStep);

      if(T.order.length === it.parts.paras.length){
        const right = T.misses === 0;
        if(right) T.ok++;
        thinkRecord("order", right, it);

      }

    renderThink();
  }));
  const nx = document.getElementById("thinkNext");
  if(nx) nx.addEventListener("click", ()=>{
    if(T.idx >= T.items.length - 1){ renderThinkResult(); return; }
    T.idx++; T.pick = null; T.done = false; T.order = []; T.misses = 0; T.wrongTap = null;
    renderThink(); toTop();
  });
}
function thinkRecord(kind, right, it){
  store.thinkStats = store.thinkStats || {};
  const s = store.thinkStats[kind] = store.thinkStats[kind] || {a: 0, ok: 0};
  s.a++; if(right) s.ok++;
  store.seenQ[`${it.year}-${it.q.num}`] = Date.now();
  logActivity(right, 3);   // real thinking work: streak + one star, no mechanic stats
  saveStore(store);
}
/* 🃏 Prisimink gudrybę: the front shows only the trick's name; the kid
   recalls how to spot it, the first step and the usual slip, then flips and
   rates. Practised tricks only; the ones rated "ne" come back first. */
function recallDeck(){
  const practised = Object.keys(MECHANIC_METHODOLOGY).filter(m => MECHANIC_LABEL[m] && (((store.mechRecent || {})[m] || []).length >= 2 || (store.masteredBand || {})[m]));
  const R = store.trickRecall || {};
  const score = m => { const r = R[m]; if(!r) return 0; const ageD = (Date.now() - r.at) / ONE_DAY_MS; return (r.r === 'no' ? 1 : r.r === 'part' ? 3 : 7) - ageD; };
  return [...new Set(practised)].filter(m => MECHANIC_METHODOLOGY[m] && MECHANIC_METHODOLOGY[m].trick).sort((a, b) => score(a) - score(b)).slice(0, 5);
}
function openRecallCards(){

  state.recall = {deck, idx: 0, flipped: false, ok: 0};
  renderRecall();
}
