      const last = store.contests[store.contests.length - 1];
      if(last){ last.paper = true; saveStore(store); checkAchievements(); }
    });
  };
  render();
}

function openContest(year){
  const test = ARCHIVE.find(t => t.year === year);
  if(!test){ return; }
  const qs = test.questions.filter(q => q.correct).slice(0, 30);
  if(qs.length < 28){
    alert(`${year} m. neturi pakankamai uždavinių su atsakymais kontroliniam.`);
    return;
  }
  state.view = "contest";
  state.contestYear = year;
  state.contestQuestions = qs;
  prefetchFigures(qs);   // the whole paper's pictures, in case the connection drops mid-test
  state.contestAnswers = {};   // { qnum: chosenLetter }
  state.contestFlags = {};     // { qnum: true } – "abejoju, grįšiu" marks
  state.contestStruck = {};    // { qnum: {letter: true} } – options crossed out
  state.contestTimes = {};     // { qnum: ms spent looking at it }
  state._ctShown = null;
  state.contestCurrent = 0;
  state.contestStartedAt = Date.now();
  state.contestEndsAt = Date.now() + CONTEST_DURATION_MS;
  state.contestSubmitted = false;
  state._contestWarned = false;
  persistContestProgress();
  startContestTicker();
  renderContest();
}

// Restore a contest saved by persistContestProgress. If the 75 minutes ran
// out while the page was closed, grade the saved answers right away.
function resumeContest(){
  const saved = store.contestInProgress;
  if(!saved) return;
  const test = ARCHIVE.find(t => t.year === saved.year);
  if(!test){ store.contestInProgress = null; saveStore(store); renderHome(); return; }
  const qs = test.questions.filter(q => q.correct).slice(0, 30);
  state.view = "contest";
  state.contestYear = saved.year;
  state.contestQuestions = qs;
  state.contestAnswers = saved.answers || {};
  state.contestFlags = saved.flags || {};
  state.contestStruck = saved.struck || {};
  state.contestTimes = saved.times || {};
  state._ctShown = null;
  state.contestCurrent = Math.min(saved.current || 0, qs.length - 1);
  state.contestStartedAt = saved.startedAt;
  state.contestEndsAt = saved.endsAt;
  state.contestSubmitted = false;
  if(Date.now() >= state.contestEndsAt){
    finishContest(true);
    return;
  }
  startContestTicker();
  renderContest();
}

/* Time on the question being looked at: credited when the kid moves on
   (or finishes), capped at 20 min per visit so a forgotten tab can't skew it. */
function creditContestTime(){
  if(!state._ctShown) return;
  const ms = Math.min(20 * 60000, Date.now() - state._ctShown.at);
  state.contestTimes = state.contestTimes || {};
  state.contestTimes[state._ctShown.num] = (state.contestTimes[state._ctShown.num] || 0) + ms;
  state._ctShown = null;
}
function renderContest(){
  const qs = state.contestQuestions;
  const idx = state.contestCurrent;
  const q = qs[idx];
  if(!state._ctShown || state._ctShown.num !== q.num){ creditContestTime(); state._ctShown = {num: q.num, at: Date.now()}; }
  const total = qs.length;
  const answeredCount = Object.keys(state.contestAnswers).length;
  const remain = Math.max(0, state.contestEndsAt - Date.now());
  const mm = Math.floor(remain/60000);
  const ss = Math.floor((remain%60000)/1000);

  const optionsHtml = ["A","B","C","D","E"].map(letter => {
    const v = q.options[letter]; if(v == null) return "";
    const chosen = state.contestAnswers[q.num];
    const struck = !!((state.contestStruck || {})[q.num] || {})[letter];
    const cls = "opt" + (chosen === letter ? " selected" : "") + (struck ? " struck" : "");
    // ✕ = cross the option out, as on the paper: eliminating two or three
    // options is what makes a guess worth its −¼ risk
    return `<div class="opt-wrap"><button type="button" class="${cls}" data-letter="${letter}" aria-pressed="${chosen === letter}">
      <span class="letter">${letter}</span>
      <span>${String(v).trim() === "" ? '<i style="color:var(--muted)">– atsakymas paveikslėlyje –</i>' : escapeHTML(v)}</span>
    </button><button type="button" class="opt-x" data-strike="${letter}" aria-pressed="${struck}" title="${struck ? 'Grąžinti' : 'Išbraukti'} ${letter} variantą" aria-label="${struck ? 'Grąžinti' : 'Išbraukti'} ${letter} variantą">✕</button></div>`;
  }).join("");
  // Question strip showing all 30; answered are filled
  const strip = qs.map((qq, i) => {
    const ans = state.contestAnswers[qq.num];
    const cur = i === idx ? " current" : "";
    const filled = ans ? " filled" : "";
    const flagged = (state.contestFlags || {})[qq.num] ? " flagged" : "";
    return `<button class="contest-pip${cur}${filled}${flagged}" data-jump="${i}" title="${qq.num} uždavinys (${qq.points} t.)${flagged ? ' – pažymėtas grįžti' : ''}">${qq.num}</button>`;
  }).join("");

  $app.innerHTML = `
    <section class="card">
      <div class="contest-header">
        <div>
          <b>Kontrolinis – ${escapeHTML(state.contestYear)} m.</b>
          <span class="help-bar" style="margin-left:6px">${answeredCount} / ${total} atsakyta${Object.keys(state.contestFlags || {}).length ? ` · 🚩 ${Object.keys(state.contestFlags).length}` : ''}</span>
        </div>
        <div class="contest-timer-box">
          ⏱ <span id="contestTimer">${mm}:${String(ss).padStart(2,"0")}</span>
        </div>
      </div>
      <div class="contest-strip">${strip}</div>
      <p class="help-bar" id="contestPace" role="status" style="margin:6px 0 0;display:none;color:var(--bad)"></p>
    </section>

    <section class="card">
      <div class="qmeta">
        <b>${q.num} uždavinys</b>
        <span class="pill">${q.points} t.</span>
        <span class="pill bad">−${fmtPts(q.points*0.25)} už klaidą</span>
      </div>
      ${questionBodyHTML(q, {lazy:false})}
      <div class="options" id="contestOptions">${optionsHtml}</div>
      ${state.contestAnswers[q.num] ? `<p class="help-bar" style="margin:6px 0 0">Persigalvojai? Paspausk pasirinktą atsakymą dar kartą – jis bus atšauktas (už neatsakytą baudos nėra).</p>` : ''}

      <div class="footer-actions">
        <div class="row">
          ${idx > 0 ? `<button class="btn ghost small" id="contestPrev">← Ankstesnis</button>` : ''}
          <button class="btn small ghost" id="contestFlag" title="Pažymėk, jei abejoji – juostelėje matysis raudonas brūkšnys">${(state.contestFlags || {})[q.num] ? '🚩 Nuimti žymę' : '🚩 Abejoju – grįšiu'}</button>
        </div>
        <div class="row">
          ${(() => { const all = qs.every(qq => state.contestAnswers[qq.num]);
            return `<button class="btn ${all ? 'ghost' : 'primary'}" id="contestSkip" title="Į kitą neatsakytą – praleistą galėsi atsakyti vėliau">Kitas →</button>
            <button class="btn ${all ? 'primary' : 'ghost'}" id="contestFinish">Baigti</button>`; })()}
        </div>
      </div>
    </section>
  `;
  centerStripPip();

  document.getElementById("contestOptions").addEventListener("click", e => {
    const x = e.target.closest("[data-strike]");
    if(x){
      const st = state.contestStruck = state.contestStruck || {};
      const m = st[q.num] = st[q.num] || {};
      if(m[x.dataset.strike]) delete m[x.dataset.strike]; else m[x.dataset.strike] = true;
      if(!Object.keys(m).length) delete st[q.num];
      persistContestProgress(); renderContest(); return;
    }
    const o = e.target.closest(".opt"); if(!o) return;
    // tapping the chosen answer again withdraws it: under −25 % a blank can
    // be the better choice, exactly as erasing on the real answer sheet
    if(state.contestAnswers[q.num] === o.dataset.letter) delete state.contestAnswers[q.num];
    else state.contestAnswers[q.num] = o.dataset.letter;
    persistContestProgress();
    renderContest();
  });
  $app.querySelectorAll("[data-jump]").forEach(btn => {
    btn.addEventListener("click", ()=>{
      state.contestCurrent = parseInt(btn.dataset.jump, 10);
      persistContestProgress();
      renderContest();
    });
  });
  const prev = document.getElementById("contestPrev");
  if(prev) prev.addEventListener("click", ()=>{ state.contestCurrent--; persistContestProgress(); renderContest(); });
  const next = document.getElementById("contestNext");
  if(next) next.addEventListener("click", ()=>{ state.contestCurrent++; persistContestProgress(); renderContest(); });
  const flagBtn = document.getElementById("contestFlag");
  if(flagBtn) flagBtn.addEventListener("click", ()=>{
    state.contestFlags = state.contestFlags || {};
    if(state.contestFlags[q.num]) delete state.contestFlags[q.num]; else state.contestFlags[q.num] = true;
    persistContestProgress(); renderContest();
  });
  const skip = document.getElementById("contestSkip");
  if(skip) skip.addEventListener("click", ()=>{
    // advance to next unanswered
    let i = state.contestCurrent + 1;
    for(let j = 0; j < qs.length; j++){
      const k = (i + j) % qs.length;
      if(!state.contestAnswers[qs[k].num]){ state.contestCurrent = k; persistContestProgress(); renderContest(); return; }
    }
    // all answered: go on to the next 🚩 question (or simply the next one) –
    // finishing stays the job of "Baigti", never a side effect of skipping
    const fl = qs.map((qq, k) => k).filter(k => (state.contestFlags || {})[qs[k].num] && k !== state.contestCurrent);
    state.contestCurrent = fl.find(k => k > state.contestCurrent) ?? fl[0] ?? (state.contestCurrent + 1) % qs.length;
    persistContestProgress(); renderContest();
  });
  document.getElementById("contestFinish").addEventListener("click", ()=>{
    const unanswered = qs.filter(qq => !state.contestAnswers[qq.num]).length;
    const flaggedN = Object.keys(state.contestFlags || {}).length;
    const flagLine = flaggedN ? `\n\nPažymėjai grįžti: ${flaggedN} ${pluralForm(flaggedN,'uždavinį','uždavinius','uždavinių')} (raudonas brūkšnys juostelėje).` : "";
    const msg = (unanswered
      ? `Liko ${unanswered} ${pluralForm(unanswered,'neatsakytas uždavinys','neatsakyti uždaviniai','neatsakytų uždavinių')}. Tikrai baigti?\n\nNeatsakyti = 0 taškų (be baudos – kaip realiame konkurse).`
      : "Tikrai baigti kontrolinį?") + flagLine;
    if(confirm(msg)) finishContest(false);
  });
}

// Answers given after crossing out ≥ 2 other options: {n, ok}. Shows the kid
// that an informed guess (1 of ≤ 3, penalty ¼) is worth taking.
function contestElimination(qs){
  let n = 0, ok = 0;
  for(const q of qs){
    const a = state.contestAnswers[q.num];
    const struck = Object.keys((state.contestStruck || {})[q.num] || {}).filter(l => l !== a);
    if(!a || struck.length < 2) continue;
    n++; if(a === q.correct) ok++;
  }
  return {n, ok};
}

function finishContest(byTimer){
  state._showContestSolutions = false;   // a new paper: solutions fold again until its second attempt
  if(state._contestTimerInterval){ clearInterval(state._contestTimerInterval); state._contestTimerInterval = null; }
  creditContestTime();
  const times = state.contestTimes || {};
  const timeByBand = {3:0, 4:0, 5:0};
  for(const q of state.contestQuestions) timeByBand[q.points || 3] += times[q.num] || 0;
  const qs = state.contestQuestions;
  let points = 0, scoreWithPenalty = 0, correct = 0, answered = 0, maxPoints = 0;
  const byBand = {3:{ok:0,total:0}, 4:{ok:0,total:0}, 5:{ok:0,total:0}};
  // Honesty marker: how many of these 30 the kid had already met in practice.
  const practisedBefore = qs.filter(q => (store.seenQ || {})[`${state.contestYear}-${q.num}`]).length;
  qs.forEach(q => {
    const band = q.points || 3;
    maxPoints += band;
    byBand[band].total++;
    // the whole paper was seen (results show every solution) – mark for freshness
    store.seenQ[`${state.contestYear}-${q.num}`] = Date.now();
    const a = state.contestAnswers[q.num];
    if(!a) return;
    answered++;
    if(a === q.correct){
      correct++;
      points += band;
      scoreWithPenalty += band;
      byBand[band].ok++;
    } else {
      scoreWithPenalty -= band * 0.25;
      noteMistake(state.contestYear, q, false);
    }
  });
  creditContestActivity(qs, state.contestAnswers);
  const result = {
    when: Date.now(),
    year: state.contestYear,
    points, scoreWithPenalty: Math.round(scoreWithPenalty * 4)/4,
    maxPoints, correct, total: qs.length, answered,
    byBand, byTimer: !!byTimer, practisedBefore, timeByBand,
    slowest: Object.entries(times).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, ms]) => ({num: Number(n), ms})),
    queued: queueContestWrongs(state.contestYear, qs, state.contestAnswers),
    answers: Object.fromEntries(qs.map(q => [q.num, state.contestAnswers[q.num] || null])),
    elim: contestElimination(qs),
  };
  store.contests = store.contests || [];
  store.contests.push(result);
  if(store.contests.length > 30) store.contests = store.contests.slice(-30);
  // finished – drop the resume snapshot (grading a paper leaves an unfinished online run alone)
  if(!state._gradingPaper) store.contestInProgress = null;
  saveStore(store);
  checkAchievements();
  // A finished paper ticks the plan's contest step – also when the contest
  // was started from the home card (or resumed after a reload) rather than
  // from the plan, as long as today is a contest day.
  if(state._planStep) markPlanStepDone();
  else if(planStepsForToday().some(s => s.act === "contest" && s.id === "core")) markPlanStepDone("core");
  state._lastContestResult = result;
  state.view = "contestResults";
  renderContestResults();
}

/* A finished paper is the week's biggest effort: it must count as the
   day's activity (streak!) and pay stars like any other answered
   question. Before this, a Saturday paper was followed by a streak reset
   on Sunday because finishContest never touched activity. */
function creditContestActivity(qs, answers){
  const k = todayKey();
  const a = store.activity[k] = store.activity[k] || {answered:0, correct:0};
  let stars = 0;
  for(const q of qs){
    const letter = answers[q.num];
    if(!letter) continue;
    const ok = letter === q.correct;
    a.answered++;
    if(ok) a.correct++;
    const bb = a.byBand = a.byBand || {};
    const slot = bb[q.points || 3] = bb[q.points || 3] || {a:0, ok:0};
    slot.a++; if(ok) slot.ok++;
    stars += starsForAnswer(ok, q.points || 3);
  }
  bumpStreakForToday();
  if(stars) awardStars("fromQ", stars);
  checkAchievements();
}

/* Feed contest mistakes into the spaced-repetition queue (due tomorrow).
   No stars / activity credit – the contest already happened; this only
   schedules the remediation. */
/* A paper's mistakes are the best review material there is, so they go
   into the due queue automatically (a button used to do it – and was
   easy to miss). At most CONTEST_REVIEW_MAX per paper, easier bands
   first (the points a kid should not lose), staggered 3 per day so they
   come back through the warm-ups. Queuing all of them (~12 a paper)
   buried the plan in review days: the simulator's mastery fell 26 → 15. */
const CONTEST_REVIEW_PER_DAY = 3;
const CONTEST_REVIEW_MAX = 3;
function queueContestWrongs(year, qs, answers){
  const wrong = qs.filter(q => answers[q.num] && answers[q.num] !== q.correct && q.mechanic && !store.dueQueue[`${year}-${q.num}`])
    .sort((a, b) => (a.points || 3) - (b.points || 3) || a.num - b.num)
    .slice(0, CONTEST_REVIEW_MAX);
  wrong.forEach((q, i) => {
    store.dueQueue[`${year}-${q.num}`] = {
      year, num: q.num, mech: q.mechanic, band: q.points || 3,
      dueAt: Date.now() + ONE_DAY_MS * (1 + Math.floor(i / CONTEST_REVIEW_PER_DAY)), streak: 0,
      fromContest: true,   // warm-up material: never counts toward a whole review day
    };
  });
  return wrong.length;
}

function renderContestResults(){

  const skipped = qs.filter(q => !state.contestAnswers[q.num]);
  const pct = Math.round(100*r.correct/r.total);
  // solutions wait behind a fold until the second attempt is done (or skipped)
  const retryPending = (() => { const rec = (store.contests || []).find(x => x.when === r.when) || r; return !rec.retry && contestRetryItems(rec).length > 0 && !state._showContestSolutions; })();

  $app.innerHTML = `

      <div class="grid two">
        <div class="stat"><b>${r.correct} / ${r.total}</b><span>Teisingi atsakymai (${pct} %)</span></div>
        <div class="stat"><b>${fmtPts(r.scoreWithPenalty)} / ${r.maxPoints}</b><span>Su −25 % bauda</span></div>
        <div class="stat"><b>${r.points} / ${r.maxPoints}</b><span>Be baudos</span></div>

        ${r.practisedBefore != null ? `<div class="stat" ${r.practisedBefore >= 6 ? 'style="border-color:var(--accent)"' : ''}><b>${r.practisedBefore} / ${r.total}</b><span>matyta treniruotėse anksčiau${r.practisedBefore >= 6 ? ' · dalis jau matyta, tad tikras lygis gali būti žemesnis' : ' · švarus matavimas'}</span></div>` : ''}
      </div>
    </section>

    ${(() => {

      if(rec.retry) return `<section class="card"><h3>🔁 Antras bandymas</h3><p style="margin:0">Be laikrodžio išsprendei ${rec.retry.ok} iš ${rec.retry.n}${rec.retry.pts ? ` – <b>+${rec.retry.pts} t.</b>, prarasti dėl laiko ar skubėjimo` : ''}.</p></section>`;
      const n = contestRetryItems(rec).length;
      return n ? `<section class="card" style="border-color:var(--accent)"><h3>🔁 Antras bandymas – prieš žiūrint sprendimus</h3>
        <p style="margin:0 0 8px">Pabandyk dar kartą ${n} ${pluralForm(n,'uždavinį','uždavinius','uždavinių')}, kuriuos praleidai ar suklydai – be laikrodžio. Sužinosi, kiek taškų nubėgo dėl laiko, o kiek – dėl to, ko dar nemoki. Sprendimai kol kas suskleisti – atsiversi juos po antro bandymo.</p>
        <button class="btn primary small" id="contestRetry">🔁 Spręsti dar kartą</button></section>` : '';
    })()}

    <section class="card">
      <h3>Pagal sudėtingumą</h3>
      ${[3,4,5].map(b=>{
        const x = r.byBand[b];
        if(!x.total) return '';
        const p = Math.round(100*x.ok/x.total);
        return `<div class="cat-row">
          <span>${b} t. (${x.total} užd.)</span>
          <div class="bar"><div style="width:${p}%;background:${p>=70?'var(--good)':p>=40?'var(--accent)':'var(--bad)'}"></div></div>
          <span class="pill ${p>=70?'good':p>=40?'muted':'bad'}">${x.ok}/${x.total}</span>
        </div>`;
      }).join('')}
    </section>

    ${r.timeByBand && (r.timeByBand[3] + r.timeByBand[4] + r.timeByBand[5]) > 60000 ? (() => {
      // budget per band: 3 t. ~1 min, 4 t. ~2,5 min, 5 t. ~3,5 min per question (≈ 70 of 75 min)
      const budget = {3: 1, 4: 2.5, 5: 3.5};
      const n = b => qs.filter(q => (q.points || 3) === b).length;
      const mins = ms => Math.round(ms / 6000) / 10;
      return `<section class="card">

      ${(r.slowest || []).length ? `<p style="margin:8px 0 0">Ilgiausiai užtrukai prie šių uždavinių: ${r.slowest.map(x => `<b>${x.num}</b> (${String(mins(x.ms)).replace('.', ',')} min)`).join(', ')}.${mins(r.timeByBand[3]) > Math.round(budget[3] * n(3)) * 1.25 ? ' 3 t. uždaviniai turi eiti greitai – jiems skirk ne daugiau kaip ~15 min.' : ''}</p>` : ''}
    </section>`; })() : ''}

    ${(() => {
      // strategy notes from the answer pattern (rules, not AI)
      const ans = state.contestAnswers || {};
      const st = {3:{ans:0,ok:0,skip:0}, 4:{ans:0,ok:0,skip:0}, 5:{ans:0,ok:0,skip:0}};
      for(const q of qs){ const b = q.points || 3, a = ans[q.num]; if(!a) st[b].skip++; else { st[b].ans++; if(a === q.correct) st[b].ok++; } }
      const notes = [];
      if(st[3].skip) notes.push(`Praleidai ${st[3].skip} ${pluralForm(st[3].skip,'lengvąjį (3 t.) uždavinį','lengvuosius (3 t.) uždavinius','lengvųjų (3 t.) uždavinių')}. Tokius uždavinius verta išspręsti visus – tai greičiausi taškai.`);
      for(const b of [4, 5]){
        const wrong = st[b].ans - st[b].ok;

/* Backup / restore: the whole store as a JSON download, and back. */
function exportProgress(){
  try {
    const payload = {app:"kengura", version:1, exportedAt:new Date().toISOString(), store};
    const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    // file name carries the child's name when there are several profiles
    const who = (META.profiles.length > 1 ? activeProfileName() : "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
    a.href = url; a.download = `kengura-progresas-${who ? who + "-" : ""}${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    showToast("💾", "Progresas eksportuotas.");
  } catch(e){ alert("Nepavyko eksportuoti: " + e.message); }
}
function importProgressFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const data = JSON.parse(String(reader.result));
      const incoming = data && data.app === "kengura" && data.store ? data.store : data;
      if(!incoming || typeof incoming !== "object" || !incoming.activity || !incoming.settings) throw new Error("ne Kengūros progreso failas");
      const qs = Object.values(incoming.activity).reduce((a, c) => a + (c.answered || 0), 0);
      if(!confirm(`Importuoti progresą (${qs} ${pluralForm(qs,'atsakymas','atsakymai','atsakymų')}, ${(n => `${n} ${pluralForm(n,'įvaldyta gudrybė','įvaldytos gudrybės','įvaldytų gudrybių')}`)(Object.keys(incoming.masteredMech || {}).length)})?\n\nDabartinis progresas šioje naršyklėje bus pakeistas.`)) return;
      localStorage.setItem(LS_KEY, JSON.stringify(incoming));
      _storeFrozen = true;   // only once it is stored: the unload save must not overwrite the import
      location.reload();
    } catch(e){ alert("Nepavyko importuoti: " + e.message); }
  };
  reader.readAsText(file);
}

/* ============================================================
   PARENT VIEW – control + statistics.
   Order: this week → what to do → settings (the controls a parent owns)
   → progress over weeks → papers → details → data.
   ============================================================ */
function activityMinutes(a){ return a ? Math.round((a.sec || 0) / 60) : 0; }
/* One week (0 = this one, 1 = last …) summed up for the parent view. */
function weekSummary(weeksBack){
  const rows = weekActivity(weeksBack);
  const fromTs = rows[0].date.getTime(), toTs = rows[6].date.getTime() + ONE_DAY_MS;
  const s = {rows, fromTs, toTs, active:0, answered:0, correct:0, min:0, stars:0, trainingDays:0, missed:0};
  const now = Date.now();
  for(const r of rows){
    const a = r.a;
    if(a && a.answered){ s.active++; s.answered += a.answered; s.correct += a.correct || 0; }
    s.min += activityMinutes(a);
    s.stars += (a && a.stars) || 0;
    if(r.date.getTime() <= now && isTrainingDay(r.date)){
      s.trainingDays++;
      if(!(a && a.answered) && r.key !== todayKey()) s.missed++;
    }
  }
  s.papers = (store.contests || []).filter(c => c.when >= fromTs && c.when < toTs);
  s.mastered = Object.values(store.masteredMech || {}).filter(t => t >= fromTs && t < toTs).length;
  return s;
}
/* Accuracy by block over the last N days (from activity[day].byBand). */
function bandAccuracyDays(days){
  const out = {3:{a:0, ok:0}, 4:{a:0, ok:0}, 5:{a:0, ok:0}};
  for(let i = 0; i < days; i++){
    const a = store.activity[dateKeyOffset(i)];
    if(!a || !a.byBand) continue;
    for(const b of [3,4,5]){ const s = a.byBand[b]; if(s){ out[b].a += s.a || 0; out[b].ok += s.ok || 0; } }
  }
  return out;
}
/* Up to three rule-based pointers for the parent – what the numbers mean
   and what to do about it. */
function parentAdvice(){
  const tips = [];
  const week = weekSummary(0);
  const days = daysToContest();
  if(!store.plan.contestDate) tips.push({icon:'📅', text:'Įrašykite konkurso datą – tada planas pats parinks etapą ir pasiūlys kontrolinius.', action:'plan', cta:'Nustatyti'});
  if(week.missed >= 2) tips.push({icon:'🛌', text:`Šią savaitę praleistos ${week.missed} treniruočių dienos. Geriau 15 min kasdien negu valanda sekmadienį – arba sumažinkite treniruočių dienų skaičių.`, action:'settings', cta:'Dienos'});
  const worst = weakestMechanics(8).filter(w => w.showAttempts >= 4 && w.rate >= 0.4)[0];
  if(worst) tips.push({icon:'🧩', text:`Silpniausia gudrybė – ${MECHANIC_LABEL[worst.mech] || worst.mech} (${Math.round(100 * worst.rate)} % klaidų). Viena serija su pavyzdžiu dažniausiai ją pataiso.`, action:'playlist', arg:worst.mech, cta:'Atverti seriją'});
  const ca = store.confStats && store.confStats.a;
  if(ca && ca.attempts >= 5 && (ca.attempts - ca.wrong) / ca.attempts < 0.8) tips.push({icon:'🎯', text:`„Tikrai žinau“ pasirodo teisinga tik ${Math.round(100 * (ca.attempts - ca.wrong) / ca.attempts)} % kartų. Konkurse tai brangu (−25 %): paprašykite, kad prieš žymėdamas atsakymą vaikas jį patikrintų atvirkščiu veiksmu.`});
  if(needsSpeedWork()) tips.push({icon:'⚡', text:'3 taškų uždaviniai sprendžiami per lėtai – lengviausi taškai lieka nesurinkti. Planas siūlo sprintus; verta juos daryti su laikrodžiu.', action:'sprint', cta:'Sprintas'});
  const last3 = (store.contests || []).slice(-3).filter(c => c.byBand);
  if(last3.length >= 2){
    let ok = 0, t = 0; for(const c of last3){ ok += (c.byBand[3] || {}).ok || 0; t += (c.byBand[3] || {}).total || 0; }
    if(t && ok / t < 0.7) tips.push({icon:'📝', text:`Kontroliniuose 3 t. blokas – tik ${Math.round(100 * ok / t)} %. Tai lengviausi taškai: konkurse pirmiausia jie, ir tik tada 5 t. uždaviniai.`, action:'contestTab', cta:'Kontroliniai'});
  }
  const repeat = Object.values(store.mistakes || {}).filter(m => !m.fixedAt && (m.times || 0) >= 2).length;
  if(repeat >= 2) tips.push({icon:'📒', text:`${repeat} ${pluralForm(repeat,'uždavinys kartojasi','uždaviniai kartojasi','uždavinių kartojasi')} – ta pati klaida 2+ kartus. Geriausia vieta pasikalbėti: paprašykite vaiko paaiškinti savo sprendimo kelią.`, action:'mistakes', cta:'Sąsiuvinis'});
  const se = store.selfExplain;
  if(se && se.a >= 6 && se.ok / se.a < 0.6) tips.push({icon:'🧠', text:`Po teisingo atsakymo vaikas tik ${Math.round(100 * se.ok / se.a)} % kartų atpažįsta mintį, kuri jį atvedė – dalis atsakymų gali būti atspėti. „Mąstymo treniruotė“ (gudrybių skiltyje) moko skaityti sprendimą ir rasti klaidą.`, action:'think', cta:'Atverti'});
  const lastPaper = (store.contests || []).slice(-1)[0];
  if(store.plan.contestDate && days != null && days > 7 && (!lastPaper || Date.now() - lastPaper.when > 14 * ONE_DAY_MS)) tips.push({icon:'🕒', text: lastPaper ? 'Paskutinis kontrolinis – prieš daugiau nei dvi savaites. Kontrolinis kartą per savaitę parodo tikrą lygį ir moko tempo.' : 'Kontrolinio dar nebuvo – diagnostinis parodys, nuo ko pradėti.', action:'contestTab', cta:'Kontroliniai'});
  if(!tips.length) tips.push({icon:'✅', text:'Viskas vyksta pagal planą: treniruotės reguliarios, aiškių silpnų vietų nėra. Palaikykite ritmą: kartą per savaitę paprašykite vaiko papasakoti, kaip išsprendė jam patikusį uždavinį, ir pagirkite už būdą, ne už gabumus.'});
  return tips.slice(0, 3);
}

/* Plain-text week summary for a message to the other parent or a teacher. */
function parentSummaryText(){
  const w = weekSummary(0);
  const fmt = d => `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const total = trackMechanics().length, mastered = Object.keys(store.masteredMech || {}).length;

  const lines = [
    `Kengūra${activeProfileName() ? ` – ${activeProfileName()}` : ''} · savaitė ${fmt(w.rows[0].date)} – ${fmt(w.rows[6].date)}`,
    `Treniruočių dienos: ${w.active}/${w.trainingDays || 7}${w.missed ? ` (praleista ${w.missed})` : ''} · uždaviniai: ${w.answered}${w.answered ? ` (${Math.round(100 * w.correct / w.answered)} % teisingai)` : ''}${w.min ? ` · aktyvus laikas: ${w.min} min` : ''} · ⭐ ${w.stars}${store.plan.weeklyStarGoal ? `/${store.plan.weeklyStarGoal}` : ''}`,
    `Įvaldyta gudrybių: ${mastered}/${total}${w.mastered ? ` (+${w.mastered} šią savaitę)` : ''} · serija: ${liveStreak()} d.`,
  ];
  if(w.papers.length) lines.push(`Kontroliniai: ${w.papers.map(c => `${c.year} m. – ${fmtPts(c.scoreWithPenalty ?? c.points)}/${c.maxPoints}`).join(', ')}`);
  if(worst.length) lines.push(`Silpniausia: ${worst.map(x => `${MECHANIC_LABEL[x.mech] || x.mech} (${Math.round(100 * x.rate)} % klaidų)`).join(', ')}`);
  const d = daysToContest();
  if(d != null && d >= 0) lines.push(`Iki konkurso: ${d} d. (${PLAN_PHASE[planPhase()].label})`);
  lines.push(`Ką verta daryti: ${parentAdvice().map(t => t.text).join(' ')}`);
  return lines.join("\n");
}

function renderParent(){
  const totalMechs = trackMechanics().length;   // mechanics actually on the track, not all 30
  const masteredCount = Object.keys(store.masteredMech || {}).length;
  const partialCount = Object.keys(store.masteredBand || {}).filter(m => !store.masteredMech[m]).length;
  const days = daysToContest();
  const wd = (store.plan.contestWeekday != null) ? store.plan.contestWeekday : 6;
  const week = weekSummary(0);
  const weeks = [0,1,2,3].map(weekSummary);
  const anyMinutes = weeks.some(w => w.min > 0);
  const band30 = bandAccuracyDays(30);
  const band30Any = [3,4,5].some(b => band30[b].a > 0);
  // 14-day streak grid
  const grid = [];
  for(let i = 13; i >= 0; i--){
    const k = dateKeyOffset(i);
    const a = store.activity[k];
    let lvl = 0;
    if(a){ if(a.answered >= 20) lvl = 3; else if(a.answered >= 10) lvl = 2; else if(a.answered >= 1) lvl = 1; }
    const [, m, da] = k.split("-");
    grid.push({label: `${da}.${m}`, lvl, count: a ? a.answered : 0, min: activityMinutes(a)});
  }
  // Worst 3 mechanics (≥ 4 samples before calling it weak)
  const worst = weakestMechanics(8).filter(w => w.showAttempts >= 4).slice(0, 3);
  // Last generated test
  const last = store.sessions[store.sessions.length-1];
  let lastBreak = '';
  if(last && last.questions){
    const breakdown = {};
