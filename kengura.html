/* -------- Treniruočių planas: contest countdown + daily session ------- */
function daysToContest(){
  const d = store.plan && store.plan.contestDate;
  if(!d) return null;
  const [y,m,da] = d.split('-').map(Number);
  if(!y || !m || !da) return null;
  const target = Date.UTC(y, m-1, da);
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / ONE_DAY_MS);
}

/* ---------- Macro-cycle: three phases keyed to the contest date ----------
   foundation  > 60 days out  – 3-pt speed + the first (easy) mechanics,
                                alternating sprint / new mechanic days.
   build       11–60 days     – one new 4/5-pt mechanic per day, weekly
                                contest sim, due-queue review first.
   taper       ≤ 10 days      – NO new mechanics. Due review (confident-
                                wrong first), mixed sets, two contest sims,
                                rest the day before.
   No contest date → build (the general-purpose behaviour).            */
const PLAN_PHASE = {
  foundation: {label:"Pamatai",  cls:"phase-foundation", icon:"🧱",
    blurb:"Iki konkurso dar toli: laviname greitį 3 t. bloke ir pirmąsias gudrybes. Sprintai – kol 3 t. uždaviniai dar lėti, kitomis dienomis – nauja gudrybė."},
  build:      {label:"Gudrybės", cls:"phase-build", icon:"🧩",
    blurb:"Pagrindinis etapas: kasdien viena nauja 4–5 t. gudrybė, apšilime – pakartojimai, kartą per savaitę – kontrolinis kaip tikrame konkurse."},
  taper:      {label:"Finišas",  cls:"phase-taper", icon:"🏁",
    blurb:"Paskutinės dienos: naujų gudrybių nebemokomės. Kartojame tai, kur klydai, sprendžiame mišrius rinkinius be etikečių ir dar du kontrolinius. Dieną prieš – poilsis."},
};
/* Taper length scales with the run: 12 % of the days from plan start to
   the contest, clamped to 4–10. A 30-day run tapers 4 days, not 10. */
function planStartDate(){
  if(store.plan && store.plan.startDate) return store.plan.startDate;
  const keys = Object.keys(store.activity || {}).sort();
  return keys[0] || todayKey();
}
function planTaperDays(){
  const d = store.plan && store.plan.contestDate;
  if(!d) return 10;
  const [y,m,da] = d.split('-').map(Number);
  const [sy,sm,sd] = planStartDate().split('-').map(Number);
  const total = Math.round((Date.UTC(y, m-1, da) - Date.UTC(sy, sm-1, sd)) / ONE_DAY_MS);
  if(!(total > 0)) return 10;
  return Math.max(4, Math.min(10, Math.round(total * 0.12)));
}
function isTrainingDay(dateObj){
  const d = dateObj || new Date();
  const td = (store.plan && Array.isArray(store.plan.trainingDays) && store.plan.trainingDays.length >= 2) ? store.plan.trainingDays : [0,1,2,3,4,5,6];
  return td.includes(d.getDay());
}
function planPhase(){
  const d = daysToContest();
  if(d == null || d < 0) return "build";
  if(d <= planTaperDays()) return "taper";
  if(d > 60) return "foundation";
  return "build";
}
/* Is `dateObj` a contest-sim day? Weekly on store.plan.contestWeekday
   (every second week in the foundation phase – a 75-min paper weekly is
   too heavy that far out); in the taper also three days before the
   contest (unless that is the eve). */
function isContestDay(dateObj){
  const d = dateObj || new Date();
  const wd = (store.plan && store.plan.contestWeekday != null) ? store.plan.contestWeekday : 6;
  const days = daysToContest();
  if(days != null && days < 0) return false;   // the contest is over – no more papers until a new date is set
  if(!isTrainingDay(d)) return false;          // papers only on training days
  if(store.plan && store.plan.contestPostponedDay === dateKeyOf(d)) return false;   // "Ne dabar" on the intro screen
  let left = null;
  if(days != null && days >= 0){
    const diff = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / ONE_DAY_MS);
    left = days - diff;                // days left as of `d`
    if(left <= 1) return false;        // eve + contest day: rest
    if(left === 3) return true;        // taper: final dress rehearsal
    if(left === 2){                    // rehearsal missed yesterday → today, unless a paper was just played
      const lp = Math.max(0, ...(store.contests || []).map(c => c.when || 0));
      return !lp || (d.getTime() - lp) >= 4 * ONE_DAY_MS;
    }
  }
  // Never two papers close together: the weekly slot yields within 2 days
  // of the T-3 rehearsal and within 5 days of any paper already played.
  if(left != null && left <= 5 && left !== 3) return false;
  // Adaptive cadence: a paper is due every `period` days (14 in the
  // foundation, 7 otherwise). The preferred weekday takes it once ≥ 5
  // days have passed; if that weekday was missed (a kid who never trains
  // on Saturdays), the first day the paper is overdue by one takes it.
  const period = (left != null && left > 60) ? 14 : 7;
  const lastPlayed = Math.max(0, ...(store.contests || []).map(c => c.when || 0));
  if(!lastPlayed) return d.getDay() === wd;
  const lp = new Date(lastPlayed);
  const daysSince = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(lp.getFullYear(), lp.getMonth(), lp.getDate())) / ONE_DAY_MS);
  if(daysSince < 5) return false;
  if(d.getDay() === wd) return daysSince >= period - 2;
  return daysSince >= period + 1;
}
/* A diagnostic paper opens the course: contest date set, nothing played
   yet, and not already the eve/contest day. */
/* …or the last paper is older than 60 days – a returning kid (last
   season's save) needs a fresh baseline for this season. */
const DIAGNOSTIC_STALE_DAYS = 60;
function needsDiagnosticContest(){
  const days = daysToContest();
  if(days == null || days <= 1 || !pickContestYear()) return false;
  if(store.plan && store.plan.contestPostponedDay === todayKey()) return false;
  const last = Math.max(0, ...(store.contests || []).map(c => c.when || 0));
  return !last || (Date.now() - last) > DIAGNOSTIC_STALE_DAYS * ONE_DAY_MS;
}
function contestEligibleYears(){
  return ARCHIVE.filter(t =>
    t.year !== '2006' && t.questions.length >= 28 && t.questions.every(q => q.correct)
  ).map(t => t.year);
}
/* Pick the next contest paper. Unplayed years first; the held-out
   (reserved) years are saved for the taper so the last rehearsals are the
   cleanest measure. Among candidates prefer the paper whose questions the
   kid has seen least in practice. */
function pickContestYear(){
  const years = contestEligibleYears();
  if(!years.length) return null;
  const played = {};
  for(const c of (store.contests || [])) played[String(c.year)] = Math.max(played[String(c.year)] || 0, c.when || 0);
  const reserved = new Set(reservedYears().map(String));
  let fresh = years.filter(y => !played[String(y)]);
  const unreservedFresh = fresh.filter(y => !reserved.has(String(y)));
  if(planPhase() !== "taper" && unreservedFresh.length) fresh = unreservedFresh;
  if(fresh.length){
    const seenCount = y => {
      const t = ARCHIVE.find(x => String(x.year) === String(y));
      return t ? t.questions.filter(q => (store.seenQ || {})[`${t.year}-${q.num}`]).length : 0;
    };
    // Least-practised papers first (in steps of 3 questions, so one stray
    // practice question doesn't decide), then the NEWEST: today's contest
    // looks like the 2013+ papers, not like 2000. Deterministic, so the plan
    // label, the intro screen and the paper that opens agree.
    const scored = fresh.map(y => ({y, n: Math.floor(seenCount(y) / 3)}));
    scored.sort((a,b) => a.n - b.n || Number(b.y) - Number(a.y));
    return scored[0].y;
  }
  years.sort((a,b) => (played[String(a)] || 0) - (played[String(b)] || 0));
  return years[0];
}

/* Today's 20–30-minute session: warm-up → core → cool-down, shaped by phase. */
function planStepsForToday(){
  const due = dueNow();
  const phase = planPhase();
  const days = daysToContest();
  const today = new Date();
  const dayParity = localDayNum() % 2;   // flips at local midnight

  // Rest day by the family's schedule: no steps (the eve and the contest
  // day keep their own shape below).
  if(!isTrainingDay(today) && days !== 0 && days !== 1) return [];

  // Contest day and the final two days have their own shape.
  if(days === 0){
    return [{id:"core", label:"Šiandien konkursas. Sėkmės 🦘 Pusryčiai, du pieštukai, laikrodis. Pradėk nuo 3 t. uždavinių; abejotinus praleisk ir grįžk prie jų vėliau.", act:"none"}];
  }
  if(days === 1){
    return [
      {id:"warmup",   label:"Apšilimas – 2 lengvi uždaviniai (tik tiek!)", act:"warmup"},
      {id:"core",     label:"Perskaityk konkurso strategiją (pradžios puslapyje, kortelėje „Kontrolinis“)", act:"strategy"},
      {id:"cooldown", label:"Poilsis ir ankstyvas miegas. Rytoj – konkursas.", act:"none"},
    ];
  }
  if(needsDiagnosticContest()){
    const yr = pickContestYear();
    return [
      {id:"warmup",   label:"Apšilimas – 2 lengvi uždaviniai", act:"warmup"},
      {id:"core",     label:`Diagnostinis kontrolinis – ${yr} m. (30 užd., 75 min)`, act:"contest", arg:yr},
      {id:"cooldown", label:"Po kontrolinio: 🔁 antras bandymas ir klaidų peržiūra rezultatų puslapyje", act:"none"},
    ];
  }
  if(isContestDay(today)){
    const yr = pickContestYear();
    return [
      {id:"warmup",   label:"Apšilimas – 2 lengvi uždaviniai", act:"warmup"},
      {id:"core",     label:`Kontrolinis${yr ? ` – ${yr} m.` : ''} (30 užd., 75 min)`, act:"contest", arg:yr},
      {id:"cooldown", label:"Po kontrolinio: 🔁 antras bandymas ir klaidų peržiūra rezultatų puslapyje", act:"none"},
    ];
  }

  const target = phase === "taper" ? null : nextMechanicTarget();
  const mechStep = t => {
    const prev = masteredBandOf(t.mech);
    const top = mechTopBand(t.mech);
    const tag = t.band < top ? ` (${t.band} t. lygiu)` : (prev ? ` – dabar ${t.band} t.` : '');
    const tried = Object.values(((store.mechAttempts || {})[t.mech]) || {}).some(f => f.lastAt);
    const verb = prev ? 'Kilti' : tried ? 'Dar kartą' : 'Nauja gudrybė';
    return {id:"core", label:`${verb}: ${MECHANIC_LABEL[t.mech] || t.mech}${tag}`, act:"playlist", arg:t.mech, band:t.band};
  };
  // Spaced repetition lives in the WARM-UP (≤ 3 items). Only a real
  // backlog takes the core: 10+ due (5+ in the taper, where mistakes are
  // the whole point).
  const DUE_CORE_MIN = phase === "taper" ? 5 : 10;
  const backlog = phase === "taper" ? due.length : due.filter(d => !d.fromContest).length;
  let core;
  // outside the taper a review day takes at most every other day, so a kid
  // who makes many mistakes still meets new tricks (the warm-up keeps
  // reviewing 3 a day regardless)
  if(backlog >= DUE_CORE_MIN && (phase === "taper" || dayParity === 0 || backlog >= 2 * DUE_CORE_MIN)){
    core = {id:"core", label:`Pakartojimas – kur klydai (${Math.min(due.length,10)} užd.)`, act:"due"};
  } else if(phase === "taper"){
    const stale = staleMechanicToRecheck();
    core = stale
      ? {id:"core", label:`Ar dar pameni? ${MECHANIC_LABEL[stale] || stale} (2 užd.)`, act:"playlist", arg:stale}
      : dayParity === 0
      ? {id:"core", label:"Mišrus rinkinys (6 užd., gudrybė paslėpta)", act:"mixed"}
      : {id:"core", label:"Greičio sprintas – 10 × 3 t. per 10 min", act:"sprint"};
  } else if(phase === "foundation"){
    // Sprints only while the data says speed is a problem (or until two
    // sprints exist to measure it); then every day goes to a new mechanic.
    const sprintsDone = (store.sessions || []).filter(s => s.sprint).length;
    const wantSprint = sprintsDone < 2 || needsSpeedWork();
    if(wantSprint && (dayParity === 0 || !target)){
      core = {id:"core", label:"Greičio sprintas – 10 × 3 t. per 10 min", act:"sprint"};
    } else if(target){
      core = mechStep(target);
    } else if(staleMechanicToRecheck()){
      const stale = staleMechanicToRecheck();
      core = {id:"core", label:`Ar dar pameni? ${MECHANIC_LABEL[stale] || stale} (2 užd.)`, act:"playlist", arg:stale};
    } else {
      core = {id:"core", label:"Mišrus rinkinys (6 užd., gudrybė paslėpta)", act:"mixed"};
    }
  } else {
    if(needsSpeedWork()){
      core = {id:"core", label:"Greičio sprintas – 10 × 3 t. per 10 min", act:"sprint"};
    } else if(target){
      core = mechStep(target);
    } else if(staleMechanicToRecheck()){
      const stale = staleMechanicToRecheck();
      core = {id:"core", label:`Ar dar pameni? ${MECHANIC_LABEL[stale] || stale} (2 užd.)`, act:"playlist", arg:stale};
    } else {
      core = {id:"core", label:"Mišrus rinkinys (6 užd., gudrybė paslėpta)", act:"mixed"};
    }
  }
  const warm = due.length && core.act !== "due"
    ? {id:"warmup", label:`Apšilimas – pakartok ${Math.min(due.length, 3)} ${due.length === 1 ? 'uždavinį, kuriame klydai' : 'uždavinius, kuriuose klydai'}`, act:"dueWarm"}
    : {id:"warmup", label:"Apšilimas – 2 lengvi uždaviniai", act:"warmup"};
  return [
    warm,
    core,
    {id:"cooldown", label:"Pabaiga – atpažink gudrybę (10 greitų uždavinių)", act:"recog"},
  ];
}

/* Honest time budget per step, in minutes – a playlist day is ~25–30
   min, not 20; the card should say so. */
const PLAN_STEP_MIN = {warmup:3, dueWarm:4, due:10, sprint:10, playlist:20, mixed:10, recog:5, contest:75, strategy:5, none:0};
function planMinutes(steps){
  return (steps || planStepsForToday()).reduce((s, st) => s + (PLAN_STEP_MIN[st.act] || 0), 0);
}

/* Plan-step completion. Finishing all three steps of a day pays the daily
   bonus once: +10 ⭐, one free race ticket, confetti. */
const PLAN_DAY_BONUS = 10;
function markPlanStepDone(stepOverride){
  const step = stepOverride || state._planStep;
  if(!step) return;
  state._planStep = null;
  const k = todayKey();
  const d = store.planDone[k] = store.planDone[k] || {};
  d[step] = true;
  const steps = planStepsForToday();
  const allDone = steps.length > 0 && steps.every(s => d[s.id] || s.act === "none");
  if(allDone && !d.bonus){
    d.bonus = true;
    for(const s of steps) if(s.act === "none") d[s.id] = true;   // the tab dot and "x/y" count read the ticks
    store.games.freeRaces = (store.games.freeRaces || 0) + 1;
    awardStars("fromBonus", PLAN_DAY_BONUS);
    Fx.floatStars(PLAN_DAY_BONUS);
    Fx.celebrate("plan");
    showToast("📅", `Dienos treniruotė atlikta. <b>+${PLAN_DAY_BONUS} ⭐</b> ir žaidimų bilietas 🎟`, 5500);
  }
  saveStore(store);
  checkAchievements();
}
/* "none" steps (rest / read) are ticked by hand from the plan view. */
// The international Kangaroo day is the third Thursday of March; the next
// one at least 3 weeks away (a closer date leaves no room for a plan).
function suggestedContestDate(now){
  now = now || new Date();
  for(let y = now.getFullYear(); ; y++){
    const d = new Date(y, 2, 1);
    d.setDate(1 + ((4 - d.getDay() + 7) % 7) + 14);   // first Thursday + 2 weeks
    if(d - now > 21 * ONE_DAY_MS) return dateKeyOf(d);
  }
}

// Tap a question picture to see it at full resolution (small text on a
// 360 px phone); the picture can be panned, a tap or Esc closes it.
/* ✏️ Piešti: a transparent canvas over the figure – circle, count, connect,
   as on the paper. Strokes are kept per picture for the session
   (state.sketches) and an open pad comes back after a re-render (picking an
   option redraws the card). */
function wireSketch(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  state.sketches = state.sketches || {};
  state.sketchOpen = state.sketchOpen || new Set();
  const figOf = btn => { const tools = btn.closest(".fig-tools"); const fig = tools && tools.previousElementSibling; return fig && fig.classList.contains("figure") ? fig : null; };
  const open = btn => {
    const fig = figOf(btn), img = fig && fig.querySelector("img"), src = btn.dataset.draw;
    if(!img || fig.querySelector("canvas.sketch")) return;
    const go = () => {
      const r = img.getBoundingClientRect(), fr = fig.getBoundingClientRect();
      if(!r.width) return;
      fig.style.position = "relative";
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const c = document.createElement("canvas");
      c.className = "sketch";
      c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
      c.style.left = (r.left - fr.left) + "px"; c.style.top = (r.top - fr.top) + "px";
      c.style.width = r.width + "px"; c.style.height = r.height + "px";
      c.setAttribute("aria-label", "Piešimo lapas ant paveikslėlio");
      fig.appendChild(c);
      const ctx = c.getContext("2d");
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 3 * dpr; ctx.strokeStyle = "#b83a12";
      if(state.sketches[src]){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, c.width, c.height); im.src = state.sketches[src]; }
      let down = false;
      const pt = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * dpr, (e.clientY - b.top) * dpr]; };
      c.addEventListener("pointerdown", e => { down = true; try { c.setPointerCapture(e.pointerId); } catch(_){} const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y); ctx.stroke(); e.preventDefault(); });
      c.addEventListener("pointermove", e => { if(!down) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
      const up = () => { if(!down) return; down = false; try { state.sketches[src] = c.toDataURL(); } catch(_){} };
      c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
      btn.textContent = "✓ Baigti piešti"; btn.setAttribute("aria-pressed", "true");
      if(!btn.parentElement.querySelector("[data-draw-clear]")){
        const clr = document.createElement("button");
        clr.type = "button"; clr.className = "btn small ghost"; clr.dataset.drawClear = src; clr.textContent = "🧽 Ištrinti";
        btn.after(clr);
      }
    };
    if(img.complete && img.naturalWidth) go(); else img.addEventListener("load", go, {once: true});
  };
  const close = btn => {
    const fig = figOf(btn); const c = fig && fig.querySelector("canvas.sketch");
    if(c) c.remove();
    const clr = btn.parentElement.querySelector("[data-draw-clear]"); if(clr) clr.remove();
    btn.textContent = state.sketches[btn.dataset.draw] ? "✏️ Tavo piešinys" : "✏️ Piešti"; btn.setAttribute("aria-pressed", "false");
  };
  document.addEventListener("click", e => {
    const clr = e.target.closest && e.target.closest("[data-draw-clear]");
    if(clr){ delete state.sketches[clr.dataset.drawClear]; const c = clr.closest(".fig-tools").previousElementSibling.querySelector("canvas.sketch"); if(c) c.getContext("2d").clearRect(0, 0, c.width, c.height); return; }
    const b = e.target.closest && e.target.closest("[data-draw]");
    if(!b) return;
    const src = b.dataset.draw;
    if(state.sketchOpen.has(src)){ state.sketchOpen.delete(src); close(b); } else { state.sketchOpen.add(src); open(b); }
  });
  // re-renders replace the card: bring open pads back (and label saved ones)
  if(typeof MutationObserver === "function"){
    let queued = false;
    new MutationObserver(() => {
      if(queued) return; queued = true;
      setTimeout(() => { queued = false;
        document.querySelectorAll("[data-draw]").forEach(b => {
          if(state.sketchOpen.has(b.dataset.draw)){ if(!figOf(b) || !figOf(b).querySelector("canvas.sketch")) open(b); }
          else if(state.sketches[b.dataset.draw] && b.textContent === "✏️ Piešti") b.textContent = "✏️ Tavo piešinys";
        });
      }, 30);
    }).observe(document.getElementById("app") || document.body, {childList: true, subtree: true});
  }
}
function wireFigureZoom(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  document.addEventListener("click", e => {
    const img = e.target && e.target.closest && e.target.closest(".figure img");
    if(!img || document.querySelector(".fig-zoom")) return;
    const box = document.createElement("div");
    box.className = "fig-zoom";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-label", "Padidintas paveikslėlis");
    box.setAttribute("aria-modal", "true");
    box.innerHTML = `<button class="fig-zoom-close" aria-label="Uždaryti">✕</button><img src="${img.getAttribute("src")}" alt="${escapeHTML(img.alt || '')}">`;   // natural size (the PNGs are 2,7× the page)
    const close = () => { box.remove(); document.removeEventListener("keydown", onKey); try { img.focus({preventScroll: true}); } catch(_){} };
    const onKey = ev => { if(ev.key === "Escape") close(); };
    box.addEventListener("click", ev => { if(!ev.target.closest("img") || ev.target.closest(".fig-zoom-close")) close(); });
    const big = box.querySelector("img");
    // about twice the size it had on the page, never past its own pixels
    const fit = () => { if(big.naturalWidth) big.style.width = Math.round(Math.min(big.naturalWidth, Math.max(window.innerWidth * 1.6, (img.clientWidth || 0) * 2))) + "px"; };
    if(big.complete) fit(); else big.addEventListener("load", fit);
    big.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(box);
    try { box.querySelector(".fig-zoom-close").focus(); } catch(_){}
  });
  wireSketch();
  // Enter / Space on a focused picture opens it, like a tap
  document.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const img = e.target && e.target.closest && e.target.closest(".figure img");
    if(!img) return;
    e.preventDefault();
    img.click();
  });
  // a badge tap says how it is earned (phones have no hover)
  document.addEventListener("click", e => {
    const b = e.target && e.target.closest && e.target.closest("[data-badge]");
    if(!b) return;
    const a = (typeof ACHIEVEMENTS !== "undefined" ? ACHIEVEMENTS : []).find(x => x.id === b.dataset.badge);
    if(!a) return;
    const on = !!(store.achievements || {})[a.id];
    showToast(a.icon, `<b>${escapeHTML(a.title)}</b> – ${escapeHTML(a.desc)}${on ? '' : ' <span style="opacity:.8">(dar neuždirbta)</span>'}`, 4500);
  });
}

function markPlanStepDoneManual(id){

  if(d[id]) return;

/* After any plan step the end screen offers the NEXT step of today's plan
   as its main button, so the kid never has to find the way back through
   home – and never falls into an unplanned free test by accident. */
function nextPlanStep(skipId){
  const pd = store.planDone[todayKey()] || {};
  return planStepsForToday().find(st => !pd[st.id] && st.id !== skipId && st.act !== 'none') || null;
}
function planNextButtonHTML(skipId, cls){
  const n = nextPlanStep(skipId);
  return n ? `<button class="btn ${cls || 'primary'}" id="planNextBtn">Toliau pagal planą: ${escapeHTML(n.label)} →</button>` : '';
}
/* Plan finished today and a game ticket is waiting → the end screen's
   main button is the reward itself, not a trip through home. */
function planRewardButtonHTML(){
  const pd = store.planDone[todayKey()] || {};
  return pd.bonus && (store.games.freeRaces || 0) > 0
    ? `<button class="btn primary" id="planRewardBtn">🎟 Žaisti už bilietą →</button>` : '';
}
function wirePlanNext(before){
  const r = document.getElementById("planRewardBtn");
  if(r) r.addEventListener("click", openFreeRace);
  const b = document.getElementById("planNextBtn");
  if(!b) return;
  b.addEventListener("click", ()=>{
    if(before) before();
    const n = nextPlanStep();
    if(n) launchPlanStep(n); else { state.view = "home"; renderHome(); }
  });
}

function launchPlanStep(s){
  state._planStep = s.id;
  if(s.act === "warmup"){
    state.questions = generateQuiz(2, [3]);
    state.current = 0; state.answers = []; state.hintsUsedThis = 0;
    state._chosen = null; state._hintShown = false; state._firstStepShown = false;
    state._confidence = null;
    state._questionStartedAt = Date.now();
    state._sprintMode = false;
    state.view = "quiz";
    stopTimer();
    renderQuiz();
  } else if(s.act === "due"){ openDueQueue(); }
  else if(s.act === "dueWarm"){ openDueQueue(3); }
  else if(s.act === "sprint"){
    // alternate: generated arithmetic sprint / real 3-pointers from past papers
    if(localDayNum() % 4 >= 2) openArchiveSprint(); else startSprint();
  }
  else if(s.act === "playlist"){ openPlaylist(s.arg, s.band || undefined); }
  else if(s.act === "mixed"){ openMixedSet(6); }
  else if(s.act === "recog"){ openRecogDrill(); }
  else if(s.act === "contest"){
    const yr = s.arg || pickContestYear();
    if(yr) requestOpenContest(yr);
    else { state._planStep = null; state.view = "home"; renderHome(); }
  }
  else if(s.act === "strategy"){
    // Reading step: tick it and jump to the strategy explainer on home.
    markPlanStepDone();
    state.view = "home"; state.homeTab = "tests"; renderHome();
    try { const d = document.getElementById("contestStrategy"); if(d){ d.open = true; d.scrollIntoView({behavior:smoothScroll()}); } } catch(_){}
  }
  else if(s.act === "none"){ markPlanStepDone(); renderPlan(); }
}

function openPlan(){ state.view = "plan"; renderPlan(); }
/* Contest date change – shared by the plan view and the parent view. */
function applyContestDate(value){
  const hadDate = !!store.plan.contestDate;
  if((value || null) !== store.plan.contestDate){ store.plan.lastActualScore = store.plan.actualScore ?? store.plan.lastActualScore; delete store.plan.actualScore; }   // a new season
  store.plan.contestDate = value || null;
  if(store.plan.contestDate && !store.plan.startDate) store.plan.startDate = todayKey();   // anchors the taper length + timeline
  // Prep mode: the two contest-critical habits go on when a date is first
  // set – calibration ("Tikrai žinau?") and the real −25 % penalty. Both
  // stay user-toggleable on the home settings row.
  if(store.plan.contestDate && !hadDate){
    store.settings.askConfidence = true;
    store.settings.negativeScore = true;
    showToast("🎯", "Įjungta: pasitikėjimo klausimas ir −25 % už klaidą (kaip konkurse). Išjungti gali pradžios puslapyje.", 6000);
  }
  saveStore(store);
}

const WEEKDAY_SHORT = ["Sk","Pr","An","Tr","Kt","Pn","Št"];   // getDay() order
const WEEKDAY_LONG  = ["Sekmadienis","Pirmadienis","Antradienis","Trečiadienis","Ketvirtadienis","Penktadienis","Šeštadienis"];

/* 7-day strip for the plan view: Monday→Sunday of the current week, each
   day marked done / today / contest-day. */
function weekStripHTML(){
  const rows = weekActivity(0);
  const tk = todayKey();
  return `<div class="week-strip">${rows.map(r => {
    const pd = store.planDone[r.key] || {};
    const full = !!pd.bonus || (pd.warmup && pd.core && pd.cooldown);
    const contest = isContestDay(r.date);
    const off = !isTrainingDay(r.date);
    const isToday = r.key === tk;
    const cls = ["week-day", isToday ? "today" : "", full ? "done" : "", contest ? "contest" : "", off ? "off" : ""].join(" ");
    const ic = full ? "✅" : contest ? "📝" : (r.a && r.a.answered ? "🟠" : off ? "🛌" : (r.key < tk ? "·" : "○"));
    return `<div class="${cls}" title="${WEEKDAY_LONG[r.date.getDay()]}${contest ? ' – kontrolinio diena' : ''}">
      <div class="wd">${WEEKDAY_SHORT[r.date.getDay()]}</div>
      <div class="ic">${ic}</div>
      <div>${r.a && r.a.stars ? `${r.a.stars}⭐` : ''}</div>
    </div>`;
  }).join('')}</div>`;
}

/* Whole-arc timeline for the parent: start → contest, split into the three
   phases, with a "today" marker. Start = the earlier of the first activity
   day and today, never more than 90 days before the contest. */
function planTimelineHTML(){
  const days = daysToContest();
  if(days == null || days < 0) return '';
  const [y,m,da] = store.plan.contestDate.split('-').map(Number);
  const contest = new Date(y, m-1, da);
  const today = new Date(); today.setHours(0,0,0,0);
  const actKeys = Object.keys(store.activity || {}).sort();
  let start = new Date(today);
  if(actKeys.length){
    const [ay,am,ad] = actKeys[0].split('-').map(Number);
    const first = new Date(ay, am-1, ad);
    if(first < start) start = first;
  }
  const minStart = new Date(contest); minStart.setDate(minStart.getDate() - 90);
  if(start < minStart) start = minStart;
  if(!(contest - start > 0)) return '';   // contest is today (or the dates are inverted): nothing to draw
  const total = Math.max(1, Math.round((contest - start) / ONE_DAY_MS));
  const dayAt = n => { const d = new Date(contest); d.setDate(d.getDate() - n); return d; };
  const segs = [
    {key:"foundation", from:start, to:dayAt(60)},
    {key:"build",      from:dayAt(60), to:dayAt(planTaperDays())},
    {key:"taper",      from:dayAt(planTaperDays()), to:contest},
  ].map(s => ({...s, from: s.from < start ? start : s.from}))
   .filter(s => s.to > s.from);
  const pct = d => Math.max(0, Math.min(100, 100 * (d - start) / (contest - start)));
  const fmt = d => `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const bars = segs.map(s => {
    const w = pct(s.to) - pct(s.from);
    const weeks = Math.max(1, Math.round((s.to - s.from) / (7 * ONE_DAY_MS)));
    const ph = PLAN_PHASE[s.key];
    return `<div class="tl-seg ${ph.cls}" style="width:${w}%" title="${ph.label}: ${fmt(s.from)} – ${fmt(s.to)}">${w >= 14 ? `${ph.icon} ${ph.label} · ${weeks} sav.` : ph.icon}</div>`;
  }).join('');
  return `
    <div class="tl" aria-label="Pasiruošimo laiko juosta">
      <div class="tl-bars">${bars}</div>
      <div class="tl-today" style="left:${pct(today)}%" title="Šiandien"></div>
      <div class="tl-labels"><span>${fmt(start)}</span><span>šiandien · liko ${days} d. (${Math.ceil(days/7)} sav.)</span><span>🏁 ${fmt(contest)}</span></div>
    </div>`;
}

/* Evaluate all achievements; record + toast any newly earned. Safe to call
   liberally (after answers, time ticks, game over). */
function checkAchievements(){
  const newly = [];
  for(const a of ACHIEVEMENTS){
    if(store.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.check(); } catch(_){ ok = false; }
    if(ok){
      store.achievements[a.id] = Date.now();
      newly.push(a);
    }
  }
  if(newly.length){
    saveStore(store);
    showAchievementToast(newly);
  }
  return newly;
}

function showAchievementToast(list){
  Sfx.play("badge");
  // After an app update the retroactive check can earn many badges at
  // once (legacy saves) – one summary toast instead of a stack of ten.
  if(list.length > 3){

  list.forEach((a, i) => {
    setTimeout(()=> showToast(a.icon, `Pasiekimas: <b>${escapeHTML(a.title)}</b>`), i * 150);

}

/* After the contest date: ask how it went (the real score next to the
   practice papers) and invite to set next year's date. Shown for 60 days. */
/* One 3-point question on a trick the kid met today, unseen by the kid,
   stable for the day – the parent asks for the explanation, not the answer. */
function parentAskToday(){
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const mechs = new Set();
  for(const [k, ts] of Object.entries(store.seenQ || {})){
    if(ts < dayStart.getTime()) continue;
    const [y, n] = k.split('-');
    const t = ARCHIVE.find(t => String(t.year) === y);
    const q = t && t.questions.find(q => q.num === Number(n));
    if(q && q.mechanic && MECHANIC_LABEL[q.mechanic]) mechs.add(q.mechanic);
  }
  if(!mechs.size) return null;
  const reserved = new Set(reservedYears().map(String));
  const pool = [];
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year)) || OUT_OF_SCOPE_YEARS.has(String(t.year))) continue;
    for(const q of t.questions) if((q.points || 3) <= 4 && mechs.has(q.mechanic) && q.correct && q.solutionKid && !isRecentlySeen(t.year, q.num)) pool.push({year: t.year, q});
  }
  pool.sort((a, b) => (a.q.points - b.q.points) || (String(a.year) + a.q.num).localeCompare(String(b.year) + b.q.num));
  const easy = pool.filter(x => x.q.points === 3);
  const from = easy.length ? easy : pool;
  return from.length ? from[keyHash(todayKey()) % from.length] : null;
}
function parentAskTodayHTML(){
  const x = parentAskToday();

  return `<section class="card">

      <p style="margin:0 0 8px;font-size:14px">Šiandien vaikas mokėsi gudrybės <b>„${escapeHTML(MECHANIC_LABEL[x.q.mechanic])}“</b>. Šio uždavinio jis dar nematė. Paprašykite išspręsti garsiai – svarbu ne atsakymas, o paaiškinimas, <i>kaip</i> galvojo. Pataisyti nebūtina: užtenka paklausti „O kaip patikrintum?“.</p>

function weeklyRecapHTML(){
  const today = new Date();
  const monday = today.getDay() === 1;
  const rows = weekActivity(monday ? 1 : 0);
  const active = rows.filter(r => r.a && r.a.answered);
  if(!active.length) return '';
  const answered = rows.reduce((s,r)=> s + ((r.a && r.a.answered) || 0), 0);
  const correct  = rows.reduce((s,r)=> s + ((r.a && r.a.correct) || 0), 0);
  const stars    = rows.reduce((s,r)=> s + ((r.a && r.a.stars) || 0), 0);
  const fromTs = rows[0].date.getTime();
  const toTs   = rows[6].date.getTime() + ONE_DAY_MS;
  const mastered = Object.entries(store.masteredMech || {}).filter(([m, t]) => t >= fromTs && t < toTs).map(([m]) => m);
  const contests = (store.contests || []).filter(c => c.when >= fromTs && c.when < toTs);
  const fixedWeek = Object.values(store.mistakes || {}).filter(m => m.fixedAt >= fromTs && m.fixedAt < toTs).length;
  const prevContests = (store.contests || []).filter(c => c.when < fromTs).slice(-1);
  const weak = weakestMechanics(6).find(w => w.showAttempts >= 4) || null;   // ≥ 4 samples before naming a weakness
  const next = nextMechanicToLearn();
  const focus = weak && weak.rate >= 0.4 ? weak.mech : next;

          <div class="stat"><b>${answered}</b><span>${pluralForm(answered,'uždavinys','uždaviniai','uždavinių')}${answered ? ` · ${Math.round(100*correct/answered)} % teisingai` : ''}</span></div>
          <div class="stat"><b>${stars} ⭐</b><span>${pluralForm(stars,'žvaigždė','žvaigždės','žvaigždžių')} per savaitę</span></div>

        </div>

        ${contests.length ? `<p style="margin:8px 0 0">${contests.length > 1 ? 'Kontroliniai' : 'Kontrolinis'}: <b>${contests.map(c => fmtPts(c.scoreWithPenalty ?? c.points)).join(' → ')}</b> t.${contests.some(c => (c.practisedBefore||0) >= 6) ? ' <span class="pill muted" title="Dalis uždavinių jau buvo spręsta treniruotėse">dalis matyta</span>' : ''}${prevContests.length ? ` (prieš tai: ${fmtPts(prevContests[0].scoreWithPenalty ?? prevContests[0].points)} t.${(contests[contests.length-1].scoreWithPenalty ?? 0) > (prevContests[0].scoreWithPenalty ?? 0) ? ' 📈' : ''})` : ''}</p>` : ''}
        ${focus ? `<div class="footer-actions" style="margin-top:10px">
          <span>${monday ? 'Šios' : 'Kitos'} savaitės tikslas: <b>${escapeHTML(MECHANIC_LABEL[focus] || focus)}</b>${weak && focus === weak.mech ? ` (${Math.round(100*weak.rate)} % klaidų)` : ' (kita gudrybė tavo take)'}</span>
          <button class="btn small primary" data-recap-mech="${focus}">Mokytis</button>

      </details>
    </section>`;

/* -------- Race challenge: a 5-question gate before the game -------- */
/* Gate pool. In the foundation phase (> 60 days out, few mechanics learned)
   the gate also admits 3-pointers so a beginner can actually reach the
   game in week 1; from the build phase on it is 4/5-pt only. */
function buildRacePool(){
  const easyGate = planPhase() === "foundation" && masteredCount() < 5;
  const pool = [];
  const reserved = new Set(reservedYears().map(String));
  for(const t of ARCHIVE){
    if(reserved.has(String(t.year))) continue;   // held out for contest sims
    for(const q of t.questions){
      const ok = easyGate ? (q.points === 3 || q.points === 4) : (q.points === 4 || q.points === 5);
      if(ok && q.correct){
        pool.push(Object.assign({}, q, {year: t.year}));
      }
    }
  }
  return pool;
}
/* Free race: a ticket earned by finishing the daily plan – medium track,
   2 lives, no 5-question gate. */
function openFreeRace(){
  if(!(store.games.freeRaces > 0)) return;
  // the ticket is spent when a game starts – backing out of the picker keeps it
  renderGamePick("medium", 2, "🎟 Bilietas – kurį žaidimą?", ()=>{
    if(store.games.freeRaces > 0) store.games.freeRaces--;
    saveStore(store);
  });
}
// One unlock (5-question gate) or one ticket = this many runs; then the
// game-over screen points back to the questions (or to a ticket in hand).
const GAME_RUNS_PER_UNLOCK = 3;
function shuffleInPlace(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const GATE_TRIES_PER_DAY = 3;
function gateTriesLeft(){
  const g = store.games || {};
  return g.gateDay === todayKey() ? Math.max(0, GATE_TRIES_PER_DAY - (g.gateTries || 0)) : GATE_TRIES_PER_DAY;
}
function openRaceChallenge(){
  if(gateTriesLeft() <= 0){
    showToast("🏁", "Šiandien iššūkį jau bandei 3 kartus. Rytoj – vėl. Šiandien gali spręsti pagal planą.", 5000);
    return;
  }
  const pool = buildRacePool();
  if(pool.length < 5){
    alert("Per mažai tinkamų uždavinių iššūkiui.");
    return;
  }
  // Prefer a mix: aim for at least two top-band questions when available.
  // (Top band is 5 normally, 4 in the easier foundation-phase gate.)
  const hiBand = pool.some(q => q.points === 5) ? 5 : 4;
  // Fresh questions first (stable partition after the shuffle) so the
  // gate does not keep re-asking what the kid answered last week.
  const freshFirst = arr => arr.sort((a, b) => (isRecentlySeen(a.year, a.num) ? 1 : 0) - (isRecentlySeen(b.year, b.num) ? 1 : 0));
  const fives = freshFirst(shuffleInPlace(pool.filter(q => q.points === hiBand))).slice(0, 3);
  const fours = freshFirst(shuffleInPlace(pool.filter(q => q.points === hiBand - 1))).slice(0, 5);
  let chosen = [...fives, ...fours];
  // De-dup by year+num, then trim/refill to exactly 5.
  const seen = new Set();
  chosen = chosen.filter(q => { const k = `${q.year}-${q.num}`; if(seen.has(k)) return false; seen.add(k); return true; });
  shuffleInPlace(chosen);
  chosen = chosen.slice(0, 5);
  while(chosen.length < 5){
    const q = pool[Math.floor(Math.random()*pool.length)];
    const k = `${q.year}-${q.num}`;
    if(!seen.has(k)){ seen.add(k); chosen.push(q); }
  }
  state.view = "raceChallenge";
  state.raceQs = chosen;
  state.raceIdx = 0;
  state.raceChosen = null;
  state.raceSubmitted = false;
  state.raceCorrect = 0;
  renderRaceChallenge();
}

function renderRaceChallenge(){
  const qs = state.raceQs;
  const idx = state.raceIdx;
  const q = qs[idx];
  const submitted = state.raceSubmitted;
  const imageOnly = q.imageOnlyOptions;

  const optionsHtml = ["A","B","C","D","E"].map(letter=>{
    const v = q.options ? q.options[letter] : null;
    if(v == null && !imageOnly) {
      // letter still selectable when answers are only in the figure
    }
    const hasText = v != null && String(v).trim() !== "";
    let cls = "opt";
    if(state.raceChosen === letter && !submitted) cls += " selected";
    if(submitted && letter === q.correct) cls += " correct";
    if(submitted && state.raceChosen === letter && letter !== q.correct) cls += " wrong";
    const body = hasText ? escapeHTML(v) : `<i style="color:var(--muted)">– atsakymas paveikslėlyje –</i>`;
    return `<button type="button" class="${cls}" data-letter="${letter}">
      <span class="letter">${letter}</span>
      <span>${body}</span>
    </button>`;
  }).join("");

  const pips = qs.map((qq,i)=>{
    const done = i < idx || (i === idx && submitted);
    const cur = i === idx;
    return `<span class="contest-pip${cur?' current':''}${done?' filled':''}">${i+1}</span>`;
  }).join("");

  $app.innerHTML = `
    <section class="card">
      <div class="contest-header">
        <div><b>🏁 Žaidimų iššūkis</b> <span class="help-bar" style="margin-left:6px">Teisingų: ${state.raceCorrect}</span></div>
        <button class="btn ghost small" id="raceQuit">← Pradžia</button>
      </div>
      <div class="contest-strip">${pips}</div>
    </section>
    <section class="card">
      <div class="qmeta">
        <b>${idx+1} / 5</b>
        <span class="pill ${q.points===5?'bad':''}">${q.points} t.</span>
        <span class="pill muted">${escapeHTML(q.year)} m.</span>
      </div>
      ${questionBodyHTML(q, {lazy:false})}
      ${imageOnly?`<p class="help-bar">Atsakymai – paveikslėlyje. Rink raidę A–E.</p>`:''}
      <div class="options" id="raceOptions">${optionsHtml}</div>
      ${submitted ? `<div class="explain" style="margin-top:8px">
        ${state.raceChosen === q.correct ? '<b style="color:var(--good)">✓ Teisingai.</b>' : `<b style="color:var(--bad)">Ne. Teisingas – ${q.correct}.</b>`}
        ${q.solutionKid || q.solution ? `<div style="margin-top:6px;font-size:13px">${escapeHTML(shortText(solutionPlain(q), 420))}</div>` : ''}
      </div>` : ''}
      <div class="footer-actions">
        ${!submitted
          ? `<button class="btn primary" id="raceSubmit" ${state.raceChosen?'':'disabled'}>Patikrinti</button>`
          : `<button class="btn primary" id="raceNext">${idx < 4 ? 'Kitas →' : 'Rezultatai →'}</button>`}
      </div>
    </section>`;

  document.getElementById("raceOptions").addEventListener("click", e=>{
    if(state.raceSubmitted) return;
    const o = e.target.closest(".opt"); if(!o) return;
    state.raceChosen = o.dataset.letter;
    renderRaceChallenge();
  });
  document.getElementById("raceQuit").addEventListener("click", ()=>{ state.view="home"; renderHome(); });
  const sub = document.getElementById("raceSubmit");
  if(sub) sub.addEventListener("click", ()=>{
    if(!state.raceChosen) return;
    state.raceSubmitted = true;
    const correct = state.raceChosen === q.correct;
    if(correct) state.raceCorrect++;
    recordArchiveAnswer(q.year, q, correct, null);
    Sfx.play(correct ? "correct" : "wrong");
    checkAchievements();
    renderRaceChallenge();
  });
  const nxt = document.getElementById("raceNext");
  if(nxt) nxt.addEventListener("click", ()=>{
    if(state.raceIdx < 4){
      state.raceIdx++;
      state.raceChosen = null;
      state.raceSubmitted = false;
      renderRaceChallenge();
    } else {
      finishRaceChallenge();
    }
  });
}

function finishRaceChallenge(){
  const correct = state.raceCorrect;
  if(store.games.gateDay !== todayKey()){ store.games.gateDay = todayKey(); store.games.gateTries = 0; }
  store.games.gateTries = (store.games.gateTries || 0) + 1;
  store.games.bestChallengeCorrect = Math.max(store.games.bestChallengeCorrect || 0, correct);
  const unlocked = correct >= 3;
  let difficulty = null, lives = 0;
  if(unlocked){
    difficulty = correct === 3 ? "easy" : correct === 4 ? "medium" : "hard";
    lives = correct - 2;            // 3→1, 4→2, 5→3
    if(difficulty === "hard") store.games.hardUnlocked = true;
  }
  saveStore(store);
  checkAchievements();
  state.view = "raceResult";
  state._raceUnlock = {correct, unlocked, difficulty, lives};
  renderRaceResult();
}

        <div class="footer-actions" style="justify-content:center;gap:8px;flex-wrap:wrap">

/* -------- The racing minigame (canvas lane-dodger) -------- */
const RACE_DIFF = {
  easy:   {speed:2.4, accel:0.00020, spawnEvery:95, label:"Lengvas"},
  medium: {speed:3.4, accel:0.00035, spawnEvery:68, label:"Vidutinis"},
  hard:   {speed:4.6, accel:0.00055, spawnEvery:50, label:"Sunkus"},
};

function stopRaceGame(){
  const g = state._race;
  if(g){
    if(g.raf) cancelAnimationFrame(g.raf);
    if(g.keyHandler) document.removeEventListener("keydown", g.keyHandler);
    g.running = false;
  }
  state._race = null;
}

function openRaceGame(difficulty, lives){
  stopRaceGame();
  state.view = "race";
  const cfg = RACE_DIFF[difficulty] || RACE_DIFF.easy;
  // Star-shop cosmetics
  const playerHex = (SHOP_COLORS[store.shop.activeColor] || SHOP_COLORS.classic).hex;
  const night = !!(store.shop.night && store.shop.nightOn);
  const W = 360, H = 540, LANES = 3;
  const laneW = W / LANES;
  const carW = 46, carH = 60;
  const laneX = i => laneW * i + (laneW - carW) / 2;

  $app.innerHTML = `
    <section class="card">
      <div class="contest-header">
        <div><b>🏎 Lenktynės</b> <span class="pill muted" style="margin-left:6px">${cfg.label}</span></div>
        <button class="btn ghost small" id="raceGameQuit">← Pradžia</button>
      </div>
      <div class="race-hud" id="raceHud"></div>
      <div class="race-canvas-wrap">
        <canvas id="raceCanvas" width="${W}" height="${H}"></canvas>
      </div>
      <div class="race-controls">
        <button class="btn race-ctrl" id="raceLeft" aria-label="Kairėn">◀</button>
        <button class="btn race-ctrl" id="raceRight" aria-label="Dešinėn">▶</button>
      </div>
      <p class="help-bar" style="text-align:center">Klaviatūra: ← → arba A / D</p>
    </section>`;

  const canvas = document.getElementById("raceCanvas");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("raceHud");

  const g = {
    running:true, raf:0, keyHandler:null,
    lane:1, lives, difficulty, cfg,
    speed: cfg.speed, distance:0, frame:0,
    obstacles:[],   // {lane, y}
    invuln:0,       // frames of post-hit grace
    over:false, newRecord:false,
  };
  state._race = g;

  function move(dir){
    if(g.over) return;
    g.lane = Math.max(0, Math.min(LANES-1, g.lane + dir));
  }
  g.keyHandler = (e)=>{
    if(state.view !== "race") return;
    if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A"){ move(-1); e.preventDefault(); }
    else if(e.key === "ArrowRight" || e.key === "d" || e.key === "D"){ move(1); e.preventDefault(); }
  };
  document.addEventListener("keydown", g.keyHandler);
  document.getElementById("raceLeft").addEventListener("click", ()=>move(-1));
  document.getElementById("raceRight").addEventListener("click", ()=>move(1));
  // Tap left/right half of the canvas to steer (touch friendly)
  canvas.addEventListener("pointerdown", (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    move(x < rect.width/2 ? -1 : 1);
  });
  document.getElementById("raceGameQuit").addEventListener("click", ()=>{
    stopRaceGame(); state.view="home"; renderHome();
  });

  const playerY = H - carH - 14;

  function spawn(){
    // Never block: pick a lane; ensure not same lane as the last spawn back-to-back too often.
    const lane = Math.floor(Math.random()*LANES);
    g.obstacles.push({lane, y: -carH});
  }

  function endGame(){
    if(g.over) return;          // idempotent – never double-count a single run
    g.over = true;
    g.running = false;
    if(g.raf) cancelAnimationFrame(g.raf);
    const score = Math.floor(g.distance);
    store.games.plays = (store.games.plays||0) + 1;
    if(score > (store.games.best||0)){ store.games.best = score; g.newRecord = true; }
    store.games.bestByDiff[difficulty] = Math.max(store.games.bestByDiff[difficulty]||0, score);
    saveStore(store);
    checkAchievements();
    if(g.newRecord) Fx.celebrate("badge"); else Sfx.play("gameover");
    renderGameOver("race", score, difficulty, lives, g.newRecord);
  }

  function drawCar(x, y, color, isPlayer){
    ctx.fillStyle = color;
    roundRect(ctx, x, y, carW, carH, 9); ctx.fill();
    // windshield
    ctx.fillStyle = "rgba(255,255,255,.35)";
    roundRect(ctx, x+8, y+(isPlayer?10:carH-26), carW-16, 16, 4); ctx.fill();
    // wheels
    ctx.fillStyle = "#222";
    ctx.fillRect(x-3, y+8, 4, 14);
    ctx.fillRect(x+carW-1, y+8, 4, 14);
    ctx.fillRect(x-3, y+carH-22, 4, 14);
    ctx.fillRect(x+carW-1, y+carH-22, 4, 14);
  }

  function loop(){
    if(!g.running || state.view !== "race"){ return; }
    g.frame++;
    g.speed += g.cfg.accel;
    g.distance += g.speed * 0.12;

    // spawn
    const interval = Math.max(28, Math.round(g.cfg.spawnEvery - g.distance*0.02));
    if(g.frame % interval === 0) spawn();

    // move obstacles
    for(const o of g.obstacles) o.y += g.speed;
    g.obstacles = g.obstacles.filter(o => o.y < H + carH);

    // collision
    if(g.invuln > 0) g.invuln--;
    if(g.invuln === 0){
      for(const o of g.obstacles){
        if(o.lane === g.lane){
          const oy = o.y;
          if(oy + carH > playerY && oy < playerY + carH){
            // hit
            g.lives--;
            g.invuln = 70;
            o.y = H + 999; // remove this one so we don't multi-hit
            Sfx.play("crash");
            if(g.lives <= 0){ endGame(); return; }
            break;
          }
        }
      }
    }

    // ---- draw ----
    ctx.clearRect(0,0,W,H);
    // road
    ctx.fillStyle = night ? "#14171c" : "#3a3f47";
    ctx.fillRect(0,0,W,H);
    // lane dashes (scrolling)
    ctx.strokeStyle = night ? "rgba(255,235,130,.45)" : "rgba(255,255,255,.5)";
    ctx.lineWidth = 3;
    ctx.setLineDash([22,20]);
    const dashOffset = (g.distance*4) % 42;
    for(let i=1;i<LANES;i++){
      ctx.beginPath();
      ctx.lineDashOffset = -dashOffset;
      ctx.moveTo(laneW*i, 0); ctx.lineTo(laneW*i, H); ctx.stroke();
    }
    ctx.setLineDash([]);
    // obstacles
    const obsColors = ["#e8b400","#39a0ed","#b388ff","#ff7043"];
    for(const o of g.obstacles){
      if(o.y > H) continue;
      drawCar(laneX(o.lane), o.y, obsColors[(o.lane + Math.floor(o.y/120)) % obsColors.length], false);
    }
    // player (blink while invulnerable)
    if(!(g.invuln > 0 && g.frame % 8 < 4)){
      drawCar(laneX(g.lane), playerY, playerHex, true);
    }

    // HUD
    hud.innerHTML = `<span class="pill">🏁 ${Math.floor(g.distance)} m</span>
      <span class="pill good">${'❤️'.repeat(Math.max(0,g.lives))}</span>
      <span class="pill muted">Rekordas: ${Math.max(store.games.best||0, Math.floor(g.distance))} m</span>`;

    g.raf = requestAnimationFrame(loop);
  }
  g.raf = requestAnimationFrame(loop);
}

/* -------- Second minigame: Kengūros šuolis (canvas endless runner) ------
   A kangaroo runs right; obstacles scroll in; Space / ↑ / tap jumps.
   Same difficulty + lives semantics as the race; shares state._race so
   stopRaceGame() tears either game down. */
const JUMP_DIFF = {
  easy:   {speed:3.2, accel:0.00025, gapMin:70, gapMax:130},
  medium: {speed:4.2, accel:0.00040, gapMin:58, gapMax:110},
  hard:   {speed:5.4, accel:0.00060, gapMin:46, gapMax:92},
};
function openJumpGame(difficulty, lives){
  stopRaceGame();
  state.view = "jump";
  const cfg = JUMP_DIFF[difficulty] || JUMP_DIFF.easy;
  const night = !!(store.shop.night && store.shop.nightOn);
  const bodyHex = (SHOP_COLORS[store.shop.activeColor] || SHOP_COLORS.classic).hex;
  const W = 360, H = 300, GROUND = H - 40;
  const kW = 34, kH = 44;
  const kX = 52;

  $app.innerHTML = `
    <section class="card">
      <div class="contest-header">
        <div><b>🦘 Kengūros šuolis</b> <span class="pill muted" style="margin-left:6px">${DIFF_LABEL[difficulty]}</span></div>
        <button class="btn ghost small" id="jumpQuit">← Pradžia</button>
      </div>
      <div class="race-hud" id="jumpHud"></div>
      <div class="race-canvas-wrap">
        <canvas id="jumpCanvas" width="${W}" height="${H}"></canvas>
      </div>
      <div class="race-controls">
        <button class="btn race-ctrl" id="jumpBtn" aria-label="Šokti" style="min-width:160px">⬆ Šokti</button>
      </div>
      <p class="help-bar" style="text-align:center">Klaviatūra: tarpas arba ↑ · ekrane: paliesk</p>
    </section>`;

  const canvas = document.getElementById("jumpCanvas");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("jumpHud");
  const g = {
    running:true, raf:0, keyHandler:null,
    lives, difficulty, cfg, speed:cfg.speed, distance:0, frame:0,
    y:GROUND, vy:0, onGround:true,
    obstacles:[],       // {x, w, h}
    nextGap: 90, invuln:0, over:false, newRecord:false,
  };
  state._race = g;

  function jump(){
    if(g.over) return;
    if(g.onGround){ g.vy = -11.5; g.onGround = false; Sfx.play("click"); }
  }
  g.keyHandler = (e)=>{
    if(state.view !== "jump") return;
    if(e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W"){ jump(); e.preventDefault(); }
  };
  document.addEventListener("keydown", g.keyHandler);
  document.getElementById("jumpBtn").addEventListener("click", jump);
  canvas.addEventListener("pointerdown", (e)=>{ e.preventDefault(); jump(); });
  document.getElementById("jumpQuit").addEventListener("click", ()=>{ stopRaceGame(); state.view="home"; renderHome(); });

  function endGame(){
    if(g.over) return;
    g.over = true; g.running = false;
    if(g.raf) cancelAnimationFrame(g.raf);
    const score = Math.floor(g.distance);
    store.games.jumpPlays = (store.games.jumpPlays||0) + 1;
    if(score > (store.games.jumpBest||0)){ store.games.jumpBest = score; g.newRecord = true; }
    saveStore(store);
    checkAchievements();
    if(g.newRecord) Fx.celebrate("badge"); else Sfx.play("gameover");
    renderGameOver("jump", score, difficulty, lives, g.newRecord);
  }

  function drawKangaroo(x, yBottom){
    const y = yBottom - kH;
    ctx.fillStyle = bodyHex;
    roundRect(ctx, x, y + 10, kW, kH - 10, 10); ctx.fill();            // body
    roundRect(ctx, x + kW - 14, y, 20, 16, 7); ctx.fill();              // head
    ctx.fillRect(x + kW - 4, y - 6, 4, 9); ctx.fillRect(x + kW + 1, y - 6, 4, 9); // ears
    ctx.beginPath(); ctx.moveTo(x, y + kH - 16); ctx.lineTo(x - 18, y + kH - 2); ctx.lineTo(x + 2, y + kH - 6); ctx.closePath(); ctx.fill(); // tail
    ctx.fillStyle = "#fff"; ctx.fillRect(x + kW + 1, y + 5, 3, 3);     // eye
    ctx.fillStyle = "#3a2c11";
    const legPhase = g.onGround ? Math.sin(g.frame * 0.4) * 4 : 6;
    ctx.fillRect(x + 6, yBottom - 8, 9, 8 + legPhase);                  // legs
    ctx.fillRect(x + 20, yBottom - 8, 9, 8 - legPhase);
  }
  function drawObstacle(o){
    ctx.fillStyle = night ? "#6b8e23" : "#2e7d32";
    roundRect(ctx, o.x, GROUND - o.h, o.w, o.h, 5); ctx.fill();
    ctx.fillStyle = night ? "#8fbc3a" : "#43a047";
    ctx.fillRect(o.x + 4, GROUND - o.h + 6, Math.max(2, o.w - 8), 4);
  }

  function loop(){
    if(!g.running || state.view !== "jump"){ return; }
    g.frame++;
    g.speed += g.cfg.accel;
    g.distance += g.speed * 0.1;
    // physics
    g.vy += 0.55; g.y += g.vy;
    if(g.y >= GROUND){ g.y = GROUND; g.vy = 0; g.onGround = true; }
    // spawn
    g.nextGap -= g.speed;
    if(g.nextGap <= 0){
      const h = 22 + Math.floor(Math.random() * 26), w = 16 + Math.floor(Math.random() * 18);
      g.obstacles.push({x: W + 10, w, h});
      g.nextGap = g.cfg.gapMin + Math.random() * (g.cfg.gapMax - g.cfg.gapMin) + w;
    }
    for(const o of g.obstacles) o.x -= g.speed;
    g.obstacles = g.obstacles.filter(o => o.x + o.w > -10);
    // collision (AABB, kangaroo box slightly shrunk)
    if(g.invuln > 0) g.invuln--;
    if(g.invuln === 0){
      const px = kX + 4, pw = kW - 8, pTop = g.y - kH + 8, pBot = g.y;
      for(const o of g.obstacles){
        if(o.x < px + pw && o.x + o.w > px && pBot > GROUND - o.h && pTop < GROUND){
          g.lives--; g.invuln = 60; o.x = -999;
          Sfx.play("crash");
          if(g.lives <= 0){ endGame(); return; }
          break;
        }
      }
    }
    // draw
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = night ? "#101522" : "#cfe9ff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = night ? "#2b2f3a" : "#d9b86a"; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = night ? "rgba(255,255,255,.25)" : "rgba(120,80,20,.35)"; ctx.lineWidth = 2;
    ctx.setLineDash([18,14]); ctx.lineDashOffset = -((g.distance*6) % 32);
    ctx.beginPath(); ctx.moveTo(0, GROUND + 14); ctx.lineTo(W, GROUND + 14); ctx.stroke(); ctx.setLineDash([]);
    for(const o of g.obstacles) drawObstacle(o);
    if(!(g.invuln > 0 && g.frame % 8 < 4)) drawKangaroo(kX, g.y);
    hud.innerHTML = `<span class="pill">🦘 ${Math.floor(g.distance)} m</span>
      <span class="pill good">${'❤️'.repeat(Math.max(0,g.lives))}</span>
      <span class="pill muted">Rekordas: ${Math.max(store.games.jumpBest||0, Math.floor(g.distance))} m</span>`;
    g.raf = requestAnimationFrame(loop);
  }
  g.raf = requestAnimationFrame(loop);
}

// Canvas rounded-rect helper.
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}


/* ============================================================
   VIII. UTIL
   ============================================================ */
/* Official solution booklets mark their parts: the answer value first, then
   "?" = quick way (spėjimas), "??" = another quick way, "!" = full solution,
   "!!" = another solution. Turn that into labelled paragraphs instead of
   showing the raw markers. A "?" glued to a word ("netinka?") is ordinary
   punctuation – only a free-standing marker counts. */
const SOLUTION_MARKS = { "?": "Greitas būdas", "??": "Dar vienas greitas būdas", "!": "Sprendimas", "!!": "Kitas sprendimas" };
function parseOfficialSolution(t){
  const text = String(t || "").trim();
  const re = /(?:^|\s)(\?\?|\?|!!|!)(?=\s)/g;
  const marks = [];
  let m;
  while((m = re.exec(text))){
    const start = m.index + (m[0].length - m[1].length), end = m.index + m[0].length;
    const before = text.slice(0, start).trimEnd();
    const after = text.slice(end).trimStart();
    // a part starts at the top (after the answer value) or after a sentence;
    // "kad ! dalyje" / "Sprendimo ? užtenka" refer to a part, they don't open one
    if(marks.length && !/[.!?:;)“"…]$/.test(before)) continue;
    if(/^(dalyje|dalies|dalį|dalis|dalimi)\b/.test(after)) continue;
    if(!after) continue;                     // a stray "?" left from a figure at the very end
    marks.push({ mark: m[1], start, end });
  }
  if(!marks.length) return { value: null, parts: [{ label: "Sprendimas", text }] };
  const head = text.slice(0, marks[0].start).trim();
  const value = head && head.length <= 60 && !/[.:;]$/.test(head) ? head : null;
  const parts = [];
  if(head && !value) parts.push({ label: "Sprendimas", text: head });
  marks.forEach((mk, i) => {
    const body = text.slice(mk.end, i + 1 < marks.length ? marks[i + 1].start : text.length).trim();
    if(body) parts.push({ label: SOLUTION_MARKS[mk.mark], text: body });
  });
  return { value, parts };
}
function officialSolutionHTML(t){
  const { value, parts } = parseOfficialSolution(t);
  return (value ? `<div><b>Atsakymas:</b> ${escapeHTML(value)}</div>` : "") +
    parts.map(p => `<div style="margin-top:6px"><b>${p.label}.</b> ${escapeHTML(p.text)}</div>`).join("");
}
function solutionPlain(q){
  if(q.solutionKid) return q.solutionKid;
  if(!q.solution) return "";
  return parseOfficialSolution(q.solution).parts.map(p => p.text).join(" ");
}
/* A kid solution is one run of text ("Gudrybė: … . steps … Atsakymas: X) …").
   On a phone that is a wall of small print: show the trick as its own line,
   the steps in short paragraphs (~2 sentences) and the answer line last. */
/* opts.fade (worked-example fading, 2026-10-17): the worked step of a
   playlist hides the answer line and – with ≥ 2 steps – the last step, so the
   kid completes the example instead of only reading it. */
function kidSolutionParts(t){
  t = String(t || "").trim();
  const ans = (t.match(/\sAtsakymas:\s*[A-E]\)[^]*$/) || [""])[0];
  let body = ans ? t.slice(0, t.length - ans.length) : t;
  const trick = (body.match(/^Gudrybė:\s*.+?[.!?](?=\s|$)/) || [""])[0];
  body = body.slice(trick.length).trim();
  // a sentence ends at . ! ? before a capital / digit – but not after "t. y." or "pvz."
  const sentences = body.split(/(?<!\bt\. y\.|pvz\.)(?<=[.!?])\s+(?=[A-ZĄČĘĖĮŠŲŪŽ„(0-9])/u).filter(Boolean);
  const paras = [];
  for(const s of sentences){
    const last = paras[paras.length - 1];
    if(last != null && last.length + s.length < 220) paras[paras.length - 1] = last + " " + s; else paras.push(s);
  }
  return {trick, paras, ans};
}
function kidSolutionHTML(t, opts){
  const fade = !!(opts && opts.fade);
  const {trick, paras, ans} = kidSolutionParts(t);
  if(fade){
    const hideLast = paras.length >= 2;
    return (trick ? `<p class="kid-trick">💡 ${escapeHTML(trick)}</p>` : "") +
      (hideLast ? paras.slice(0, -1) : paras).map(p => `<p class="kid-step">${escapeHTML(p)}</p>`).join("") +
      `<p class="kid-step kid-gap">✏️ ${hideLast ? 'Paskutinį žingsnį užbaik pats' : 'Kur veda šie žingsniai?'} – tada pažymėk atsakymą.</p>`;
  }
  return (trick ? `<p class="kid-trick">💡 ${escapeHTML(trick)}</p>` : "") +
    paras.map(p => `<p class="kid-step">${escapeHTML(p)}</p>`).join("") +
    (ans ? `<p class="kid-answer">✅ ${escapeHTML(ans.trim())}</p>` : "");
}
/* One place that decides what a solution box shows: the kid solution, else
   the official one (labelled), else AI text as the last resort. */
function solutionBlockHTML(q, aiText, isAi){
  if(q.solutionKid) return `<div class="kid-sol"><b>Sprendimas</b>${kidSolutionHTML(q.solutionKid)}</div>` +
    (q.solution ? `<details style="margin-top:8px"><summary style="cursor:pointer">Oficialus sprendimas${/(^|\s)\?\s/.test(q.solution) ? ' (yra greitas būdas)' : ''}</summary>${officialSolutionHTML(q.solution)}${/(^|\s)\?\s/.test(q.solution) ? `<p class="help-bar" style="margin:8px 0 0">🔀 Palygink abu kelius: kuris greitesnis konkurse? Kada tiktų kitas?</p>` : ''}</details>` : '');
  if(q.solution) return officialSolutionHTML(q.solution);
  if(aiText) return `<b>Sprendimas:</b>${isAi ? ' <span class="pill" aria-label="sugeneruota dirbtinio intelekto" style="font-size:12px">AI</span>' : ''} ${escapeHTML(aiText)}`;
  return "";
}

/* Points can be quarters under the −¼ rule; Lithuanian writes 2,25. */
/* Trim at a sentence end (never mid-word); keep the closing "Atsakymas: …"
   line of a kid solution, which is what the kid looks for. */
function shortText(t, n){
  t = String(t || "");
  if(t.length <= n) return t;
  const tail = (t.match(/Atsakymas:[^]*$/) || [""])[0];
  const room = Math.max(80, n - tail.length - 2);
  const cut = t.slice(0, room);
  const end = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  return (end > 40 ? cut.slice(0, end + 1) : cut.replace(/\s+\S*$/, "") + "…") + (tail ? " … " + tail : "");
}
function fmtPts(n){ return String(Math.round((Number(n) || 0) * 100) / 100).replace('.', ','); }
/* The figure of an archive question is the question as printed – text,
   drawing and options – so the typed prompt would only repeat it. The
   figure comes first; the text sits behind a small "Aa" toggle (useful on a
   narrow phone, for copying and for screen readers). The toggle's state is
   remembered in store.settings.showQText (see the document-level listener
   in wireQTextToggle). */
function questionBodyHTML(q, opts){
  opts = opts || {};
  const text = `<div class="qprompt">${escapeHTML(q.prompt)}</div>`;
  if(!q.figure) return text;
  const alt = opts.alt || `${q.num ? q.num + ' uždavinys' : 'Uždavinys'} – originalus tekstas ir paveikslėlis`;
  const fig = `<div class="figure"><img class="fig-focus" tabindex="0" role="button" aria-label="${escapeHTML(alt ? alt + ' – padidinti' : 'Padidinti paveikslėlį')}" src="${encodeURI(q.figure)}" alt="${escapeHTML(alt)}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)"${opts.lazy === false ? '' : ' loading="lazy"'}></div><div class="fig-tools"><span class="fig-zoom-hint">🔍 Paspausk paveikslėlį, kad padidintum</span>${opts.draw === false ? '' : `<button type="button" class="btn small ghost" data-draw="${escapeHTML(encodeURI(q.figure))}" aria-pressed="false">✏️ Piešti</button>`}</div>`;
  // On a phone the figure's print is too small to read, so the text starts
  // open there; an explicit choice (either way) wins.
  const pref = store.settings ? store.settings.showQText : null;
  const narrow = typeof window !== "undefined" && window.innerWidth > 0 && window.innerWidth < 600;
  const open = pref != null ? !!pref : narrow;
  // data-auto marks an element created open: browsers fire one "toggle" for
  // it right after parsing, which must not be taken for the kid's choice
  return `${fig}<details class="qtext" data-qtext${open ? ' open data-auto="1"' : ''}><summary><span class="qtext-aa">Aa</span> <span class="qtext-lbl"></span></summary>${text}</details>`;
}
function wireQTextToggle(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  // "toggle" does not bubble – listen in the capture phase
  document.addEventListener("toggle", e => {
    const d = e.target;
    if(!d || !d.matches || !d.matches("details[data-qtext]")) return;
    if(d.dataset.auto && d.open){ delete d.dataset.auto; return; }   // the parser's own event, not a tap
    delete d.dataset.auto;
    if(store.settings.showQText != null && !!store.settings.showQText === !!d.open) return;
    store.settings.showQText = !!d.open;
    saveStore(store);
    // keep every other card on the page in step
    document.querySelectorAll("details[data-qtext]").forEach(o => { if(o !== d) o.open = d.open; });
  }, true);
}
function escapeHTML(s){
  if(s==null) return "";
  if(typeof s !== "string") s = String(s);
  // Allow our pre-built SVG strings to pass through (they don't go via escapeHTML)
  return s.replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  })[ch]);
}
function shortPrompt(p){
  if(p.length < 80) return p;
  return p.slice(0,80) + "…";
}

/* ============================================================
   IX. PRADŽIA
   ============================================================ */
renderHome();
startStarTimeHeartbeat();
wireFigureZoom();
wireQTextToggle();
// Offline: a tiny service worker caches the app shell + figures on demand
// (network-first for the shell so updates land immediately).
if(typeof navigator !== "undefined" && "serviceWorker" in navigator && typeof location !== "undefined" && location.protocol !== "file:"){
  try { navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(_){}
}
/* The 2026-10-11 archive audit moved 269 questions to their real point band,
   so a trick marked fully mastered at band 3 or 4 may now have 5-pointers
   to pass. Keep the band that was passed, drop the "fully mastered" mark
   (the track then shows it half-done and the plan comes back for the 5). */
function reconcileMasteryWithArchive(){
  let changed = 0;
  for(const m of Object.keys(store.masteredMech || {})){
    const passed = (store.masteredBand || {})[m];
    const top = mechTopBand(m);
    if(passed && top && passed < top){ delete store.masteredMech[m]; changed++; }
  }
  // queued reviews remember the band they were answered at
  for(const [k, d] of Object.entries(store.dueQueue || {})){
    const t = ARCHIVE.find(t => String(t.year) === String(d.year));
    const q = t && t.questions.find(q => q.num === d.num);
    if(!q){ delete store.dueQueue[k]; changed++; continue; }     // e.g. a 2006 item
    if(q && q.points && d.band !== q.points){ d.band = q.points; changed++; }
    if(q && q.mechanic && d.mech !== q.mechanic){ d.mech = q.mechanic; changed++; }
  }
  if(changed) saveStore(store);
  return changed;
}
reconcileMasteryWithArchive();
checkAchievements();   // retroactively award badges already earned by past activity

// keyboard: 1-5 → answer, Enter → submit/next
document.addEventListener("keydown", e=>{
  // contest: A–E (or 1–5) choose / withdraw, ←/→ move between questions
  if(state.view === "contest" && !e.ctrlKey && !e.metaKey && !e.altKey){
    const qs = state.contestQuestions || [];
    const q = qs[state.contestCurrent];
    if(!q) return;
    const k = e.key.toUpperCase();
    const letter = "ABCDE".includes(k) && k.length === 1 ? k : (e.key >= "1" && e.key <= "5" ? "ABCDE"[parseInt(e.key, 10) - 1] : null);
    if(letter){
      if(state.contestAnswers[q.num] === letter) delete state.contestAnswers[q.num]; else state.contestAnswers[q.num] = letter;
      persistContestProgress(); renderContest(); e.preventDefault(); return;
    }
    if(e.key === "ArrowRight" && state.contestCurrent < qs.length - 1){ state.contestCurrent++; persistContestProgress(); renderContest(); e.preventDefault(); return; }
    if(e.key === "ArrowLeft" && state.contestCurrent > 0){ state.contestCurrent--; persistContestProgress(); renderContest(); e.preventDefault(); return; }
    return;
  }
  if(state.view === "quiz"){
    const q = state.questions[state.current];
    if(!q) return;
    if(e.key >= "1" && e.key <= "5"){
      const i = parseInt(e.key,10)-1;
      if(i < q.options.length && !state.answers[state.current]){
        state._chosen = i;
        renderQuiz();
      }
    } else if(e.key === "Enter"){
      if(state.answers[state.current]){
        if(state.current < state.questions.length-1){
          state.current++;
          state._chosen=null; state._hintShown=false; state._firstStepShown=false;
          state._confidence=null;
          state._questionStartedAt = Date.now();
          renderQuiz();
        } else {
          finishQuiz(false);
        }
      } else if(state._chosen!=null && !(askConfidenceNow() && !state._confidence)){
        submitAnswer();
      }
    }
  }
});
</script>
