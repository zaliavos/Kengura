  // ---- B40. Suma pakaitomis (parity insight) --------------
  alternateSumPick(seed){
    const r = rng(seed);
    // Numbers 1..N in a row. Pick every other one. What's the largest possible sum?
    const n = pick(r, [8, 10, 12]);
    // Optimal: pick odd-indexed (1,3,5,...) or even-indexed (2,4,6,...) – bigger sum.
    let evenSum = 0, oddSum = 0;
    for(let i=1;i<=n;i++){ if(i%2===1) oddSum += i; else evenSum += i; }
    const correct = Math.max(evenSum, oddSum);
    const total = n*(n+1)/2;
    const distract = uniqDistract(r, correct, [
      ()=>Math.min(evenSum, oddSum),  // picked the smaller half
      ()=>total,                       // picked all
      ()=>total / 2 | 0,               // halved without thinking
      ()=>n,                           // just N
      ()=>correct + 1, ()=>correct - 1
    ], 4);
    return makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Skaičiai 1, 2, 3, …, ${n} surašyti į eilę. Reikia pasirinkti kelis iš jų taip, kad nė du pasirinkti skaičiai nestovėtų greta. Kokia yra didžiausia galima pasirinktų skaičių suma?`,
      correct, distract,
      firstStep:`Bandyk porą strategijų: pasirink 1, 3, 5, …. Paskui – 2, 4, 6, …. Kuri suma didesnė?`,
      hint:`„Nė du nestovėtų greta“ reiškia – galima imti kas antrą. Yra dvi paprasčiausios strategijos: imti nelygines pozicijas arba imti lygines pozicijas. Palygink jų sumas.`,
      explain:`Lyginių sumos (2+4+…+${n}) = ${evenSum}. Nelyginių sumos (1+3+…) = ${oddSum}. Didesnė: ${correct}.`,
      r
    });
  },

  // ---- B41. Melagiai ir tiesakalbiai (knights & knaves) ---
  liarsAndTruth(seed){
    const r = rng(seed);
    // 3 kids: one always lies, two always tell truth.
    // Each says one statement. Find the liar.
    const names = shuffle(r, ["Anelė", "Beata", "Cilė"]);
    const liarIdx = randInt(r, 0, 2);
    const liar = names[liarIdx];
    const truth1 = names[(liarIdx + 1) % 3];
    const truth2 = names[(liarIdx + 2) % 3];
    // Truth-tellers correctly say "X meluoja" about the liar.
    // Liar says "Y meluoja" about a truth-teller.
    const truthAccusee = liar;
    const liarAccusee = pick(r, [truth1, truth2]);
    // Build statements in canonical order (by name, not by role)
    const statements = names.map(n => {
      if(n === liar) return `${n} sako: „${liarAccusee} meluoja.“`;
      return `${n} sako: „${truthAccusee} meluoja.“`;
    });
    const opts = shuffle(r, names.slice());
    return {
      category:"logika", subtopic:"logika.melagiai", difficulty:5,
      prompt:`Trys vaikai – Anelė, Beata, Cilė. Vienas iš jų visada meluoja, kiti du visada sako tiesą. Kiekvienas pasakė po teiginį:\n• ${statements[0]}\n• ${statements[1]}\n• ${statements[2]}\nKuris meluoja?`,
      options: opts,
      correctIndex: opts.indexOf(liar),
      firstStep:`Spėk: tarkim, kad meluoja Anelė. Patikrink, ar tada visi teiginiai logiški.`,
      hint:`Du sako tiesą, vienas meluoja. Žiūrėk – jeigu du iš jų sutartinai sako „X meluoja“, o trečias – „Y meluoja“, tai melagis veikiausiai yra X arba trečiasis pats. Pabandyk hipotezę su kiekvienu kandidatu.`,
      explain:`Du tiesuoliai sutartinai sako „${truthAccusee} meluoja“ – ir tai tiesa. Vienas (${liar}) bando nukreipti dėmesį, sakydamas „${liarAccusee} meluoja“ – tai melas. Vadinasi, meluoja ${liar}.`
    };
  },

  // ---- B35. Magiškas kvadratas 3×3 (kintama suma) ----------
  magicSquare(seed){
    const r = rng(seed);
    // Lo Shu rotations (sum 15), then SHIFTED by k so kid must derive sum.
    const rotations = [
      [[2,7,6],[9,5,1],[4,3,8]],
      [[4,9,2],[3,5,7],[8,1,6]],
      [[8,3,4],[1,5,9],[6,7,2]],
      [[6,1,8],[7,5,3],[2,9,4]],
    ];
    const k = randInt(r, 0, 12); // shift so magic sum = 15 + 3k
    const baseSquare = pick(r, rotations);
    const square = baseSquare.map(rw => rw.map(v => v + k));
    const magicSum = 15 + 3 * k;
    // Hide one cell – center is allowed sometimes (different reasoning)
    const cells = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]];
    const [row, col] = pick(r, cells);
    const correct = square[row][col];
    const grid = square.map(rw => rw.slice());
    grid[row][col] = "?";
    const cell = 52;
    let svgCells = "";
    for(let i=0;i<3;i++){
      for(let j=0;j<3;j++){
        const v = grid[i][j];
        const isQ = v === "?";
        svgCells += `<rect x="${j*cell}" y="${i*cell}" width="${cell}" height="${cell}" fill="${isQ?'#ffe6d8':'#fffaf0'}" stroke="#1d1d1f" stroke-width="2"/>`;
        svgCells += `<text x="${j*cell+cell/2}" y="${i*cell+cell/2+7}" text-anchor="middle" font-size="20" font-weight="700" fill="${isQ?'#d6451a':'#1d1d1f'}">${v}</text>`;
      }
    }
    const figure = `<svg viewBox="0 0 ${3*cell+4} ${3*cell+4}" width="220" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(2,2)">${svgCells}</g>
    </svg>`;
    // Misconception-driven distractors:
    //   correct ± 1 – off-by-one on subtraction
    //   correct + magicSum's units digit – confusion with sum digits
    //   sum of OTHER row instead – wrong row picked
    //   15 − correct – assumed sum is always 15 (the Lo Shu trap!)
    const distract = uniqDistract(r, correct, [
      ()=>correct+1, ()=>correct-1,
      ()=>15 - (correct - k),       // "I assumed sum is 15"
      ()=>magicSum - correct,       // "I subtracted correct from magic sum"
      ()=>correct + 2,
      ()=>correct + k,              // "I forgot the offset"
      ()=>magicSum                  // "the sum itself"
    ], 4).filter(d => d >= 1 && d <= 50 && d !== correct);
    return makeMC({
      category:"logika", subtopic:"logika.tinklelis_pildymas", difficulty:5,
      prompt:`Magiškame kvadrate kiekvienos eilutės, stulpelio ir įstrižainės skaičių suma yra ta pati. Kuris skaičius turi būti vietoje klaustuko?`,
      figure,
      correct, distract,
      firstStep:`Pirma rask „magišką sumą“ iš pilnos eilutės arba stulpelio (kuriame nėra klaustuko).`,
      hint:`Magiškame kvadrate visų eilučių, stulpelių ir įstrižainių sumos lygios. Pasirink eilutę be klaustuko – sudėk – tai magiška suma. Paskui eilutėje su klaustuku atimk likusius du.`,
      explain:`Pilna eilutė duoda magišką sumą ${magicSum}. Toje eilutėje (ar stulpelyje) su klaustuku žinomi du skaičiai – jų suma = ${magicSum} − ${correct}. Vadinasi, trūksta ${correct}.`,
      r
    });
  },

  /* ====================================================================
     5 TAŠKŲ BLOKAS – parameterized contest-grade generators (2026-08-23).
     Every answer below is COMPUTED (BFS / DP / brute force), never a
     hard-coded formula, and each question carries a `_check` payload so
     _smoke_test.cjs can re-derive the answer independently.
     ==================================================================== */

  // ---- C1. Melagių skaičius (self-referential statements) ----
  liarsCount(seed){
    const r = rng(seed);
    const variant = pick(r, ["exact", "atleast"]);
    let n, correct, lines, explain;
    if(variant === "exact"){
      n = pick(r, [4, 5, 6]);
      lines = [];
      for(let i = 1; i <= n; i++) lines.push(`${i}-asis sako: „Tiksliai ${i} iš mūsų meluoja.“`);
      correct = n - 1;
      explain = `Visi sako skirtingus skaičius, o tikrasis melagių skaičius – vienas. Vadinasi, teisybę gali sakyti daugiausiai VIENAS vaikas, tad meluoja bent ${n-1}. Ar gali meluoti visi ${n}? Tada ${n}-ojo žodžiai „tiksliai ${n} meluoja“ būtų tiesa – prieštara. Lieka: meluoja ${n-1}, o teisybę sako tik ${n-1}-asis.`;
    } else {
      n = pick(r, [4, 6, 8]);
      lines = [];
      for(let i = 1; i <= n; i++) lines.push(`${i}-asis sako: „Bent ${i} iš mūsų meluoja.“`);
      correct = n / 2;
      explain = `Kuo mažesnį skaičių vaikas sako, tuo lengviau jo žodžiai tampa tiesa. Jei meluoja lygiai ${n/2}, tai teiginiai „bent 1“ … „bent ${n/2}“ – tiesa (juos sako pirmieji ${n/2} ${pluralForm(n/2,'vaikas','vaikai','vaikų')}), o likusių ${n/2} teiginiai melagingi. Tiesuolių ${n/2} ir melagių ${n/2} – viskas dera. Patikrink bet kokį kitą skaičių – visada susikerta.`;
    }
    const distract = uniqDistract(r, correct, [
      ()=>n, ()=>Math.max(1, correct-1), ()=>correct+1, ()=>1, ()=>Math.max(1, n-2)
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.melagiai", difficulty:5,
      prompt:`${n} vaikai kalbasi. Kiekvienas jų arba VISADA meluoja, arba VISADA sako tiesą.\n${lines.map(l=>"• "+l).join("\n")}\nKiek vaikų meluoja?`,
      correct, distract,
      firstStep:`Ar gali du iš jų kartu sakyti tiesą? Palygink jų teiginius.`,
      hint:`Melagių skaičius yra vienas konkretus skaičius. Spėk jį (pvz., pabandyk ${variant === "exact" ? n-1 : n/2}) ir patikrink KIEKVIENO vaiko žodžius: tiesuoliai turi sakyti tiesą, melagiai – meluoti.`,
      explain, r
    });
    q._check = {gen:"liarsCount", variant, n, ans: correct};
    return q;
  },

  // ---- C2. Puodelių vartymas (parity invariant, BFS-computed) ----
  cupsFlip(seed){
    const r = rng(seed);
    const n = pick(r, [6, 7, 8]);
    const m = pick(r, [2, 3, 4]);
    const d0 = randInt(r, 2, n - 1);
    // BFS over the count of upside-down cups
    const prev = new Array(n + 1).fill(-1);
    const dist = new Array(n + 1).fill(-1);
    dist[d0] = 0;
    const queue = [d0];
    while(queue.length){
      const d = queue.shift();
      const jLo = Math.max(0, m - (n - d));
      const jHi = Math.min(m, d);
      for(let j = jLo; j <= jHi; j++){
        const nd = d - j + (m - j);
        if(nd < 0 || nd > n || dist[nd] !== -1) continue;
        dist[nd] = dist[d] + 1;
        prev[nd] = d;
        queue.push(nd);
      }
    }
    const ans = dist[0];
    if(ans < 2 || ans > 5) return GENERATORS.cupsFlip(seed + 1);
    // reconstruct one optimal path for the explanation
    const path = [];
    for(let cur = 0; cur !== -1; cur = prev[cur]){ path.unshift(cur); if(cur === d0) break; }
    const distract = uniqDistract(r, ans, [
      ()=>Math.ceil(d0/m), ()=>ans+1, ()=>Math.max(1, ans-1), ()=>d0, ()=>m
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Ant stalo ${n} ${pluralForm(n,'puodelis','puodeliai','puodelių')}; ${d0} iš jų apversti dugnu aukštyn. Vienu ėjimu PRIVALAI apversti lygiai ${m} ${pluralForm(m,'puodelį','puodelius','puodelių')} (bet kuriuos). Per kiek mažiausiai ėjimų gali pasiekti, kad visi puodeliai stovėtų teisingai?`,
      correct: ans, distract,
      firstStep:`Sek tik vieną skaičių – kiek puodelių apversta. Kaip jis gali keistis per vieną ėjimą?`,
      hint:`Jei per ėjimą apverti ${m} puodelius ir tarp jų yra keli „blogi“, blogųjų skaičius keičiasi. Surašyk, kokie skaičiai pasiekiami po 1 ėjimo, po 2 ėjimų… Ne visi keliai veda į nulį iš karto!`,
      explain:`Sekame apverstųjų skaičių po kiekvieno ėjimo: ${path.join(" → ")}. Greičiau neįmanoma – patikrinus visus variantus, po ${ans-1} ėjimų nulio pasiekti dar negalima.`,
      r
    });
    q._check = {gen:"cupsFlip", n, m, d0, ans};
    return q;
  },

  // ---- C3. Lentos žaidimas su skirtumais (sum-parity invariant) ----
  blackboardMin(seed){
    const r = rng(seed);
    const lo = randInt(r, 1, 3);
    const count = randInt(r, 8, 13);
    const hi = lo + count - 1;
    const nums = [];
    for(let v = lo; v <= hi; v++) nums.push(v);
    const S = nums.reduce((a,b)=>a+b, 0);
    // reachable final values are |S − 2T| over subset sums T → DP for the min
    const can = new Array(S + 1).fill(false);
    can[0] = true;
    for(const v of nums) for(let t = S; t >= v; t--) if(can[t - v]) can[t] = true;
    let ans = S;
    for(let t = 0; t <= S; t++) if(can[t]) ans = Math.min(ans, Math.abs(S - 2*t));
    const wrongParity = ans === 0 ? 1 : 0;
    const distract = uniqDistract(r, ans, [
      ()=>wrongParity, ()=>2, ()=>lo, ()=>hi, ()=>3
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Ant lentos surašyti skaičiai nuo ${lo} iki ${hi}. Vienu ėjimu nutrini du skaičius ir vietoj jų užrašai jų skirtumą (didesnis minus mažesnis). Taip kartoji, kol lieka vienas skaičius. Koks MAŽIAUSIAS skaičius gali likti?`,
      correct: ans, distract,
      firstStep:`Kas atsitinka visų lentos skaičių sumai, kai du skaičius pakeiti jų skirtumu?`,
      hint:`Pakeitus a ir b jų skirtumu, suma sumažėja dvigubu mažesniuoju skaičiumi – tai visada LYGINIS pokytis. Vadinasi, sumos lyginumas niekada nesikeičia. Kokia pradinė suma – lyginė ar nelyginė?`,
      explain:`Visų suma ${S} – ${S % 2 ? "nelyginė" : "lyginė"}. Kiekvienas ėjimas sumą sumažina lyginiu skaičiumi, todėl ir likęs skaičius bus ${S % 2 ? "nelyginis" : "lyginis"}. Mažiausias toks – ${ans}. Jį pasiekti galima: gretimų porų skirtumai lygūs 1, o vienetai naikina vienas kitą.`,
      r
    });
    q._check = {gen:"blackboardMin", lo, hi, S, ans};
    return q;
  },

  // ---- C4. Skaitmenų sukeitimas (digit puzzle, brute-force verified) ----
  digitReversal(seed){
    const r = rng(seed);
    const a = randInt(r, 3, 9);
    const b = randInt(r, 1, a - 1);
    const num = 10*a + b, rev = 10*b + a;
    const d = num - rev, s = a + b;
    // brute-force: must be the UNIQUE two-digit number fitting both facts
    const fits = [];
    for(let x = 10; x <= 99; x++){
      const xa = Math.floor(x/10), xb = x % 10;
      if(xa + xb === s && x - (10*xb + xa) === d) fits.push(x);
    }
    if(fits.length !== 1 || fits[0] !== num) return GENERATORS.digitReversal(seed + 1);
    const sameSum = [];
    for(let x = 10; x <= 99; x++){
      if(Math.floor(x/10) + x%10 === s && x !== num) sameSum.push(x);
    }
    const distract = uniqDistract(r, num, [
      ()=>rev, ()=>pick(r, sameSum), ()=>pick(r, sameSum), ()=>num - 9, ()=>num + 9
    ], 4);
    const q = makeMC({
      category:"aritmetika", subtopic:"aritm.skaitmenu_pertvarka", difficulty:5,
      prompt:`Dviženklio skaičiaus skaitmenų suma ${s}. Sukeitus jo skaitmenis vietomis, gaunamas ${d} mažesnis skaičius. Koks tai skaičius?`,
      correct: num, distract,
      firstStep:`Surašyk visus dviženklius, kurių skaitmenų suma ${s}.`,
      hint:`Kandidatų nedaug: ${sameSum.slice(0,5).concat([num]).sort((x,y)=>x-y).join(", ")}… Kiekvienam patikrink: atimk „apverstą“ skaičių ir žiūrėk, ar gauni ${d}. (Pastebėjimas: toks skirtumas visada yra 9 kartotinis.)`,
      explain:`Tikriname skaičius su skaitmenų suma ${s}: tik ${num} tinka, nes ${num} − ${rev} = ${d}. Sukeitus skaitmenis skirtumas visada lygus 9 × (skaitmenų skirtumas): čia 9 × ${a - b} = ${d}.`,
      r
    });
    q._check = {gen:"digitReversal", s, d, ans: num};
    return q;
  },

  // ---- C5. Keliai tinkleliu (counting paths, DP-computed) ----
  gridPaths(seed){
    const r = rng(seed);
    const [cols, rows] = pick(r, [[2,3],[3,3],[2,4],[3,4],[4,4]]);
    // DP over lattice points
    const dp = [];
    for(let y = 0; y <= rows; y++){
      dp.push([]);
      for(let x = 0; x <= cols; x++){
        dp[y][x] = (x === 0 || y === 0) ? 1 : dp[y][x-1] + dp[y-1][x];
      }
    }
    const ans = dp[rows][cols];
    const cell = 36;
    const W = cols*cell, H = rows*cell;
    let linesSvg = "";
    for(let x = 0; x <= cols; x++) linesSvg += `<line x1="${x*cell}" y1="0" x2="${x*cell}" y2="${H}" stroke="#1d1d1f" stroke-width="1.6"/>`;
    for(let y = 0; y <= rows; y++) linesSvg += `<line x1="0" y1="${y*cell}" x2="${W}" y2="${y*cell}" stroke="#1d1d1f" stroke-width="1.6"/>`;
    const figure = `<svg viewBox="0 0 ${W+50} ${H+40}" width="${Math.min(W+50, 260)}" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(25,15)">${linesSvg}
        <circle cx="0" cy="${H}" r="5" fill="#d6451a"/>
        <circle cx="${W}" cy="0" r="5" fill="#1a7f4a"/>
        <text x="-16" y="${H+5}" font-size="14" font-weight="700">A</text>
        <text x="${W+7}" y="5" font-size="14" font-weight="700">B</text>
      </g>
    </svg>`;
    const distract = uniqDistract(r, ans, [
      ()=>cols*rows, ()=>cols+rows, ()=>2*(cols+rows), ()=>ans-2, ()=>ans+2, ()=>Math.floor(ans/2)
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.derinys", difficulty:5,
      prompt:`Skruzdėliukas eina tinklelio linijomis iš taško A į tašką B, žingsniuodamas tik į dešinę arba aukštyn. Keliais skirtingais keliais jis gali nueiti?`,
      figure,
      correct: ans, distract,
      firstStep:`Prie kiekvienos sankryžos užrašyk, keliais būdais skruzdėliukas gali JĄ pasiekti. Pradėk nuo apatinio krašto – ten visur po 1.`,
      hint:`Į bet kurią sankryžą ateinama arba iš kairės, arba iš apačios. Todėl būdų skaičius sankryžoje = būdai kairėje + būdai apačioje. Pildyk tinklelį skaičiais nuo A iki B.`,
      explain:`Pildome sankryžas: kraštuose visur 1, o kitur sudedame kairę ir apačią. Kampe B gaunasi ${ans}.`,
      r
    });
    q._check = {gen:"gridPaths", cols, rows, ans};
    return q;
  },

  // ---- C6. Akmenukų žaidimas (Nim variant, DP-computed) ----
  nimGame(seed){
    const r = rng(seed);
    const k = pick(r, [3, 4, 5]);
    const N = randInt(r, 12, 40);
    // DP: lose[i] = player to move with i stones loses (taking last wins)
    const lose = new Array(N + 1).fill(false);
    lose[0] = true;
    for(let i = 1; i <= N; i++){
      let canWin = false;
      for(let t = 1; t <= Math.min(k, i); t++) if(lose[i - t]) canWin = true;
      lose[i] = !canWin;
    }
    if(lose[N]) return GENERATORS.nimGame(seed + 1);   // first player can't force a win
    const moves = [];
    for(let t = 1; t <= Math.min(k, N); t++) if(lose[N - t]) moves.push(t);
    if(moves.length !== 1) return GENERATORS.nimGame(seed + 1);
    const ans = moves[0];
    const distract = uniqDistract(r, ans, [
      ()=>k, ()=>k+1, ()=>Math.max(1, ans-1), ()=>ans+1, ()=>1, ()=>2
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Ant stalo ${N} ${pluralForm(N,'akmenukas','akmenukai','akmenukų')}. Du žaidėjai paeiliui ima nuo 1 iki ${k} akmenukų. Laimi tas, kuris paima PASKUTINĮ akmenuką. Kiek akmenukų pirmuoju ėjimu turi paimti pirmasis žaidėjas, kad tikrai laimėtų (abiem žaidžiant geriausiai)?`,
      correct: ans, distract,
      firstStep:`Pagalvok nuo galo: su kiek akmenukų ant stalo eilę gavęs žaidėjas PRALAIMI?`,
      hint:`Blogos pozicijos – 0, ${k+1}, ${2*(k+1)}, ${3*(k+1)}… (kas ${k+1}-a): kad ir kiek paimtum (1–${k}), priešininkas papildo iki ${k+1} ir vėl palieka tau blogą skaičių. Pirmasis turi iškart palikti priešininkui blogą skaičių.`,
      explain:`Pralaimi tas, kuris gauna skaičių, dalų iš ${k+1}: 0, ${k+1}, ${2*(k+1)}… ${N} = ${Math.floor(N/(k+1))}·${k+1} + ${ans}, tad pirmasis paima ${ans} ir palieka ${N-ans}. Toliau kiekvieną priešininko ėjimą jis papildo iki ${k+1} – ir paskutinis akmenukas atitenka jam.`,
      r
    });
    q._check = {gen:"nimGame", N, k, ans};
    return q;
  },

  // ---- C7. Penkių dalyvių logikos eilė (uniqueness brute-force) ----
  raceLogic5(seed){
    const r = rng(seed);
    const PEOPLE = [
      {nom:"Anelė",  gen:"Anelės",  acc:"Anelę",  f:true},
      {nom:"Beata",  gen:"Beatos",  acc:"Beatą",  f:true},
      {nom:"Cilė",   gen:"Cilės",   acc:"Cilę",   f:true},
      {nom:"Dovas",  gen:"Dovo",    acc:"Dovą",   f:false},
      {nom:"Mantas", gen:"Manto",   acc:"Mantą",  f:false},
    ];
    const nn = PEOPLE.length;
    const order = shuffle(r, PEOPLE.map((_, i) => i));   // order[place-1] = person idx
    const posOf = {};                                     // person idx -> place (1-based)
    order.forEach((p, i) => { posOf[p] = i + 1; });
    // clue spec: [type, i, j, c]; predicate over a candidate pos map
    const holds = (clue, pos) => {
      const [t, i, j, c] = clue;
      if(t === "after")   return pos[i] === pos[j] + 1;
      if(t === "before")  return pos[i] < pos[j];
      if(t === "notFirst")return pos[i] !== 1;
      if(t === "notLast") return pos[i] !== nn;
      if(t === "between") return Math.abs(pos[i] - pos[j]) - 1 === c;
      return false;
    };
    // all TRUE clues about the secret order
    const pool = [];
    for(let i = 0; i < nn; i++){
      if(posOf[i] !== 1) pool.push(["notFirst", i]);
      if(posOf[i] !== nn) pool.push(["notLast", i]);
      for(let j = 0; j < nn; j++){
        if(i === j) continue;
        if(posOf[i] === posOf[j] + 1) pool.push(["after", i, j]);
        if(posOf[i] < posOf[j]) pool.push(["before", i, j]);
        const gap = Math.abs(posOf[i] - posOf[j]) - 1;
        if(i < j && (gap === 1 || gap === 2)) pool.push(["between", i, j, gap]);
      }
    }
    // all 120 permutations as pos maps
    const perms = [];
    (function build(rest, acc){
      if(!rest.length){ const pos = {}; acc.forEach((p, i) => pos[p] = i + 1); perms.push(pos); return; }
      for(let x = 0; x < rest.length; x++) build(rest.slice(0, x).concat(rest.slice(x+1)), acc.concat([rest[x]]));
    })([0,1,2,3,4], []);
    // add shuffled clues until exactly one permutation survives
    const shuffledPool = shuffle(r, pool);
    const clues = [];
    let alive = perms;
    for(const clue of shuffledPool){
      if(alive.length === 1) break;
      const next = alive.filter(pos => holds(clue, pos));
      if(next.length === alive.length) continue;   // clue adds nothing – skip
      clues.push(clue);
      alive = next;
      if(clues.length >= 6) break;
    }
    if(alive.length !== 1 || clues.length < 3) return GENERATORS.raceLogic5(seed + 1);
    const clueText = (clue) => {
      const [t, i, j, c] = clue;
      const X = PEOPLE[i], Y = PEOPLE[j];
      if(t === "after")    return `${X.nom} finišavo iškart po ${Y.gen}.`;
      if(t === "before")   return `${X.nom} finišavo anksčiau už ${Y.acc}.`;
      if(t === "notFirst") return `${X.nom} nebuvo ${X.f ? "pirmoji" : "pirmas"}.`;
      if(t === "notLast")  return `${X.nom} nebuvo ${X.f ? "paskutinė" : "paskutinis"}.`;
      return `Tarp ${X.gen} ir ${Y.gen} finišavo lygiai ${c === 1 ? "vienas dalyvis" : c + " dalyviai"}.`;
    };
    const winnerIdx = order[0];
    const opts = shuffle(r, PEOPLE.map(p => p.nom));
    const finalOrder = order.map((p, i) => `${i+1}. ${PEOPLE[p].nom}`).join(", ");
    const q = {
      category:"logika", subtopic:"logika.eile", difficulty:5,
      prompt:`Bėgimo varžybose dalyvavo ${PEOPLE.map(p=>p.nom).join(", ")}. Žinoma:\n${clues.map(cl=>"• "+clueText(cl)).join("\n")}\nKas laimėjo?`,
      options: opts,
      correctIndex: opts.indexOf(PEOPLE[winnerIdx].nom),
      firstStep:`Pradėk nuo užuominų apie pirmą ir paskutinę vietas – jos užbraukia daugiausiai galimybių.`,
      hint:`Nusibraižyk 5 tuščias vietas. Kiekviena užuomina arba pastato žmogų į vietą, arba užbraukia negalimas vietas. Poras „iškart po“ dėk kaip vieną bloką.`,
      explain:`Vienintelė visoms užuominoms tinkanti eilė: ${finalOrder}. Laimėjo ${PEOPLE[winnerIdx].nom}.`,
    };
    q._check = {gen:"raceLogic5", clues, order, ansName: PEOPLE[winnerIdx].nom};
    return q;
  },

  // ---- C8. Vienodos krūvelės (partition with size constraint) ----
  equalGroups(seed){
    const r = rng(seed);
    const n = randInt(r, 10, 16);
    const S = n*(n+1)/2;
    // max g with g | S and S/g ≥ n (classic: such partitions always exist)
    let ans = 0;
    for(let g = 2; g <= S; g++) if(S % g === 0 && S / g >= n) ans = g;
    if(ans < 3) return GENERATORS.equalGroups(seed + 1);
    // trap: bigger divisor whose pile target is too small for the n-gram weight
    let trap = 0;
    for(let g = ans + 1; g <= S; g++) if(S % g === 0){ trap = g; break; }
    const distract = uniqDistract(r, ans, [
      ()=>trap, ()=>ans-1, ()=>ans+1, ()=>Math.floor(n/2), ()=>2
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Turime svarelius: 1 g, 2 g, 3 g, …, ${n} g (po vieną kiekvieno). Į kiek DAUGIAUSIAI krūvelių galima juos padalinti taip, kad visų krūvelių masės būtų vienodos?`,
      correct: ans, distract,
      firstStep:`Pirma rask visų svarelių bendrą masę: 1 + 2 + … + ${n}.`,
      hint:`Bendra masė ${S} g. Krūvelių skaičius turi dalyti ${S}. Bet yra dar viena kliūtis: sunkiausias svarelis (${n} g) turi TILPTI į krūvelę – krūvelės masė negali būti mažesnė už ${n} g.`,
      explain:`Bendra masė ${S} g. Jei krūvelių ${trap || "daugiau"}, kiekvienos masė būtų ${trap ? S/trap + " g – mažiau nei sunkiausias " + n + " g svarelis, neįmanoma" : "per maža"}. ${ans} krūvelės po ${S/ans} g tinka: ${S} ÷ ${ans} = ${S/ans} ≥ ${n}, o sudėlioti visada pavyksta poruojant didžiausius su mažiausiais.`,
      r
    });
    q._check = {gen:"equalGroups", n, S, ans};
    return q;
  },

  // ---- C9. Prirašytas / nutrintas skaitmuo (place value) ----
  appendDigit(seed){
    const r = rng(seed);
    const variant = pick(r, ["append", "erase"]);
    let prompt, correct, distractMakers, explain, checkExtra;
    if(variant === "append"){
      const old = randInt(r, 24, 480);
      const d = randInt(r, 0, 9);
      const diff = 9*old + d;
      correct = old;
      prompt = `Skaičiaus gale Tomas prirašė skaitmenį ${d}. Skaičius padidėjo ${diff}. Koks buvo pradinis skaičius?`;
      explain = `Prirašius skaitmenį gale, skaičius tampa 10 kartų didesnis ir dar +${d}. Taigi padidėjimas = 9 pradiniai + ${d}. Iš ${diff} atimame ${d} ir dalijame iš 9: (${diff} − ${d}) ÷ 9 = ${old}. Patikra: ${old} → ${old*10+d}, skirtumas ${diff}. ✓`;
      distractMakers = [()=>Math.round(diff/10), ()=>old-9, ()=>old+9, ()=>old*10+d, ()=>Math.round(diff/9)];
      checkExtra = {variant, d, diff, ans: old};
    } else {
      const t = randInt(r, 4, 80);
      const u = randInt(r, 1, 8);   // 0 and 9 would make the answer ambiguous
      const old = 10*t + u;
      const diff = old - t;         // = 9t + u
      correct = old;
      prompt = `Nutrynus paskutinį skaičiaus skaitmenį, skaičius sumažėjo ${diff}. Koks buvo pradinis skaičius?`;
      explain = `Pradinis = 10 × likusio skaičiaus + paskutinis skaitmuo, todėl sumažėjimas = 9 × likusio + paskutinis skaitmuo. Dalijame ${diff} iš 9: liekana ${u} – tai paskutinis skaitmuo, o (${diff} − ${u}) ÷ 9 = ${t} – likęs skaičius. Pradinis: ${old}. Patikra: ${old} → ${t}, skirtumas ${diff}. ✓`;
      distractMakers = [()=>t, ()=>old-9, ()=>old+9, ()=>diff, ()=>Math.round(diff/9)];
      checkExtra = {variant, diff, ans: old};
    }
    const distract = uniqDistract(r, correct, distractMakers, 4);
    const q = makeMC({
      category:"aritmetika", subtopic:"aritm.skaitmenu_pertvarka", difficulty:5,
      prompt, correct, distract,
      firstStep:`Kas atsitinka skaičiui, kai gale prirašai (arba nutrini) skaitmenį? Palygink su dauginimu iš 10.`,
      hint:`Prirašius skaitmenį gale, skaičius padidėja devyniais savo dydžiais ir dar prirašytu skaitmeniu. Nutrynus – sumažėja devyniais likusio skaičiaus dydžiais ir dar nutrintu skaitmeniu. Čia raktas – skaičiaus 9 kartotiniai.`,
      explain, r
    });
    q._check = Object.assign({gen:"appendDigit"}, checkExtra);
    return q;
  },

  // ---- C10. Liekanos iš dviejų daliklių (brute-force smallest) ----
  remainderPuzzle(seed){
    const r = rng(seed);
    const [p, qd] = pick(r, [[3,5],[4,5],[3,7],[5,7],[5,6]]);
    const rp = randInt(r, 1, p - 1);
    const rq = randInt(r, 1, qd - 1);
    let ans = 0;
    for(let x = 1; x <= 2*p*qd; x++){
      if(x % p === rp && x % qd === rq){ ans = x; break; }
    }
    if(!ans || ans < 4) return GENERATORS.remainderPuzzle(seed + 1);
    // distractors: satisfy only ONE of the two conditions
    let onlyP = 0, onlyQ = 0;
    for(let x = rp; x <= 3*p*qd; x += p){ if(x > 0 && x % qd !== rq && x !== ans){ onlyP = x; break; } }
    for(let x = rq; x <= 3*p*qd; x += qd){ if(x > 0 && x % p !== rp && x !== ans){ onlyQ = x; break; } }
    const distract = uniqDistract(r, ans, [
      ()=>onlyP, ()=>onlyQ, ()=>ans + p*qd, ()=>rp + rq, ()=>rp * rq
    ], 4);
    // build the checking walk for the explanation
    const walk = [];
    for(let x = rp; x <= ans; x += p) walk.push(x);
    const q = makeMC({
      category:"aritmetika", subtopic:"aritm.dalumas", difficulty:5,
      prompt:`Mokytoja saldainius dalijo vaikams po ${p} – liko ${rp}. Pabandžius dalyti po ${qd} – liko ${rq}. Kiek MAŽIAUSIAI saldainių ji galėjo turėti?`,
      correct: ans, distract,
      firstStep:`Surašyk skaičius, kuriuos dalijant iš ${p} lieka ${rp}: ${rp}, ${rp + p}, ${rp + 2*p}, …`,
      hint:`Vieno sąrašo neužtenka – kiekvieną jo skaičių patikrink ir antrąja sąlyga: kokia liekana dalijant iš ${qd}? Pirmasis tinkantis abiem sąlygoms ir bus atsakymas.`,
      explain:`Skaičiai su liekana ${rp} dalijant iš ${p}: ${walk.join(", ")}${walk.length > 1 ? "" : ", …"}. Tikriname dalybą iš ${qd}: tinka pirmasis ${ans} (${ans} = ${Math.floor(ans/qd)}·${qd} + ${rq}).`,
      r
    });
    q._check = {gen:"remainderPuzzle", p, q: qd, rp, rq, ans};
    return q;
  },

  // ---- C11. Kubo išklotinė: priešingos sienos ----
  cubeNet(seed){
    const r = rng(seed);
    // cross net cells (col,row): top, then a strip of four, then bottom
    const CELLS = [[1,0],[0,1],[1,1],[2,1],[3,1],[1,2]];
    const OPP = [[0,5],[1,3],[2,4]];   // opposite-face index pairs when folded
    const nums = shuffle(r, [1,2,3,4,5,6]);
    const askIdx = randInt(r, 0, 5);
    const pair = OPP.find(pp => pp.includes(askIdx));
    const oppIdx = pair[0] === askIdx ? pair[1] : pair[0];
    const asked = nums[askIdx], ans = nums[oppIdx];
    const cell = 44;
    let rects = "";
    CELLS.forEach(([cx, cy], i) => {
      rects += `<rect x="${cx*cell}" y="${cy*cell}" width="${cell}" height="${cell}" fill="${i===askIdx?'#ffe6d8':'#fffaf0'}" stroke="#1d1d1f" stroke-width="2"/>`;
      rects += `<text x="${cx*cell + cell/2}" y="${cy*cell + cell/2 + 7}" text-anchor="middle" font-size="20" font-weight="700">${nums[i]}</text>`;
    });
    const figure = `<svg viewBox="0 0 ${4*cell+4} ${3*cell+4}" width="220" xmlns="http://www.w3.org/2000/svg"><g transform="translate(2,2)">${rects}</g></svg>`;
    const others = shuffle(r, nums.filter(v => v !== asked && v !== ans)).slice(0, 4);
    const opts = shuffle(r, [ans, ...others]).map(String);
    const strip = [nums[1], nums[2], nums[3], nums[4]];
    const q = {
      category:"erdve", subtopic:"erdve.projekcija", difficulty:4,
      prompt:`Iš šios išklotinės sulankstomas kubas. Kuris skaičius atsidurs priešais skaičių ${asked}?`,
      figure,
      options: opts,
      correctIndex: opts.indexOf(String(ans)),
      firstStep:`Keturi kvadratai eilėje susilankstys į „žiedą“ aplink kubą. Kurie du iš jų atsidurs vienas priešais kitą?`,
      hint:`Eilėje iš keturių priešingi yra kas antras: ${strip[0]}↔${strip[2]} ir ${strip[1]}↔${strip[3]}. Viršutinis ir apatinis kvadratai tampa kubo viršumi ir dugnu – jie irgi priešingi.`,
      explain:`Žiedas iš keturių: ${strip[0]}↔${strip[2]}, ${strip[1]}↔${strip[3]}. Viršus ir apačia: ${nums[0]}↔${nums[5]}. Priešais ${asked} – ${ans}.`,
    };
    q._check = {gen:"cubeNet", nums, askIdx, ans};
    return q;
  },

  // ---- C12. Nutrintas skaičius pagal vidurkį ----
  erasedAverage(seed){
    const r = rng(seed);
    const n = randInt(r, 9, 20);
    const S = n*(n+1)/2;
    const cands = [];
    for(let x = 1; x <= n; x++) if((S - x) % (n - 1) === 0) cands.push(x);
    if(!cands.length) return GENERATORS.erasedAverage(seed + 1);
    const x = pick(r, cands);
    const V = (S - x) / (n - 1);
    const distract = uniqDistract(r, x, [
      ()=>n - x + 1, ()=>x - 1, ()=>x + 1, ()=>V, ()=>n
    ], 4);
    const q = makeMC({
      category:"aritmetika", subtopic:"aritm.vidurkis", difficulty:5,
      prompt:`Ant lentos surašyti skaičiai nuo 1 iki ${n}. Vieną skaičių nutrynus, likusiųjų vidurkis lygus ${V}. Kuris skaičius nutrintas?`,
      correct: x, distract,
      firstStep:`Pirmiausia rask VISŲ skaičių nuo 1 iki ${n} sumą.`,
      hint:`Likusių ${n-1} skaičių suma = vidurkis × jų kiekis = ${V} × ${n-1}. Palygink su visų suma – skirtumas ir yra nutrintas skaičius.`,
      explain:`Visų suma: 1 + 2 + … + ${n} = ${S}. Likusiųjų suma: ${V} · ${n-1} = ${V*(n-1)}. Nutrintas: ${S} − ${V*(n-1)} = ${x}.`,
      r
    });
    q._check = {gen:"erasedAverage", n, V, ans: x};
    return q;
  },

  // ---- C13. Domino ant lentos su iškirptais langeliais (max matching) ----
  dominoMax(seed){
    const r = rng(seed);
    const [rows, cols] = pick(r, [[4,5],[4,6],[5,6],[6,6]]);
    const total = rows*cols;
    // remove two distinct cells; half the time both the SAME color (the trap)
    const sameColor = r() < 0.5;
    const all0 = [], all1 = [];
    for(let i = 0; i < rows; i++) for(let j = 0; j < cols; j++)
      ((i + j) % 2 === 0 ? all0 : all1).push([i, j]);
    let rem1, rem2;
    if(sameColor){
      const s = shuffle(r, all0); rem1 = s[0]; rem2 = s[1];
    } else {
      rem1 = pick(r, all0); rem2 = pick(r, all1);
    }
    const removed = (i, j) => (i === rem1[0] && j === rem1[1]) || (i === rem2[0] && j === rem2[1]);
    // max bipartite matching (Kuhn) between dark and light cells
    const idOf = (i, j) => i*cols + j;
    const adj = {};
    const blacks = [];
    let bCount = 0, wCount = 0;
    for(let i = 0; i < rows; i++) for(let j = 0; j < cols; j++){
      if(removed(i, j)) continue;
      if((i + j) % 2 === 0){
        bCount++;
        blacks.push([i, j]);
        adj[idOf(i, j)] = [];
        for(const [di, dj] of [[0,1],[0,-1],[1,0],[-1,0]]){
          const ni = i + di, nj = j + dj;
          if(ni < 0 || nj < 0 || ni >= rows || nj >= cols || removed(ni, nj)) continue;
          adj[idOf(i, j)].push(idOf(ni, nj));
        }
      } else wCount++;
    }
    const matchW = {};
    const tryAug = (b, seen) => {
      for(const w of adj[b]){
        if(seen.has(w)) continue;
        seen.add(w);
        if(matchW[w] === undefined || tryAug(matchW[w], seen)){ matchW[w] = b; return true; }
      }
      return false;
    };
    let ans = 0;
    for(const [i, j] of blacks) if(tryAug(idOf(i, j), new Set())) ans++;
    const naive = (total - 2) / 2;   // "plotas ÷ 2" trap
    const cell = 30;
    let cellsSvg = "";
    for(let i = 0; i < rows; i++) for(let j = 0; j < cols; j++){
      const isRem = removed(i, j);
      cellsSvg += `<rect x="${j*cell}" y="${i*cell}" width="${cell}" height="${cell}" fill="${isRem ? '#5a5a60' : ((i+j)%2 ? '#fffaf0' : '#ffe6d8')}" stroke="#1d1d1f" stroke-width="1.4"/>`;
      if(isRem) cellsSvg += `<text x="${j*cell+cell/2}" y="${i*cell+cell/2+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">✗</text>`;
    }
    const figure = `<svg viewBox="0 0 ${cols*cell+6} ${rows*cell+6}" width="${Math.min(cols*cell+6, 250)}" xmlns="http://www.w3.org/2000/svg"><g transform="translate(3,3)">${cellsSvg}</g></svg>`;
    const bT = sameColor ? bCount : Math.min(bCount, wCount);
    const wT = sameColor ? wCount : Math.max(bCount, wCount);
    const distract = uniqDistract(r, ans, [
      ()=>naive, ()=>ans+1, ()=>ans-1, ()=>total/2, ()=>ans-2
    ], 4);
    const q = makeMC({
      category:"logika", subtopic:"logika.zingsniai", difficulty:5,
      prompt:`Iš ${rows}×${cols} langelių lentos iškirpti du langeliai (pažymėti ✗). Kiek DAUGIAUSIAI 1×2 domino kortelių galima sudėti ant likusios lentos? (Kortelė dengia du gretimus langelius; kortelės nesidengia.)`,
      figure,
      correct: ans, distract,
      firstStep:`Lenta jau nuspalvinta dviem spalvomis. Kiek langelių dengia viena domino kortelė kiekvienos spalvos?`,
      hint:`Kiekviena kortelė VISADA dengia vieną tamsų ir vieną šviesų langelį. Suskaičiuok, kiek liko tamsių ir kiek šviesių – daugiau kortelių nei mažesnysis skaičius padėti neįmanoma.`,
      explain:sameColor
        ? `Iškirpti abu TOS PAČIOS spalvos langeliai: liko ${Math.min(bT,wT)} vienos spalvos ir ${Math.max(bT,wT)} kitos spalvos langelių. Kiekviena kortelė dengia po vieną kiekvienos spalvos langelį, todėl daugiau nei ${Math.min(bT,wT)} kortelių padėti neįmanoma – nors laisvų langelių ${total-2} ir atrodo, kad tilptų ${naive}. Atsakymas: ${ans}.`
        : (ans === naive
          ? `Iškirpti SKIRTINGŲ spalvų langeliai: liko po ${Math.min(bT,wT)} kiekvienos spalvos. Šįkart visus likusius ${total-2} langelius pavyksta uždengti poromis: ${total-2} ÷ 2 = ${ans} ${pluralForm(ans,'kortelė','kortelės','kortelių')}.`
          : `Liko po ${Math.min(bT,wT)} kiekvienos spalvos langelių, bet lentos forma leidžia sudėti tik ${ans} ${pluralForm(ans,'kortelę','korteles','kortelių')}.`),
      r
    });
    q._check = {gen:"dominoMax", rows, cols, rem1, rem2, ans, bCount, wCount};
    return q;
  },

};

/* ============================================================
   IV. PAGALBINĖ FUNKCIJA: pakeičia generatoriaus rezultatą į standartinį klausimą
   ============================================================ */
function makeMC({category, subtopic, difficulty, prompt, correct, distract, suffix, figure, hint, firstStep, explain, r}){
  suffix = suffix || "";
  // Pad distractors with safe nearby values if generator produced fewer than 4
  // unique alternatives.
  const seen = new Set([correct, ...distract]);
  let pad = 1;
  while(distract.length < 4 && pad < 50){
    const candA = correct + pad;
    const candB = correct - pad;
    if(!seen.has(candA) && Number.isFinite(candA) && candA >= 0){ distract.push(candA); seen.add(candA); }
    if(distract.length < 4 && !seen.has(candB) && Number.isFinite(candB) && candB >= 0){
      distract.push(candB); seen.add(candB);
    }
    pad++;
  }
  const all = [correct, ...distract.slice(0,4)];
  // numbers print with the Lithuanian decimal comma (2,5 val., not 2.5)
  const lab = v => `${typeof v === "number" ? String(v).replace(".", ",") : v}${suffix}`;
  const labels = all.map(lab);
  const shuffled = shuffle(r, labels);
  const correctIndex = shuffled.indexOf(lab(correct));
  return {
    category, subtopic, difficulty, prompt, figure: figure||null,
    options: shuffled, correctIndex, hint, firstStep, explain
  };
}

function buildQuestionFromKey(genKey, seed){
  const q = GENERATORS[genKey](seed);
  q.id = `${genKey}#${seed}`;
  q.gen = genKey;
  return q;
}

function generateQuiz(count, allowedDifficulties){
  // Filter eligible generators up front and adapt the per-generator cap to
  // the pool size – otherwise a narrow difficulty selection (e.g. only
  // 5-point) can't fill the requested count and silently returns fewer.
  const rand = rng(Date.now() & 0x7fffffff);
  const eligible = allowedDifficulties
    ? GENERATOR_KEYS.filter(k => allowedDifficulties.includes(getGenDiff(k)))
    : GENERATOR_KEYS.slice();
  const pool = eligible.length ? eligible : GENERATOR_KEYS;
  const cap = Math.max(2, Math.ceil(count / pool.length) + 1);
  const used = {};
  const out = [];
  let safety = 0;
  while(out.length < count && safety++ < count*40){
    const key = pick(rand, pool);
    used[key] = used[key] || 0;
    if(used[key] >= cap) continue;
    const seed = randInt(rand, 1, 9999999);
    out.push(buildQuestionFromKey(key, seed));
    used[key]++;
  }
  return out;
}

/* ---- Profiles: several kids on one device ----
   kengura_meta = {profiles:[{id,name}], active}. The default profile
   (id "") keeps the legacy key so existing saves stay where they are;
   others live under kengura_v1_<id>. */
const LS_META = "kengura_meta";
function loadMeta(){
  try { const m = JSON.parse(localStorage.getItem(LS_META) || "null"); if(m && Array.isArray(m.profiles)) return m; } catch(_){}
  return {profiles:[{id:"", name:""}], active:""};
}
function saveMeta(m){ try { localStorage.setItem(LS_META, JSON.stringify(m)); } catch(_){} }
function storeKeyFor(id){ return id ? `kengura_v1_${id}` : "kengura_v1"; }
const META = loadMeta();
if(!META.profiles.some(p => p.id === META.active)) META.active = "";
const LS_KEY = storeKeyFor(META.active);
function activeProfileName(){ const p = META.profiles.find(x => x.id === META.active); return (p && p.name) || ""; }
function switchProfile(id){
  if(!META.profiles.some(p => p.id === id)) return;
  saveStore(store);
  META.active = id; saveMeta(META);
  location.reload();
}
function addProfile(name){
  name = String(name || "").trim().slice(0, 24);
  if(!name) return;
  const id = `${Date.now().toString(36)}${Math.floor(Math.random()*1e4).toString(36)}`;
  META.profiles.push({id, name}); saveMeta(META);
  switchProfile(id);
}
function deleteProfile(id){
  if(!id) return;   // the default profile cannot be deleted
  if(id === META.active) _storeFrozen = true;   // no unload save of the deleted profile
  META.profiles = META.profiles.filter(p => p.id !== id);
  try { localStorage.removeItem(storeKeyFor(id)); } catch(_){}
  if(META.active === id) META.active = "";
  saveMeta(META);
  location.reload();
}

    contests:[],       // [{when, year, points, scoreWithPenalty, maxPoints, correct, total, answered, byBand}]
    contestInProgress:null, // {year, answers, current, startedAt, endsAt} – survives a reload mid-contest
    settings:{count:15, difficulties:[3,4,5], useTimer:true, kenguraMode:false, negativeScore:false, askConfidence:false, sound:true},
    streak:{count:0, lastDay:null, freezesUsed:0, freezeMonth:null},
    // Star economy – motivational reward currency.
    // total = fromQ + fromTime; spent = shop purchases; _timeSecRem carries sub-minute remainder.
    // fromBonus = daily-plan / perfect-session / mastery bonuses.
    stars:{total:0, fromQ:0, fromTime:0, fromBonus:0, spent:0, _timeSecRem:0},

    // the daily plan – a race without the 5-question gate.
    games:{plays:0, bestByDiff:{easy:0, medium:0, hard:0}, best:0, hardUnlocked:false, freeRaces:0, jumpPlays:0, jumpBest:0},
    // Unlocked achievements: { achievementId: timestamp }
    achievements:{},
    // Treniruočių planas – contest date + per-day session completion.
    // contestWeekday: 0 = Sunday … 6 = Saturday – the weekly contest-sim day.
    // weeklyStarGoal / weeklyReward: parent-set goal tied to a real reward.
    // trainingDays: weekdays (0 = Sunday) the kid trains; streak, plan and
    // contest cadence skip the others.
    plan:{contestDate:null, contestWeekday:6, weeklyStarGoal:150, weeklyReward:"", trainingDays:[0,1,2,3,4,5,6]},
    planDone:{},       // { "YYYY-MM-DD": {warmup, core, cooldown, bonus} }
    // Freshness marker for practice pickers: { "year-num": lastSeenTs }
    seenQ:{},
    // Per-band mastery + playlist attempt bookkeeping (step-down / parking)
    masteredBand:{},   // { mech: highestBandPassed }
    mistakes:{},       // mistakes notebook (noteMistake)
    mechAttempts:{},   // { mech: { band: {fails, lastAt} } }
    // Windowed error rate: { mech: [0,1,...] } last ≤10 attempts (1 = wrong)
    mechRecent:{},
    // Mechanic-recognition drill totals.
    recogStats:{attempts:0, correct:0},
    // Recognition-drill freshness: { "year-num": lastShownTs }
    recogSeen:{},
    // Star shop: race-game cosmetics bought with stars.
    shop:{activeColor:"classic", colors:["classic"], night:false, nightOn:false}
  };
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaults;
    const o = JSON.parse(raw);
    o.sessions = o.sessions || [];
    o.catStats = o.catStats || {};
    o.subStats = o.subStats || {};
    o.mechStats = o.mechStats || {};
    o.dueQueue = o.dueQueue || {};
    o.masteredMech = o.masteredMech || {};
    o.confStats = o.confStats || defaults.confStats;
    for(const c of ["a","b","c"]){
      o.confStats[c] = o.confStats[c] || {attempts:0, wrong:0};
    }
    o.activity = o.activity || {};
    o.contests = o.contests || [];
    o.contestInProgress = o.contestInProgress || null;
    o.settings = Object.assign({}, defaults.settings, o.settings || {});
    o.streak = Object.assign({}, defaults.streak, o.streak || {});
    o.stars = Object.assign({}, defaults.stars, o.stars || {});
    o.games = Object.assign({}, defaults.games, o.games || {});
    o.games.bestByDiff = Object.assign({}, defaults.games.bestByDiff, o.games.bestByDiff || {});
    o.achievements = o.achievements || {};
    o.plan = Object.assign({}, defaults.plan, o.plan || {});
    if(!Array.isArray(o.plan.trainingDays) || o.plan.trainingDays.length < 2) o.plan.trainingDays = [0,1,2,3,4,5,6];
    o.planDone = o.planDone || {};
    o.seenQ = o.seenQ || {};
    o.masteredBand = o.masteredBand || {};
    o.mistakes = o.mistakes || {};   // mistakes notebook: { "year-num": {year, num, times, lastWrong, fixedAt} }
    o.mechAttempts = o.mechAttempts || {};

    return o;
  }catch(e){
    // unreadable save: keep a copy before anything overwrites it (a parent

    try {
      const raw = localStorage.getItem(LS_KEY);
      if(raw) localStorage.setItem(`${LS_KEY}_corrupt_${new Date().toISOString().slice(0, 10)}`, raw);
    } catch(_){}
    return defaults;
  }
}

function todayKey(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${da}`;
}
// Local calendar arithmetic (stepping back 24 h skips a day across DST)
function localDayNum(){
  const d = new Date();
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / ONE_DAY_MS);
}
function dateKeyOffset(daysBack){
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() - daysBack);
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${da}`;
}
function monthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function daysSinceLastActivity(){
  // Returns null if no activity ever recorded.
  const keys = Object.keys(store.activity || {});
  if(!keys.length) return null;
  keys.sort();
  const last = keys[keys.length - 1];
  // crude day delta (ok for our purposes – DST/timezone differences off by ≤1 day)
  const [y,m,d] = last.split('-').map(Number);
  const lastTs = Date.UTC(y, m-1, d);
  const now = new Date();
  const nowTs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowTs - lastTs) / (24*60*60*1000));
}

// Update streak when the kid actually answers something today.
// Rules:
//   * same day as lastDay → no change
//   * yesterday → count++
//   * gap of 1 day (i.e. missed yesterday) → use a freeze (max 2/month) and count++
//   * larger gap → streak resets to 1
/* Training days between the last active day and today (+1): 1 = yesterday,
   rest days don't count. Shared by the bump and the live display. */
function streakGap(lastDay, today){
  const [ly,lm,ld] = lastDay.split('-').map(Number);
  const [ty,tm,td] = today.split('-').map(Number);
  const lastTs = Date.UTC(ly, lm-1, ld);
  const todayTs = Date.UTC(ty, tm-1, td);
  const calGap = Math.round((todayTs - lastTs) / ONE_DAY_MS);
  let missed = 0;
  for(let i = 1; i < calGap && i < 400; i++){
    const wd = new Date(lastTs + i * ONE_DAY_MS).getUTCDay();
    if(((store.plan && store.plan.trainingDays) || [0,1,2,3,4,5,6]).includes(wd)) missed++;
  }
  return calGap <= 0 ? calGap : missed + 1;
}
/* The streak as the kid should see it today: still alive if the next answer
   would continue it, 0 if it would restart (the stored count only resets on
   that next answer – showing "🔥 12" to a kid back after a week is a lie). */
function liveStreak(){
  const s = store.streak || {};
  if(!s.lastDay || !s.count) return 0;
  const today = todayKey();
  if(s.lastDay === today) return s.count;
  const gap = streakGap(s.lastDay, today);
  const freezesLeft = s.freezeMonth === monthKey() ? (s.freezesUsed || 0) < 2 : true;
  return gap <= 1 || (gap === 2 && freezesLeft) ? s.count : 0;
}
function bumpStreakForToday(){
  const today = todayKey();
  const s = store.streak;
  if(s.lastDay === today) return;
  // Reset the freeze counter at the start of a new month
  const mk = monthKey();
  if(s.freezeMonth !== mk){
    s.freezeMonth = mk;
    s.freezesUsed = 0;
  }
  if(!s.lastDay){
    s.count = 1;
    s.lastDay = today;
    return;
  }
  // Gap = missed TRAINING days + 1, so a weekend-off kid keeps the streak
  // across Saturday/Sunday. Calendar days that are not training days are
  // skipped; the day the kid answers on always counts.
  const gap = streakGap(s.lastDay, today);
  if(gap === 1){
    s.count++;
  } else if(gap === 2 && s.freezesUsed < 2){
    s.freezesUsed++;
    s.count++;   // a single missed day, freeze covers it
  } else if(gap >= 2){
    s.count = 1; // reset
  }
  s.lastDay = today;
}

/* Stars for one answered question. Effort always pays 1; a correct
   4-pointer pays 2 and a correct 5-pointer pays 3 – the contest's hard
   block is where the stars are, exactly like the real paper. */
function starsForAnswer(correct, band){
  if(!correct) return 1;
  if(band >= 5) return 3;
  if(band === 4) return 2;
  return 1;
}

function logActivity(correct, band){
  const k = todayKey();
  const a = store.activity[k] = store.activity[k] || {answered:0, correct:0};
  a.answered++;
  if(correct) a.correct++;
  // per-band tally for the parent view (accuracy by block over the last weeks)
  const bb = a.byBand = a.byBand || {};
  const slot = bb[band || 3] = bb[band || 3] || {a:0, ok:0};
  slot.a++; if(correct) slot.ok++;
  bumpStreakForToday();
  const n = starsForAnswer(correct, band || 3);
  awardStars("fromQ", n);
  Fx.floatStars(n);
  // Combo: consecutive correct answers in a session. Cheers at 3, 5 and
  // every 10 – small, frequent wins for an 11-year-old.
  state._combo = correct ? (state._combo || 0) + 1 : 0;
  if(correct && (state._combo === 3 || state._combo === 5 || (state._combo >= 10 && state._combo % 10 === 0))){
    showToast("🔥", `${state._combo} iš eilės!`, 2200);
    Sfx.play("star");
  }
  checkAchievements();      // badge toasts should fire right away, not on the next heartbeat
}

/* ============================================================
   STAR ECONOMY – motivational currency.
   Earned three ways:
     • fromQ     – 1–3 per question answered (via logActivity)
     • fromTime  – +1 per full minute of active app use (heartbeat)
     • fromBonus – daily plan finished (+10), perfect session (+5),
                   mechanic mastered (+5)
   total is always the sum; we keep the parts for the breakdown.
   Each day's stars are also logged in store.activity[day].stars so the
   weekly goal and the Sunday recap can add them up.
   ============================================================ */
function awardStars(kind, n){
  if(!store.stars) store.stars = {total:0, fromQ:0, fromTime:0, fromBonus:0, _timeSecRem:0};
  store.stars[kind] = (store.stars[kind] || 0) + n;
  store.stars.total = (store.stars.fromQ || 0) + (store.stars.fromTime || 0) + (store.stars.fromBonus || 0);
  const k = todayKey();
  const a = store.activity[k] = store.activity[k] || {answered:0, correct:0};
  a.stars = (a.stars || 0) + n;
  // logActivity already triggers a saveStore via its callers; the time
  // heartbeat saves on its own throttle. No save here to avoid churn.
}

/* Bonus stars with a visible celebration – used for plan completion,
   perfect sessions and mastery. */
function awardBonus(n, reason){
  awardStars("fromBonus", n);
  Fx.floatStars(n);
  if(reason) showToast("⭐", `${escapeHTML(reason)} <b>+${n} ⭐</b>`);
  saveStore(store);
}

/* Monday-based week key, e.g. "2026-W41-start:2026-10-05". We only need
   the Monday date so the recap/goal can sum activity days. */
function mondayOf(dateObj){
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const dow = (d.getDay() + 6) % 7;   // Monday = 0
  d.setDate(d.getDate() - dow);
  return d;
}
function dateKeyOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
/* Activity rows for a Monday→Sunday week. weeksBack = 0 → current week. */
function weekActivity(weeksBack){
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() - 7 * (weeksBack || 0));
  const rows = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    const k = dateKeyOf(d);
    rows.push({key:k, date:d, a: store.activity[k] || null});
  }
  return rows;
}
function starsThisWeek(){
  return weekActivity(0).reduce((s, r) => s + ((r.a && r.a.stars) || 0), 0);
}

/* ============================================================
   SOUND + VISUAL EFFECTS
   WebAudio synth only – no audio files, nothing to load. Every call is a
   no-op when sound is off in settings, when the browser has no
   AudioContext (smoke test), or when the context can't start yet (first
   call must come from a user gesture – every play() below is wired to a
   click, so that is always the case in practice).
   The contest simulator stays silent on purpose except for the single
   5-minute warning, which a real proctor would give too.
   ============================================================ */
const Sfx = (()=>{
  let ctx = null;
  function ac(){
    if(ctx) return ctx;
    const AC = (typeof window !== "undefined") && (window.AudioContext || window.webkitAudioContext);
    if(!AC) return null;
    // Browsers refuse audio before the first user gesture (and log a warning
    // when a context is created too early) – e.g. the retroactive badge
    // toast at load. Wait for a gesture; the next click will create it.
    if(typeof navigator !== "undefined" && navigator.userActivation && !navigator.userActivation.hasBeenActive) return null;
    try { ctx = new AC(); } catch(_){ return null; }
    return ctx;
  }
  function enabled(){
    return !!(store && store.settings && store.settings.sound !== false);
  }
  // [freq, startSec, durSec, type?, gain?]
  const BANK = {
    correct: [[523,0,.09],[659,.09,.09],[784,.18,.2]],
    wrong:   [[196,0,.16,"triangle",.09],[165,.14,.26,"triangle",.09]],
    star:    [[1046,0,.07,"sine",.07],[1318,.07,.1,"sine",.07]],
    badge:   [[523,0,.11],[659,.11,.11],[784,.22,.11],[1046,.33,.32]],
    mastery: [[392,0,.12],[523,.12,.12],[659,.24,.12],[784,.36,.12],[1046,.48,.45]],
    plan:    [[659,0,.1],[784,.1,.1],[988,.2,.1],[1318,.3,.4]],
    warn:    [[440,0,.14,"square",.06],[440,.24,.14,"square",.06],[440,.48,.3,"square",.06]],
    crash:   [[120,0,.2,"sawtooth",.1],[80,.1,.25,"sawtooth",.08]],
    gameover:[[392,0,.18],[330,.18,.18],[262,.36,.4]],
    click:   [[880,0,.04,"sine",.04]],
    tick:    [[1200,0,.03,"square",.03]],
  };
  function play(name){
    if(!enabled()) return;
    const notes = BANK[name]; if(!notes) return;
    const c = ac(); if(!c) return;
    try {
      if(c.state === "suspended") c.resume();
      const t0 = c.currentTime + 0.01;
      for(const [freq, at, dur, type, gain] of notes){
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        const vol = gain == null ? 0.11 : gain;
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t0 + at);
        o.stop(t0 + at + dur + 0.02);
      }
    } catch(_){ /* audio is decoration – never let it break the app */ }
  }
  return {play, enabled};
})();

/* Visual micro-feedback: floating "+n ⭐" and a confetti burst. Pure DOM +
   CSS keyframes, removed after the animation. */
const Fx = (()=>{
  function host(){
    if(typeof document === "undefined") return null;
    let h = document.getElementById("fxHost");
    if(!h){
      h = document.createElement("div");
      h.id = "fxHost";
      h.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden";
      document.body.appendChild(h);
    }
    return h;
  }
  function floatStars(n){
    if(!n) return;
    try {
      const h = host(); if(!h) return;
      const el = document.createElement("div");
      el.className = "fx-star";
      el.textContent = `+${n} ⭐`;
      h.appendChild(el);
      setTimeout(()=> el.remove(), 1500);
    } catch(_){}
  }
  function confetti(count){
    try {
      // "reduce motion" in the OS: no falling confetti (the sound and toast stay)
      if(typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const h = host(); if(!h) return;
      const colors = ["#d6451a","#f0b429","#1a7f4a","#1a5fa3","#9b59b6","#ff7ab6"];
      const n = count || 48;
      for(let i = 0; i < n; i++){
        const p = document.createElement("span");
        p.className = "fx-confetti";
        p.style.left = `${Math.random()*100}%`;
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = `${Math.random()*0.5}s`;
        p.style.animationDuration = `${1.6 + Math.random()*1.2}s`;
        p.style.transform = `rotate(${Math.random()*360}deg)`;
        p.style.width = `${6 + Math.random()*6}px`;
        p.style.height = `${8 + Math.random()*8}px`;
        h.appendChild(p);
        setTimeout(()=> p.remove(), 3200);
      }
    } catch(_){}
  }
  /* Big moment = sound + confetti together. */
  function celebrate(kind){
    Sfx.play(kind || "mastery");
    confetti();
  }
  return {floatStars, confetti, celebrate};
})();

// Stars the kid can still spend in the shop (earned minus spent).
function starsAvailable(){
  const s = store.stars || {};
  return Math.max(0, (s.total || 0) - (s.spent || 0));
}
function spendStars(n){
  if(starsAvailable() < n) return false;
  store.stars.spent = (store.stars.spent || 0) + n;
  saveStore(store);
  return true;
}

// Active-time heartbeat: accrue seconds only while the tab is visible, so
// a kid can't farm stars by leaving the page open. Every full minute → 1 star.
const STAR_TIME_TICK_SEC = 20;
// Views where a minute counts as practice. Home, plan, parent view and
// the reward games earn nothing per minute – a kid will try leaving the
// tab open.
const STAR_TIME_VIEWS = new Set(["quiz", "playlist", "recog", "think", "recall", "archiveYear", "contest", "raceChallenge", "results", "contestResults"]);
let _lastStarSaveAt = 0;
// Minute stars stop after this long without a tap, key or scroll – a results
// page left open on the table is not learning time.
const STAR_IDLE_MS = 5 * 60000;
let _lastInputAt = Date.now();
const BREAK_NUDGE_SEC = 30 * 60;
function startStarTimeHeartbeat(){
  if(typeof document !== "undefined" && document.addEventListener){
    for(const ev of ["pointerdown", "keydown", "scroll", "touchstart"])
      document.addEventListener(ev, ()=>{ _lastInputAt = Date.now(); }, {passive: true, capture: true});
  }
  setInterval(()=>{
    if(typeof document !== "undefined" && document.hidden) return;
    if(!STAR_TIME_VIEWS.has(state.view)) return;   // parked on the home page ≠ learning
    if(Date.now() - _lastInputAt > STAR_IDLE_MS) return;
    const s = store.stars;
    s._timeSecRem = (s._timeSecRem || 0) + STAR_TIME_TICK_SEC;
    // active seconds per day – the parent view shows minutes, not just counts
    { const a = store.activity[todayKey()] = store.activity[todayKey()] || {answered:0, correct:0}; a.sec = (a.sec || 0) + STAR_TIME_TICK_SEC;
      // ~30 active minutes: one quiet nudge a day (never inside a timed paper or test) –
      // attention at 11–12 fades, and spacing beats one long session
      if(a.sec >= BREAK_NUDGE_SEC && !a.breakNudged && state.view !== "contest" && state.view !== "quiz"){
        a.breakNudged = true;
        showToast("🧠", "Jau pusvalandis treniruotės. Užbaik šį uždavinį ir padaryk pertrauką – pailsėjusi galva įsimena geriau.", 7000);
      }
    }
    let gained = 0;
    while(s._timeSecRem >= 60){ s._timeSecRem -= 60; gained++; }
    if(gained){
      awardStars("fromTime", gained);
      checkAchievements();
    }
    // Throttle persistence to ~once a minute.
    const now = Date.now();
    if(now - _lastStarSaveAt > 60000){ _lastStarSaveAt = now; saveStore(store); }
  }, STAR_TIME_TICK_SEC * 1000);
  // Flush on tab hide / unload so accrued stars aren't lost.
  if(typeof document !== "undefined"){
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveStore(store); });
    window.addEventListener("beforeunload", ()=> saveStore(store));
  }
}

// Mastery decay: a mechanic flagged mastered > N days ago is "stale".
// Used to show a "Pakartoti" CTA in the playlist menu.
// With a contest date set the window shrinks to 4 weeks: in a 90-day prep
// a mechanic learned in week 2 must be re-checked well before the paper.
const MASTERY_DECAY_DAYS = 60;
const MASTERY_DECAY_DAYS_PREP = 28;
function masteryDecayDays(){
  const d = daysToContest();
  return (d != null && d >= 0) ? MASTERY_DECAY_DAYS_PREP : MASTERY_DECAY_DAYS;
}
function mechMasteryAgeDays(mech){
  const t = (store.masteredMech || {})[mech];
  if(!t) return null;
  return Math.floor((Date.now() - t) / (24*60*60*1000));
}
function isMechMasteryStale(mech){
  const age = mechMasteryAgeDays(mech);
  return age !== null && age >= masteryDecayDays();
}

/* Spaced-repetition intervals (in days). Each consecutive correct answer
   bumps the streak; a wrong answer resets streak to 0 and re-queues the
   question for tomorrow. */

const ONE_DAY_MS = 24 * 60 * 60 * 1000;

/* Mistakes notebook (Klaidų sąsiuvinis): every archive question ever
   answered wrong stays listed – unlike the review queue, which forgets an
   item once it graduates. A later right answer marks it fixed. */

function noteMistake(year, q, correct){
  store.mistakes = store.mistakes || {};
  const key = `${year}-${q.num}`;
  const m = store.mistakes[key];
  if(!correct){
    const e = store.mistakes[key] = m || {year: String(year), num: q.num, times: 0, first: Date.now()};
    e.times++; e.lastWrong = Date.now(); delete e.fixedAt;
    delete e.reason;   // a new slip gets its own "why?" – the counts in e.reasons stay

    // also runs while a playlist records its answers in bulk, so no sound)
    if((m.times || 0) >= 2){ try { showToast("🩹", `Įveikei uždavinį, kuriame klydai ${m.times} ${pluralForm(m.times,'kartą','kartus','kartų')}. Taip ir mokomasi.`, 4000); } catch(_){} }
  }

function recordArchiveAnswer(year, q, correct, confidence){
  logActivity(correct, q.points || 3);
  // Freshness marker – practice pickers avoid recently seen questions.
  store.seenQ[`${year}-${q.num}`] = Date.now();
  noteMistake(year, q, correct);
  // Confidence stats (independent of mechanic)
  if(confidence && store.confStats[confidence]){
    store.confStats[confidence].attempts++;
    if(!correct) store.confStats[confidence].wrong++;
  }
  const mech = q.mechanic;
  if(!mech){ saveStore(store); return; }
  const band = q.points || 3;
  const ms = store.mechStats[mech] = store.mechStats[mech] || {};
  const slot = ms[band] = ms[band] || {attempts:0, wrong:0};
  slot.attempts++;
  if(!correct) slot.wrong++;
  // Rolling window (last ≤10) so an old bad streak doesn't haunt the stats.
  const recent = store.mechRecent[mech] = store.mechRecent[mech] || [];
  recent.push(correct ? 0 : 1);
  if(recent.length > 10) recent.shift();

  const key = `${year}-${q.num}`;
  const now = Date.now();
  const existing = store.dueQueue[key];
  // Only MISTAKES enter the queue. A first-time correct answer is done –
  // scheduling every right answer flooded the queue and ate the daily
  // core (see _plan_sim.cjs). Correct answers to queued items advance them.
  if(correct && !existing){ saveStore(store); return; }
  let nextStreak;
  if(correct){
    nextStreak = (existing.streak || 0) + 1;
  } else {
    nextStreak = 0;
  }
  // If they got it right at the highest streak – graduate (remove from queue).
  if(correct && nextStreak >= SR_INTERVALS_DAYS.length){
    delete store.dueQueue[key];
  } else {
    const intervalDays = SR_INTERVALS_DAYS[Math.min(nextStreak, SR_INTERVALS_DAYS.length-1)];
    store.dueQueue[key] = {
      year, num:q.num, mech, band,
      dueAt: now + intervalDays * ONE_DAY_MS,
      streak: nextStreak,
      // "Tikrai žinau" + wrong = a misconception, not a lapse – priority review
      confWrong: (!correct && confidence === "a") || undefined,
      fromContest: (existing && existing.fromContest) || undefined,   // stays warm-up material
    };
  }
  saveStore(store);
}

/* Return a list of due questions (whose dueAt < now), newest dueAt first. */
/* Paper mistakes beyond the 3 a paper queues (and any mistake that left the
   queue unfixed) wait in the notebook. Once a day, when fewer than 3
   reviews are due, up to 2 such mistakes older than 3 days join the
   warm-up review (fromContest = warm-up only, never a whole review day). */
function topUpQueueFromNotebook(){
  const day = todayKey();
  store.plan = store.plan || {};
  if(store.plan.notebookTopUp === day) return 0;
  store.plan.notebookTopUp = day;
  const dueCount = Object.values(store.dueQueue).filter(d => d.dueAt <= Date.now()).length;
  if(dueCount >= 3) return 0;
  const cutoff = Date.now() - 3 * ONE_DAY_MS;
  const reserved = new Set(reservedYears().map(String));
  const pick = Object.entries(store.mistakes || {})
    .filter(([k, m]) => !m.fixedAt && !store.dueQueue[k] && (m.lastWrong || 0) < cutoff && !reserved.has(String(m.year)))
    .sort((a, b) => (a[1].lastWrong || 0) - (b[1].lastWrong || 0))
    .slice(0, 2);
  for(const [k, m] of pick){
    const t = ARCHIVE.find(t => String(t.year) === String(m.year));
    const q = t && t.questions.find(q => q.num === m.num);
    if(!q || !q.mechanic) continue;
    store.dueQueue[k] = {year: String(m.year), num: q.num, mech: q.mechanic, band: q.points || 3, dueAt: Date.now(), streak: 0, fromContest: true};
  }
  if(pick.length) saveStore(store);
  return pick.length;
}

function dueNow(){
  const now = Date.now();
  const out = [];
  for(const k of Object.keys(store.dueQueue)){
    const item = store.dueQueue[k];
    if(item.dueAt <= now) out.push(item);
  }
  // Confident-wrong items first (misconceptions beat lapses), then oldest due.
  out.sort((a,b)=> (b.confWrong?1:0) - (a.confWrong?1:0) || a.dueAt - b.dueAt);
  return out;
}

/* Weakest mechanics: those with >= 2 attempts and worst error rate. */
function weakestMechanics(limit){
  limit = limit || 5;
  const rows = [];
  for(const m of Object.keys(store.mechStats)){
    const bands = store.mechStats[m];
    let attempts = 0, wrong = 0;
    for(const b of [3,4,5]){
      if(!bands[b]) continue;
      attempts += bands[b].attempts;
      wrong += bands[b].wrong;
    }
    if(attempts < 2) continue;
    // Prefer the rolling window when it has enough signal – a rough first
    // week shouldn't dominate the stats after the kid improves.
    const recent = (store.mechRecent || {})[m];
    const useWindow = recent && recent.length >= 4;
    const showWrong = useWindow ? recent.reduce((a,x)=>a+x,0) : wrong;
    const showAttempts = useWindow ? recent.length : attempts;
    const rate = showWrong / showAttempts;
    rows.push({mech:m, attempts, wrong, rate, showWrong, showAttempts});
  }
  rows.sort((a,b)=>b.rate - a.rate);
  return rows.slice(0, limit);
}

/* Hand-authored learning track, ordered by CONTEST VALUE: the mechanics
   the 5-point block is made of come first (casework alone is 17 of the 99
   archive 5-pointers), then 4-point-only topics, then 3-point-only ones
   that sprints and generated quizzes already cover. Prerequisites are
   kept: counting-ways before arrangement, invariant before state-game,
   place-value / digit-properties before digit-puzzle.
   (The old easy-first order left casework, truth-tellers, invariant and
   logic-clues for weeks 10+, which the simulator showed a kid never
   reaches.) */
const MECHANIC_ORDER = [
  // 5-pt bearing, by weight
  "casework","counting-ways","weighing","truth-tellers","cube-color",
  "place-value","digit-properties","digit-puzzle","logic-clues","tiling",
  "invariant","mixture-fraction","area-decomp","cube-net","divisibility",

/* Per-band mastery. store.masteredBand[mech] = highest band passed;
   store.masteredMech[mech] (timestamp) means FULL mastery = the top band
   the archive has for that mechanic. Old saves with masteredMech only are
   read as full mastery. */
function mechTopBand(mech){
  // Highest band with enough questions for a mastery check (≥ 2).
  const bands = [3,4,5].filter(b => archiveQsForMech(mech, b).length >= 2);
  return bands.length ? bands[bands.length - 1] : 0;
}
function masteredBandOf(mech){
  const b = (store.masteredBand || {})[mech];
  if(b) return b;
  return (store.masteredMech || {})[mech] ? mechTopBand(mech) : 0;
}
/* Where the plan should take a mechanic next:
     { mech, band }  – band to attempt (steps down after 2 fails at a band)
     null            – nothing to do (mastered at target, or parked)
   Foundation caps the target at band 4: the easy phase builds the
   mechanic on 4-pointers, build/taper come back for the 5-pointer. */
const MECH_FAILS_BEFORE_STEPDOWN = 2;
const MECH_PARK_DAYS = 7;
function mechTargetFor(mech, phase){
  // A band counts only with ≥ 2 questions: the mastery check needs at
  // least two items, otherwise it can never pass.
  const bands = [3,4,5].filter(b => archiveQsForMech(mech, b).length >= 2);
  if(!bands.length) return null;
  let target = bands[bands.length - 1];
  if((phase || planPhase()) === "foundation" && target === 5 && bands.includes(4)) target = 4;
  if(masteredBandOf(mech) >= target) return null;
  const fails = ((store.mechAttempts || {})[mech] || {});
  // Step down while a band has been failed twice and a lower one exists
  while((fails[target] || {}).fails >= MECH_FAILS_BEFORE_STEPDOWN){
    const lower = bands.filter(b => b < target).pop();
    if(!lower || masteredBandOf(mech) >= lower) break;
    target = lower;
  }
  // Parked: failed twice at the lowest reachable band recently → come back later
  const f = fails[target] || {};
  // Park duration grows with each further fail (7, 14, 21 d …) so a hard
  // mechanic stops stealing days from new ones.
  if(f.fails >= MECH_FAILS_BEFORE_STEPDOWN && f.lastAt && (Date.now() - f.lastAt) < MECH_PARK_DAYS * Math.max(1, f.fails - 1) * ONE_DAY_MS) return null;
  return {mech, band: target};
}
function noteMechAttempt(mech, band, passed){
  const a = store.mechAttempts = store.mechAttempts || {};
  const m = a[mech] = a[mech] || {};
  const f = m[band] = m[band] || {fails:0, lastAt:0};
  if(passed){ f.fails = 0; } else { f.fails++; }
  f.lastAt = Date.now();
}

/* Freshness: avoid re-serving a question the kid saw in the last 2 weeks,
   so mastery checks measure the mechanic, not answer memory. */
const RECENT_SEEN_DAYS = 14;
function isRecentlySeen(year, num){
  const t = (store.seenQ || {})[`${year}-${num}`];
  return !!t && (Date.now() - t) < RECENT_SEEN_DAYS * ONE_DAY_MS;
}

/* True when the last few test sessions show the kid is slow on the 3-pt
   block (avg > 75 s/question vs the 60 s budget) – routes to the sprint. */
function needsSpeedWork(){
  // a recent online paper whose 3-point block took > 20 min is the best evidence
  const lastC = (store.contests || []).filter(c => !c.paper).slice(-1)[0];
  if(lastC && lastC.timeByBand && Date.now() - lastC.when < 21 * ONE_DAY_MS && (lastC.timeByBand[3] || 0) > 20 * 60000) return true;
  const sessions = (store.sessions || []).slice(-3);
  let ms = 0, n = 0;
  for(const s of sessions){
    if(!s.bandTime || !s.questions) continue;
    const c = s.questions.filter(q => (q.difficulty || 3) === 3 && q.answered).length;
    if(!c) continue;
    ms += s.bandTime[3] || 0; n += c;
  }
  if(n < 5) return false;
  return (ms / n) > 75 * 1000;
}

/* Next NEW mechanic on the learning track: first unmastered one with
   enough archive content for a playlist. Null when everything is done. */
function nextMechanicToLearn(){
  const t = nextMechanicTarget();
  return t ? t.mech : null;
}
/* {mech, band} for the next playlist on the track, honouring per-band
   mastery, the foundation cap, step-downs and parking. */
/* First fully-mastered mechanic whose mastery has gone stale – the plan
   schedules its 2-question recheck instead of idling on mixed sets. */
function staleMechanicToRecheck(){
  for(const m of MECHANIC_ORDER){
    if(store.masteredMech && store.masteredMech[m] && isMechMasteryStale(m)) return m;
  }
  return null;
}
function nextMechanicTarget(){
  const phase = planPhase();
  const walk = ph => {
    for(const m of MECHANIC_ORDER){
      if(!MECHANIC_METHODOLOGY[m]) continue;
      if(archiveQsForMech(m, null).length < TRACK_MIN_QS) continue;
      const t = mechTargetFor(m, ph);
      if(t) return t;
    }
    return null;
  };
  // A long foundation (100+ days out) can finish every band-4 target
  // weeks before the build phase: lift the cap rather than idle on
  // mixed sets.
  return walk(phase) || (phase === "foundation" ? walk("build") : null);
}

// Set before a reload that must NOT be followed by a save: import and
// profile delete replace/remove the stored copy, and the beforeunload
// save would otherwise write the in-memory store right back over it.
let _storeFrozen = false;
function saveStore(s){
  if(_storeFrozen) return;

    localStorage.setItem(LS_KEY, JSON.stringify(s));

/* Phone back button + scroll (2026-10-17). Children leave a screen with the
   system back gesture, which used to close the whole app, and a new screen
   opened at the old scroll offset (mid-page). Every view change now starts
   at the top, and a non-home view holds one history entry: "back" closes an
   open picture, else presses the view's own exit button, so its cleanup
   (timers, mastery bookkeeping, game loops) runs exactly as on a tap. */
const NAV_EXIT_IDS = ["back","plBackTop","mbBack","pmBack","ciBack","ppBack","peBack","contestBack",
  "gateBack","parentBack","backBtn","planBack","recogQuit","recogHome","raceGameQuit","raceQuit",
  "raceHome","jumpQuit","pickHome","goHome","homeBtn","exitBtn"];
(function hookViewNavigation(){
  let view = state.view;
  const canHistory = () => typeof history !== "undefined" && history && typeof history.pushState === "function";
  const ensureEntry = () => {
    if(view !== "home" && canHistory() && !(history.state && history.state.kv)){
      try { history.pushState({kv: 1}, ""); } catch(_){}
    }
  };
  Object.defineProperty(state, "view", {
    enumerable: true,
    get(){ return view; },
    set(v){
      const changed = v !== view;
      view = v;
      if(!changed) return;
      try { if(typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0); } catch(_){}
      ensureEntry();
    },
  });
  if(typeof window === "undefined" || !window.addEventListener) return;
  window.addEventListener("popstate", () => {
    const zoom = document.querySelector(".fig-zoom");
    if(zoom){ zoom.remove(); ensureEntry(); return; }
    if(view === "home") return;
    const exit = document.querySelector("#app .nav-back")
      || NAV_EXIT_IDS.map(id => document.getElementById(id)).find(Boolean);
    if(exit) exit.click();
    else { state.view = "home"; renderHome(); }   // e.g. a running contest: it stays resumable
    ensureEntry();   // a cancelled exit (quiz confirm) keeps the screen – and its entry
  });
})();

function startTimer(totalMs){
  stopTimer();
  state.timerActive = true;
  state.timerTotalMs = totalMs;
  state.timerEndAt = Date.now() + totalMs;
  state._timerWarned = false;
  state._quizTimedOut = false;
  state.timerInterval = setInterval(()=>{
    if(state.view !== "quiz"){ return; }
    const left = state.timerEndAt - Date.now();
    if(left <= 0){
      stopTimer();
      // Auto-finish on timeout
      state._quizTimedOut = true;
      finishQuiz(true);
      return;
    }
    if(!state._timerWarned && left <= 60000){ state._timerWarned = true; Sfx.play("warn"); }
    // Re-render only the timer bar to avoid flashing options
    const bar = document.querySelector(".timer-bar");
    if(bar){
      const mins = Math.floor(left/60000);
      const secs = Math.floor((left%60000)/1000);
      const ratio = left/state.timerTotalMs;
      const cls = left < 60000 ? "warn" : (ratio > 0.5 ? "calm" : "");
      const clock = bar.querySelector(".clock");
      if(clock){
        clock.className = "clock " + cls;
        clock.textContent = `${mins}:${String(secs).padStart(2,"0")}`;
      }
    }
  }, 500);
}

function stopTimer(){
  if(state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval = null; }
  state.timerActive = false;
}
